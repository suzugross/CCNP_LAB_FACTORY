# glossary/junos.yml — Junos の語(BL-275・Junos トラック)。Junos での意味に限るものは books: [junos] で Junos の本だけで拾う。
# 説明は本文(J0 の実機と Juniper の公式文書で確かめた内容)と食い違わないように書く。

- id: junos-operational-mode
  term: {en: operational mode, ja: 運用モード}
  def:
    en: >-
      The Junos CLI mode you log in to, with the `>` prompt. You look at the router there (`show`, `ping`, `request`);
      you do not change its configuration.
    ja: >-
      ログインした時の Junos の CLI のモードで、プロンプトは `>`。ここではルータの様子を見る(`show`・`ping`・`request`)。
      設定は変えない。
  see: [junos-configuration-mode]
  books: [junos]

- id: junos-configuration-mode
  term: {en: configuration mode, ja: 設定モード}
  def:
    en: >-
      The Junos CLI mode you enter with `configure`, with the `#` prompt. You edit the candidate configuration there, and
      nothing changes on the router until you commit.
    ja: >-
      `configure` で入る Junos の CLI のモードで、プロンプトは `#`。ここで候補設定を編集する。commit するまでルータは何も変わらない。
  see: [candidate-configuration, junos-operational-mode]
  books: [junos]

- id: candidate-configuration
  term: {en: candidate configuration, ja: 候補設定}
  def:
    en: >-
      The working copy of the configuration that you edit in configuration mode. A commit checks it and makes it the
      active configuration. With a plain `configure`, everyone shares one candidate; `configure private` gives you your own.
    ja: >-
      設定モードで編集する、設定の作業用の写し。commit が検査し、動いている設定にする。ただの `configure` では全員が 1 つの
      候補設定を共有し、`configure private` では自分だけのものになる。
  see: [active-configuration, junos-commit-confirmed]
  books: [junos]

- id: active-configuration
  term: {en: active configuration, ja: 動いている設定}
  def:
    en: >-
      The configuration the router runs, shown by `show configuration` in operational mode. Each commit replaces it and
      saves the previous one as rollback 1; the router keeps the 50 most recent.
    ja: >-
      ルータが使っている設定で、運用モードの `show configuration` で見える。commit のたびに置き換わり、それまでの設定は
      rollback 1 として保存される。ルータは直近の 50 を持つ。
  see: [candidate-configuration, junos-rollback]
  books: [junos]

- id: junos-rollback
  term: rollback
  def:
    en: >-
      On Junos, `rollback n` loads saved configuration n (0 to 49) into the candidate configuration. It does not change
      the router by itself: you look at the result with `show | compare` and commit it.
    ja: >-
      Junos の `rollback n` は、保存された設定 n(0〜49)を候補設定へ読み込む。それだけではルータは変わらない。
      `show | compare` で結果を見て commit する。
  see: [active-configuration]
  books: [junos]

- id: junos-commit-confirmed
  term: commit confirmed
  def:
    en: >-
      A commit on probation. Unless you confirm it with `commit` or `commit check` within the minutes given (10 by default),
      the router loads the previous configuration, commits it and tells every logged-in user.
    ja: >-
      仮の commit。指定した分数(既定は 10 分)のうちに `commit` か `commit check` で確定しなければ、ルータは 1 つ前の設定を
      読み込んで commit し、ログインしている全員に知らせる。
  see: [candidate-configuration]
  books: [junos]

- id: logical-unit
  term: {en: logical unit, ja: 論理ユニット}
  aka: [logical units, logical interface, logical interfaces, 論理インターフェース]
  def:
    en: >-
      The part of a Junos interface that carries traffic and addresses, written after a dot (`et-0/0/0.0` is unit 0).
      Untagged traffic uses unit 0; on a VLAN-tagged port each unit has one VLAN ID.
    ja: >-
      Junos のインターフェースのうち、通信とアドレスを持つ部分で、点の後ろに書く(`et-0/0/0.0` はユニット 0)。タグの無い
      通信はユニット 0 を使い、VLAN タグ付きのポートではユニットごとに 1 つの VLAN ID を持つ。
  see: [protocol-family]
  books: [junos]

- id: protocol-family
  term: {en: protocol family, ja: プロトコル ファミリー}
  aka: [protocol families]
  def:
    en: >-
      What a Junos logical unit carries: `family inet` for IPv4, `family inet6` for IPv6, `family iso` for IS-IS and others.
      Addresses are configured under the family.
    ja: >-
      Junos の論理ユニットが運ぶものの種類。IPv4 は `family inet`、IPv6 は `family inet6`、IS-IS などは `family iso`。
      アドレスはファミリーの下に設定する。
  see: [logical-unit]
  books: [junos]

- id: inet0
  term: inet.0
  def:
    en: >-
      The Junos routing table for IPv4 unicast, where every protocol installs its routes; `inet6.0` is its IPv6 twin.
      Other tables appear for other purposes, such as `inet.3` for MPLS paths.
    ja: >-
      Junos の IPv4 ユニキャストの経路表で、どのプロトコルもここに経路を入れる。IPv6 版は `inet6.0`。MPLS の経路の `inet.3` など、
      用途ごとにほかの表も現れる。
  see: [route-preference]
  books: [junos]

- id: route-preference
  term: {en: preference, ja: preference}
  aka: [route preference]
  def:
    en: >-
      The Junos value that decides which source of a route wins, the counterpart of administrative distance; lower wins.
      The defaults differ from IOS: static 5, OSPF internal 10, OSPF external 150, BGP 170.
    ja: >-
      Junos で、どの出どころの経路を採るかを決める値。アドミニストレーティブ ディスタンスにあたり、小さいほうが勝つ。
      既定は IOS と違い、静的 5、OSPF の内部経路 10、外部経路 150、BGP 170。
  see: [inet0]
  books: [junos]

- id: default-routing-policy
  term: {en: default policy, ja: 既定のポリシー}
  aka: [default policies, default routing policy, default routing policies]
  def:
    en: >-
      The rule each Junos protocol follows until you configure your own policy: what it takes into the routing table and what
      it advertises. OSPF and IS-IS export nothing from the table by default, so a static route is not advertised.
    ja: >-
      自分でポリシーを設定するまで、Junos の各プロトコルが従う決まり。経路表に何を取り込み、何を広告するか。OSPF と IS-IS は既定では
      表から何も出さないので、静的経路は広告されない。
  see: [export-policy, route-preference]
  books: [junos]

- id: export-policy
  term: {en: export policy, ja: export ポリシー}
  def:
    en: >-
      A Junos routing policy that decides which routes from the routing table a protocol advertises. It is how Junos does
      what `redistribute` does on IOS.
    ja: >-
      経路表のどの経路をプロトコルが広告するかを決める Junos のルーティング ポリシー。IOS の `redistribute` にあたることを、Junos はこれで行う。
  see: [default-routing-policy, import-policy, policy-statement]
  books: [junos]

- id: import-policy
  term: {en: import policy, ja: import ポリシー}
  def:
    en: >-
      A Junos routing policy that decides which routes a protocol puts into the routing table, and with which attributes.
      With BGP it acts on the routes received from neighbours; a route it rejects stays in the table as hidden.
    ja: >-
      プロトコルが受け取った経路のどれを、どの属性で経路表に入れるかを決める Junos のルーティング ポリシー。BGP では隣から受け取った
      経路に効き、拒んだ経路は hidden として表に残る。
  see: [export-policy, policy-chain, hidden-route]
  books: [junos]

- id: policy-statement
  term: policy-statement
  aka: [policy statement, policy statements]
  def:
    en: >-
      A named Junos routing policy, written under `policy-options`. It is a list of terms, each a pair of `from` (the
      conditions) and `then` (the actions), checked from the top. It plays the part of a route map on IOS.
    ja: >-
      `policy-options` の下に書く、名前を付けた Junos のルーティング ポリシー。`from`(条件)と `then`(動作)の組の term を並べ、
      上から調べる。IOS の route-map にあたる。
  see: [terminating-action, policy-chain, route-filter]
  books: [junos]

- id: terminating-action
  term: {en: terminating action, ja: 終端の動作}
  aka: [terminating actions]
  def:
    en: >-
      An action that ends the evaluation in Junos, for the rest of a chain or list too: `accept` or `reject` in a policy, and
      `accept`, `discard` or `reject` in a firewall filter. Actions that only change attributes in a policy, or only count or
      record in a filter, do not end it.
    ja: >-
      Junos で評価を終わらせる動作。連鎖や並びの後ろも見なくなる。ポリシーでは `accept` と `reject`、firewall filter では
      `accept`・`discard`・`reject`。ポリシーで属性を変えるだけの動作や、フィルタで数える・記録するだけの動作は、評価を終わらせない。
  see: [policy-statement, policy-chain, firewall-filter]
  books: [junos]

- id: policy-chain
  term: {en: policy chain, ja: ポリシーの連鎖}
  aka: [policy chains]
  def:
    en: >-
      Several policies listed in one Junos import or export, such as `import [ A B ]`. They are evaluated in order until an
      `accept` or a `reject`; whatever none of them decides goes to the protocol's default policy.
    ja: >-
      Junos の 1 つの import・export に並べた複数のポリシー(`import [ A B ]` など)。`accept` か `reject` が出るまで順に評価し、
      どれも決めなかった経路はプロトコルの既定のポリシーへ渡る。
  see: [terminating-action, default-routing-policy]
  books: [junos]

- id: route-filter
  term: route-filter
  aka: [route filter, route filters, route-filters]
  def:
    en: >-
      A Junos policy condition on prefix and length: a prefix with a match type such as `exact`, `orlonger` or
      `prefix-length-range /16-/24`. Within one term, the one route filter that covers the route most specifically decides.
    ja: >-
      プレフィックスと長さの Junos のポリシーの条件。プレフィックスに `exact`・`orlonger`・`prefix-length-range /16-/24` などの
      一致の型を付けて書く。1 つの term の中では、経路をいちばん長く含む 1 本が決める。
  see: [match-type, junos-prefix-list, walkup]
  books: [junos]

- id: match-type
  term: {en: match type, ja: 一致の型}
  aka: [match types]
  def:
    en: >-
      The part of a Junos route filter that says which lengths match: `exact`, `orlonger`, `longer`, `upto`,
      `prefix-length-range`, `through` and others. It does the work of `ge` and `le` in an IOS prefix list.
    ja: >-
      Junos の route-filter のうち、どの長さに当たるかを決める部分。`exact`・`orlonger`・`longer`・`upto`・`prefix-length-range`・
      `through` など。IOS の prefix-list の `ge`・`le` の役をする。
  see: [route-filter]
  books: [junos]

- id: walkup
  term: walkup
  def:
    en: >-
      A Junos option (`set policy-options defaults route-filter walkup`) that lets a term with several route filters fall
      back to the shorter ones when the longest match does not fit its match type. It changes every policy on the router.
    ja: >-
      複数の route-filter を持つ term で、最長一致の 1 本の型が合わない時に、もっと短い route-filter も見るようにする Junos の設定
      (`set policy-options defaults route-filter walkup`)。ルータのすべてのポリシーの振る舞いが変わる。
  see: [route-filter]
  books: [junos]

- id: junos-prefix-list
  term: {en: prefix list, ja: prefix-list}
  aka: [prefix lists, prefix-list, prefix-lists]
  def:
    en: >-
      In Junos, a named list of prefixes under `policy-options`, with no permit, deny or length range. `from prefix-list`
      matches the prefixes themselves; `from prefix-list-filter` adds a match type. Firewall filters use the same lists
      (`source-prefix-list` and others), and `apply-path` can fill one from the configuration.
    ja: >-
      Junos では、`policy-options` の下に作る、名前を付けたプレフィックスの並び。permit・deny も長さの範囲も持たない。
      `from prefix-list` は並びのプレフィックスそのものに、`from prefix-list-filter` は一致の型を付けて当たる。
      firewall filter も同じ並びを使い(`source-prefix-list` など)、`apply-path` で設定から中身を拾える。
  see: [route-filter, apply-path]
  books: [junos]

- id: hidden-route
  term: {en: hidden route, ja: hidden の経路}
  aka: [hidden routes, hidden]
  def:
    en: >-
      A route that Junos keeps in the routing table but does not use, for example one rejected by an import policy. List them
      with `hidden`, as in `show route receive-protocol bgp neighbour hidden`; `extensive` shows the `Hidden reason`.
    ja: >-
      Junos が経路表に持っているが使っていない経路。import ポリシーが拒んだ経路など。`show route receive-protocol bgp 隣 hidden` のように
      `hidden` を付けて一覧し、`extensive` で `Hidden reason` が見える。
  see: [import-policy]
  books: [junos]

- id: aggregate-route
  term: {en: aggregate route, ja: 集約経路}
  aka: [aggregate routes]
  def:
    en: >-
      A summary route that Junos creates with `routing-options aggregate`. It is active (preference 130, next hop Reject)
      only while a contributing route exists within it, and goes out only when an export policy chooses it.
    ja: >-
      Junos が `routing-options aggregate` で作るまとめの経路。中に寄与する経路がある間だけ使われ(preference 130・次ホップ Reject)、
      export ポリシーが選んだ時だけ広告される。
  see: [contributing-route, export-policy]
  books: [junos]

- id: contributing-route
  term: {en: contributing route, ja: 寄与する経路}
  aka: [contributing routes]
  def:
    en: >-
      A more specific route within an aggregate route's range that keeps the aggregate active. With none left, the
      aggregate becomes hidden.
    ja: >-
      集約経路の範囲の中にあって、集約経路を使える状態に保つ、より細かい経路。1 本も無くなると集約経路は hidden になる。
  see: [aggregate-route]
  books: [junos]

- id: local-preference
  term: local-preference
  aka: [local preference, LOCAL_PREF]
  def:
    en: >-
      A BGP attribute used inside one AS to choose among routes to the same prefix: higher is preferred, and the default
      is 100. It is usually set by an import policy.
    ja: >-
      1 つの AS の中で、同じプレフィックスへの経路から選ぶための BGP の属性。大きいほど好まれ、既定は 100。たいてい import ポリシーで付ける。
  see: [bgp-community]
  books: [junos]

- id: bgp-community
  term: {en: community, ja: community}
  aka: [communities, コミュニティ]
  def:
    en: >-
      A tag carried with a BGP route, written as two numbers such as `65000:200`. Policies add it to mark routes and match
      it later. In Junos you name it first, with `set policy-options community name members 65000:200`.
    ja: >-
      BGP の経路に付けて運ぶ印で、`65000:200` のように 2 つの数で書く。ポリシーで付けて経路に印を付け、後で条件に使う。Junos では
      `set policy-options community 名前 members 65000:200` で先に名前を付ける。
  see: [local-preference]
  books: [junos]
  # 「community」は SNMP の語(automation.yml の snmp-community・XR の M13 のページ)と同じ表記なので、ページでも分ける。
  # BGP の community が出る Junos の単元を足したら、ここに足す。
  scope: ["1*-j1-*"]

- id: as-path-prepend
  term: {en: AS path prepending, ja: AS パスのプリペンド}
  aka: [as-path-prepend, prepend]
  def:
    en: >-
      Adding your own AS number to the front of a route's AS path more than once on export, so that the path looks longer to
      the neighbour and is less preferred. In Junos, `then as-path-prepend "65000 65000"`.
    ja: >-
      export の時に、経路の AS パスの先頭へ自分の AS 番号を重ねて足し、相手から見た道を長く見せて選ばれにくくすること。Junos では
      `then as-path-prepend "65000 65000"`。
  books: [junos]

- id: junos-evolved
  term: Junos OS Evolved
  def:
    en: >-
      The version of Junos that runs on Linux, used on ACX and PTX routers and some QFX switches. Its CLI and configuration
      are the same as those of Junos OS, which runs on FreeBSD.
    ja: >-
      Linux の上で動く Junos で、ACX・PTX のルータと一部の QFX のスイッチが使う。CLI と設定は、FreeBSD の上で動く Junos OS と同じ。
  books: [junos]

# ---------------------------------------------------------------- J2 firewall filter(2026-11-15)
- id: firewall-filter
  term: firewall filter
  aka: [firewall filters, stateless firewall filter, stateless firewall filters]
  def:
    en: >-
      A named set of packet rules in Junos, written under `firewall family inet` (or another family) as a list of terms with
      `from` and `then`. It is applied to an interface's logical unit as input or output, or to lo0 to protect the RE. It is
      stateless: every packet is judged on its own contents.
    ja: >-
      Junos のパケットの規則の集まりで、名前を付けて `firewall family inet`(ほかのファミリーも)の下に、`from` と `then` を持つ
      term を並べて書く。インターフェースの論理ユニットに input・output として当てるか、RE を守るために lo0 に当てる。
      ステートレスで、1 つずつのパケットをその中身だけで判断する。
  see: [implicit-discard, terminating-action, lo0-filter, acl]
  books: [junos]

- id: implicit-discard
  term: {en: implicit discard, ja: 暗黙の discard}
  def:
    en: >-
      The rule at the end of a Junos firewall filter (or of the last filter in a list): a packet that matches no term is dropped.
      It counts nothing; to count, write a last term with `count` and `discard`.
    ja: >-
      Junos の firewall filter の末尾(並べたときは最後のフィルタの末尾)の決まり。どの term にも当たらなかったパケットは捨てる。
      何も数えないので、数えるなら最後に `count` と `discard` の term を書く。
  see: [firewall-filter, filter-list]
  books: [junos]

- id: tcp-established
  term: tcp-established
  def:
    en: >-
      A Junos firewall filter condition that matches TCP packets with the ACK or RST bit set, that is, everything but the SYN that
      starts a connection. It is an alias for `tcp-flags "(ack | rst)"` and does not check the protocol, so pair it with `protocol tcp`.
    ja: >-
      TCP の ACK か RST のビットが立ったパケット(つなぎ始めの SYN 以外)に当たる、Junos の firewall filter の条件。
      `tcp-flags "(ack | rst)"` の別名で、プロトコルは確かめないので `protocol tcp` と組にする。
  see: [firewall-filter]
  books: [junos]

- id: lo0-filter
  term: {en: lo0 filter, ja: lo0 のフィルタ}
  aka: [lo0 filters, loopback filter]
  def:
    en: >-
      A firewall filter applied to the input of lo0. Every packet for the RE passes it, whichever interface the packet came in on,
      after that interface's own input filter. On Junos OS Evolved it does not act on traffic to the management port.
    ja: >-
      lo0 の入力に当てた firewall filter。RE 行きのパケットは、どのインターフェースから来ても、そのインターフェースの入力フィルタの
      後でここを通る。Junos OS Evolved では、管理ポートへの通信には効かない。
  see: [routing-engine, apply-path, mgmt-junos]
  books: [junos]

- id: routing-engine
  term: RE
  full: {en: Routing Engine, ja: Routing Engine}
  def:
    en: >-
      The part of a Juniper router that runs the routing protocols, the CLI and management, and computes the routing table.
      Packets are forwarded by the PFE; packets for the router itself go up to the RE.
    ja: >-
      Juniper のルータのうち、ルーティング プロトコル・CLI・管理を動かし、経路表を計算する部分。パケットの中継は PFE が行い、
      ルータ自身宛てのパケットが RE へ上がる。
  see: [pfe, lo0-filter]
  books: [junos]

- id: pfe
  term: PFE
  full: {en: Packet Forwarding Engine, ja: Packet Forwarding Engine}
  def:
    en: >-
      The part of a Juniper router that forwards packets at high speed and applies firewall filters to them. It handles far more
      traffic than the RE. The `log` action of a firewall filter keeps its records in a buffer here.
    ja: >-
      Juniper のルータのうち、パケットを高速に中継し、firewall filter を当てる部分。RE よりずっと多くの量を扱う。
      firewall filter の `log` の動作は、ここのバッファに記録を残す。
  see: [routing-engine]
  books: [junos]

- id: apply-path
  term: apply-path
  def:
    en: >-
      A way to fill a Junos prefix list from the configuration: write a path through the hierarchy with `<*>` where it varies,
      such as `system ntp server <*>`. `| display inheritance` shows what it expanded to.
    ja: >-
      Junos の prefix-list の中身を設定から拾う書き方。設定の階層の道筋を、変わる部分を `<*>` にして書く(`system ntp server <*>` など)。
      何に展開されたかは `| display inheritance` で見る。
  see: [junos-prefix-list, lo0-filter]
  books: [junos]

- id: filter-list
  term: {en: filter list, ja: フィルタの並び}
  aka: [filter lists, input-list, output-list]
  def:
    en: >-
      Several Junos firewall filters applied in one direction, such as `input-list [ A B ]`. They are checked in order, a packet that
      matches no term of one filter goes on to the next, and a terminating action ends the list. Junos builds one filter named
      after the interface, such as `et-0/0/1.0-inet-i`, and counts under that name.
    ja: >-
      1 つの向きに並べて当てた複数の Junos の firewall filter(`input-list [ A B ]` など)。順に調べ、1 つのフィルタのどの term にも
      当たらなかったパケットは次へ進み、終端の動作で終わる。Junos はインターフェースの名前を付けた 1 つのフィルタ
      (`et-0/0/1.0-inet-i` など)を組み立て、その名前で数える。
  see: [firewall-filter, implicit-discard, terminating-action]
  books: [junos]

- id: syslog-facility
  term: facility
  aka: [facilities]
  def:
    en: >-
      The class of where a syslog message comes from, such as `firewall`, `daemon` or `authorization`. A Junos syslog file names the
      facilities and the severity it records, as in `file fw-log firewall any`.
    ja: >-
      syslog のメッセージの出どころの分類(`firewall`・`daemon`・`authorization` など)。Junos の syslog のファイルは、
      記録する facility と重さ(severity)を `file fw-log firewall any` のように指定する。
  books: [junos]
  scope: ["2*-j2-*"]

- id: mgmt-junos
  term: mgmt_junos
  def:
    en: >-
      The routing instance of the management port on Junos OS Evolved. Management traffic uses it, and the lo0 filter does not
      act on it; a filter for management traffic goes on the management port itself.
    ja: >-
      Junos OS Evolved の管理ポートの経路表(routing instance)。管理の通信はこちらを使い、lo0 のフィルタはそこへは効かない。
      管理の通信を絞るフィルタは、管理ポートそのものに当てる。
  see: [lo0-filter, junos-evolved]
  books: [junos]

- id: stateless-filter
  term: {en: stateless, ja: ステートレス}
  def:
    en: >-
      Judging each packet on its own contents, without remembering connections. A stateless filter does not let a reply back in
      because the request went out; replies need their own rule.
    ja: >-
      つないだ相手を覚えず、1 つずつのパケットをその中身だけで判断すること。ステートレスなフィルタは、行きを通したからといって
      戻りを通さない。戻りには、それを通す規則が別に要る。
  see: [firewall-filter, tcp-established]
  books: [junos]
  scope: ["2*-j2-*"]

- id: copp
  term: CoPP
  full: {en: Control Plane Policing, ja: Control Plane Policing}
  def:
    en: >-
      In IOS, a QoS policy (a policy-map) applied to the control plane, which classifies the traffic for the router itself and
      limits its rate.
    ja: >-
      IOS で control plane に当てる QoS のポリシー(policy-map)。ルータ自身へ来る通信を分類し、量を制限する。
  see: [lo0-filter]
  books: [junos]

- id: lpts
  term: LPTS
  full: {en: Local Packet Transport Services, ja: Local Packet Transport Services}
  def:
    en: >-
      In IOS XR, the mechanism that delivers packets for the router itself to the right process and limits their rate per kind of
      traffic, without configuration.
    ja: >-
      IOS XR で、ルータ自身へ来るパケットを正しいプロセスへ渡し、種類ごとに量を制限する仕組み。設定しなくても働く。
  see: [mpp]
  books: [junos]

- id: mpp
  term: MPP
  full: {en: Management Plane Protection, ja: Management Plane Protection}
  def:
    en: >-
      In IOS XR, the feature that decides through which interfaces, and from which peers, management protocols such as SSH may come in.
    ja: >-
      IOS XR で、SSH などの管理のプロトコルが、どのインターフェースから・どの相手から入ってよいかを決める機能。
  see: [lpts]
  books: [junos]
