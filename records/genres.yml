# ============================================================
# ジャンル判定表（BL-114）。topologies/quota.py が読む。
#
#   ラボ  … problems/CATALOG.md の「分野」列のタグを、この表で大ジャンルへ畳む。
#            複数タグが当たったら **多数決**（同数なら quota.yml の genre_order 順）。
#   紙面  … answers/<ID>.md の「種別: `shape/kind`」行の shape を shapes: で引く。
#
# 新しいタグ・shape が増えたらここに1行足す（未知タグは other に落ちて警告が出る）。
# ============================================================

# --- ラボ: CATALOG の分野タグ → 大ジャンル ---------------------------------
tags:
  igp: [ospf, ospfv3, eigrp, rip, igp, routing, multi-area, multiarea, nssa,
        abr, cost, summarization, stub, sia, variance, feasible-successor,
        redistribution, route-filtering, prefix-list, distribute-list,
        as-path-filter, route-map, static-route, next-hop, query, named-mode,
        auto-summary, split-horizon, virtual-link]
  bgp: [bgp, ibgp, route-reflector, mp-bgp, vpnv4, as-path, aspath, community,
        med, weight, attributes, origin, synchronization, transit,
        path-selection, path-control, routing-policy, aggregation, confederation]
  vpn: [mpls, l3vpn, ldp, dmvpn, nhrp, mgre, gre, tunnel, ipsec, svti, ikev1,
        ikev2, crypto-map, vxlan, evpn, lisp, sd-access, sdwan, vrf, vrf-lite,
        route-leaking, address-family, pe-ce, overlay]
  services: [dhcp, dhcp-relay, dhcpv6, snmp, snmpv3, netflow, flexible-netflow,
             ip-sla, track, hsrp, fhrp, vrrp, glbp, qos, mqc, policing, shaping,
             llq, classification, monitoring, monitor, span, rspan, eem,
             telemetry, assurance, dns, bind9, nat, pat, snat, addressing,
             slaac, ipv6, dual-stack, link-local, health-check,
             performance-sla, syslog, ntp, pbr, first-hop-security]
  security: [acl, named-acl, vacl, sequence, filtering, filter, copp, aaa,
             radius, tacacs, urpf, anti-spoofing, security, firewall-policy,
             firewall-migration, md5, authentication, security-level,
             address-object, asa-config-reading, control-plane, hardening]
  l2: [l2, stp, mst, rstp, etherchannel, lag, spine-leaf, vlan, trunk, vtp]
  automation: [automation, ansible, python, restconf, netconf, yang, junos,
               multivendor, commit, api, git]

# ジャンル判定に使わない（どの問題にも付きうる汎用タグ）。多数決から除外する。
ignore_tags: [generated, troubleshooting, ts, build, lab, misc, server]

# --- 紙面: gen_paper_mcq の shape → 大ジャンル ------------------------------
shapes:
  igp: [chain, ring, mixed, redist, leakmap, v6redist, ospfv3pl, ospf, eigrp,
        mploop, riploop, no_seed, filter, missing, wrong_id]
  bgp: [bgpbest, bgpdbg, bgp]
  vpn: [dmvpn, mpls, l3vpn, vrf]
  services: [pbr, dhcp, snmp, netflow, ipsla, qos]
  security: [acl, aclv6, aaa, urpf, copp]
  l2: [stp, l2]
  automation: [netauto, restconf]

# --- ラボ: ID 接頭辞 → 大ジャンル（最後の手当て）----------------------------
# problem.yml も CATALOG も引けないとき（撤収済みで problems/<ID>/ が消えた
# 過去の GEN インスタンスなど）に使う。最長一致で引く。
families:
  igp: [GEN-OSPF, GEN-TWIST, GEN-AGG, GEN-PATH, GEN-TS, GEN-EIGRPCX,
        GEN-OSPFCX, GEN-OSPFV3CX, GEN-EIGRPV6CX, GEN-REDIST, GEN-REDISTRO,
        GEN-REDISTLOOP, GEN-REDISTMP, GEN-RDARENA, GEN-RDFIELD, GEN-CHAIN,
        GEN-DOJO-PREFIX, GEN-LOOPPOC]
  bgp: [GEN-BGPTS, GEN-BGPPATH, GEN-BGPRING, GEN-BGPRR, GEN-BGPCX,
        GEN-DOJO-ASPATH]
  vpn: [GEN-MPLSTS, GEN-MPLSEB, GEN-DMVPN, GEN-EGVRF, GEN-VRFMAZE, GEN-S2SVPN]
  services: [GEN-DHCPTS, GEN-FNFTS, GEN-DNSDHCP, GEN-DNSTS, GEN-SNMPTS]
  security: [GEN-URPF, GEN-AAAGRP, GEN-DOJO-ACL, RADIUS-]
  l2: [GEN-L2TS]
  automation: [NETAUTO-, JUNOS-]

# --- 明示指定（タグ・shape の推定より優先。問題ID or 紙面IDで指定）---------
overrides: {}
  # ENCOR-DHCP-01: services
