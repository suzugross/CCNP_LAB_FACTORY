# ============================================================
# 1日のノルマ定義（BL-114）。topologies/quota.py が読む。
# 値を変えたいときはここだけ直す（コード変更不要）。
# ============================================================

# 1日の切り替わり（JST）。"04:00" なら 深夜3:59 に解いた分は前日に計上される。
day_start: "04:00"

# 紙面（4択・記述など机上問題）の1日あたり最低問数。
# ★正誤は問わない（解いたことをノルマとする）。正答率は別に集計・表示する。
paper_per_day: 10

# ラボ（CML 実機）の1日あたり最低問数と、散らすべき最低ジャンル数。
# ★既定ではラボは「満点」でノルマ1問として計上する（途中点は「挑戦中」表示）。
lab_per_day: 3
lab_min_genres: 3
lab_require_full_score: true

# ジャンルの表示順（この順で残ジャンルを提示する）。
genre_order: [igp, bgp, vpn, services, security, l2, automation]
