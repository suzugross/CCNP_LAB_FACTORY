---
# 採点 1 回分（grade.yml から include される）。localhost で実行し、
# 各チェックのコマンドを delegate_to で対象ノードへ送って show を集め、
# grade.py(--gate) で判定する。全 PASS なら converged=true をセット。

# チェックは exec で収集方法が分かれる（既定 ios = show コマンド）。
#   exec: ios   … cisco.ios.ios_command を対象ノードで実行
#   exec: shell … Linux ノード(ZBX*/SRV*/PC*)で shell 実行（snmpget / dig / Zabbix API 照会など）。
#                 失敗コマンド(タイムアウト等)も stdout+stderr を採点対象にする。
# ラベルで指すコミット(IOS XR・BL-246)。チェックに `commit_label: M1-T3` があれば、コマンド中の `{label}` を
#   履歴の中で「M1-T3 か、やり直し用の M1-T3-2・M1-T3-3 …」のうち**いちばん新しいもの**に置き換える。
#   ★XR のラベルは使い回せず、特定のコミットだけを履歴から消すこともできない。正しいラベルを内容の足りない
#   コミットに付けてしまうと、ラベルを固定で見る採点では二度と通らない(2026-10-15 実発)。その抜け道。
#   該当が無ければ `commit_label` のままにする(そのチェックは自然に落ちる)。exec=ios の経路だけ。
- name: ラベルで指すコミットを解決する(commit_label があるチェックのノードの履歴を取る)
  cisco.ios.ios_command:
    commands: ["show configuration commit list"]
  delegate_to: "{{ item }}"
  loop: "{{ checks | default([]) | selectattr('commit_label', 'defined') | map(attribute='node') | unique | list }}"
  register: commit_lists
  changed_when: false
  failed_when: false

- name: ラベルを解決してコマンドを組み直す
  ansible.builtin.set_fact:
    checks_resolved: >-
      {{ checks_resolved | default([]) + [
           (item | combine({'command_tpl': item.command_tpl | default(item.command),
                            'command': (item.command_tpl | default(item.command)) | replace('{label}', resolved),
                            'label_used': resolved}))
           if item.commit_label is defined else item ] }}
  loop: "{{ checks | default([]) }}"
  loop_control: { label: "{{ item.name }}" }
  vars:
    lst: "{{ ((commit_lists.results | default([]) | selectattr('item', 'equalto', item.node) | map(attribute='stdout') | first | default([''])) or ['']) | first }}"
    found: "{{ lst | regex_findall('(?m)^\\s*\\d+\\s+(' ~ (item.commit_label | default('') | regex_escape) ~ '(?:-\\d+)?)\\s') }}"
    resolved: "{{ found | first | default(item.commit_label | default('')) }}"
  when: (checks | default([]) | selectattr('commit_label', 'defined') | list | length) > 0

- name: 解決後のチェックに差し替える
  ansible.builtin.set_fact:
    checks: "{{ checks_resolved }}"
    checks_resolved: []
  when: checks_resolved is defined and (checks_resolved | length) > 0

- name: 各チェックの show を対象ノードから取得 (exec=ios)
  cisco.ios.ios_command:
    commands: ["{{ item.command }}"]
  delegate_to: "{{ item.node }}"
  loop: "{{ checks | default([]) }}"
  loop_control: { label: "{{ item.node }}: {{ item.command }}" }
  register: collected
  changed_when: false
  # 機器が % エラーを返す show(例: SNMP未設定での `show snmp user` →
  # `%SNMP agent not enabled`)は ios_command がタスク失敗になる。
  # 採点はクラッシュでなく「そのチェックが0点」に落とすべきなので失敗を握り、
  # 下の payload 組み立てで msg(エラーテキスト)を stdout として採点に回す。
  failed_when: false
  when: (item.exec | default('ios')) == 'ios'

# exec: local … 採点機(localhost)でリポ直下から実行する(BL-246 M2)。実際にログインして許可/拒否を見る
#   topologies/login_probe.py など。ラボの資格情報は環境変数 LAB_USER / LAB_PASS で渡す。node は表示用。
#   shell と同じタスクで回すので、shell/local のチェックはチェックの並び順に実行される。
- name: 各チェックのコマンドを Linux ノードで実行 (exec=shell) / 採点機で実行 (exec=local)
  ansible.builtin.shell: "{{ item.command }}"
  args:
    chdir: "{{ repo if (item.exec | default('ios')) == 'local' else omit }}"
  delegate_to: "{{ 'localhost' if (item.exec | default('ios')) == 'local' else item.node }}"
  environment: "{{ {'LAB_USER': ansible_user, 'LAB_PASS': ansible_ssh_pass} if (item.exec | default('ios')) == 'local' else {} }}"
  loop: "{{ checks | default([]) }}"
  loop_control: { label: "{{ item.node }}: {{ item.command | truncate(60) }}" }
  register: collected_sh
  changed_when: false
  failed_when: false
  when: (item.exec | default('ios')) in ['shell', 'local']

# exec: junos … clab 側 Junos ノード(BL-061 複合ラボ)。network_cli 越しの CLI 実行。
# `| display json` 付きコマンドなら grade.py の parser: json で構造化採点できる。
- name: 各チェックのコマンドを Junos ノードで実行 (exec=junos)
  ansible.netcommon.cli_command:
    command: "{{ item.command }}"
  delegate_to: "{{ item.node }}"
  loop: "{{ checks | default([]) }}"
  loop_control: { label: "{{ item.node }}: {{ item.command | truncate(60) }}" }
  register: collected_jn
  changed_when: false
  failed_when: false
  when: (item.exec | default('ios')) == 'junos'

- name: 結果 JSON を組み立て（checks にこの試行の stdout を併合）
  vars:
    nl: "\n"   # Jinja の '\n' リテラルは実改行にならない(バックスラッシュ+n の2文字)ため YAML 側で定義
  ansible.builtin.set_fact:
    payload: >-
      {{ (payload | default([])) + [ checks[res_idx] | combine({'stdout':
           ((res.stdout[0] if res.stdout is defined
             else (res.msg | default('') | string))
            if not (res.skipped | default(false))
            else (((collected_jn.results[res_idx].stdout
                    | default(collected_jn.results[res_idx].msg | default('') | string)) | string)
                  if (checks[res_idx].exec | default('ios')) == 'junos'
                  else ((collected_sh.results[res_idx].stdout | default('')) ~ nl
                        ~ (collected_sh.results[res_idx].stderr | default(''))))) }) ] }}
  loop: "{{ collected.results }}"
  loop_control: { loop_var: res, index_var: res_idx, label: "{{ checks[res_idx].name }}" }
  when: collected.results is defined

- name: 大域不変条件用に各ノードの全 RIB を収集（invariants がある時のみ）
  cisco.ios.ios_command:
    commands: ["show ip route"]
  delegate_to: "{{ item }}"
  loop: "{{ rib_nodes | default([]) }}"
  loop_control: { label: "{{ item }}: show ip route" }
  register: ribs_collected
  changed_when: false
  when: (invariants | default([])) | length > 0

- name: ribs 辞書（node -> show ip route テキスト）を組み立て
  ansible.builtin.set_fact:
    ribs: "{{ dict((rib_nodes | default([])) | zip(ribs_collected.results | map(attribute='stdout') | map('first'))) }}"
  when: (invariants | default([])) | length > 0

- name: grade_input.json を書き出し（invariants 有=dict / 無=従来 list）
  ansible.builtin.copy:
    dest: "{{ gen_dir }}/grade_input.json"
    content: >-
      {{ ({'checks': (payload | default([])),
           'model': (gmodel | default({})),
           'ribs': (ribs | default({})),
           'invariants': (invariants | default([])),
           'genie_os': (genie_os | default('iosxe'))}
          if (invariants | default([])) | length > 0
          else (payload | default([]))) | to_nice_json }}

- name: "採点スクリプト実行（--gate: 全 PASS で rc=0 / 未充足で rc=3）"
  ansible.builtin.command:
    argv:
      - "{{ repo }}/.venv/bin/python3"
      - "{{ repo }}/topologies/grade.py"
      - "{{ gen_dir }}/grade_input.json"
      - "--gate"
  register: gr
  changed_when: false
  failed_when: false

- name: この試行の結果を記録
  ansible.builtin.set_fact:
    payload: []
    last_report: "{{ gr.stdout_lines }}"
    converged: "{{ gr.rc == 0 }}"

- name: 未収束なら次の試行まで待機（最終試行では待たない）
  ansible.builtin.pause:
    seconds: "{{ settle_delay | int }}"
  when:
    - not converged
    - (attempt | int) < (max_attempts | int) - 1
