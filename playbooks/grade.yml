---
# 採点: grading.yml の checks を実行し、合否とスコアを出力する。
# 使い方: ansible-playbook playbooks/grade.yml -e problem=ENCOR-OSPF-01
#         [-e max_attempts=10] [-e settle_delay=9]
#
# 収束待ち（アサート再試行型）:
#   show 取得 → topologies/grade.py で構造化判定 を、全チェック PASS になるか
#   max_attempts に達するまで settle_delay 秒間隔で繰り返す（OSPF/HSRP の収束待ち）。
#   判定は pyATS Genie 構造化 + フィールドアサート（部分文字列一致ではない）。

- name: 採点準備（基準読込・接続先解決）
  hosts: localhost
  gather_facts: false
  vars:
    repo: "{{ playbook_dir }}/.."
    problem_dir: "{{ repo }}/problems/{{ problem }}"
  tasks:
    - ansible.builtin.include_vars: { file: "{{ problem_dir }}/problem.yml", name: pmeta }

    # ★誤ったラボの採点の防止(containerlab)。CML の labid の照合は IOS の設定に焼いた指紋を見るが、Junos を白紙から
    #   組ませる問題では指紋を置けない。管理網は全ラボ共通なので、szk-cl01 の docker のラベルで「この問題のラボが動き、
    #   clab_nodes のアドレスと合う」ことを確かめ、外れたら採点しない(clab_topology を持つ問題すべて=複合ラボも)。
    - name: containerlab のラボを照合（clab_ops.py verify。外れたら採点を中止）
      ansible.builtin.command:
        argv: ["{{ repo }}/.venv/bin/python3", "{{ repo }}/topologies/clab_ops.py", "verify",
               "--repo", "{{ repo }}", "--problem", "{{ problem }}"]
      register: clab_verify
      changed_when: false
      failed_when: false
      when: pmeta.clab_topology is defined

    - name: containerlab のラボの照合結果
      ansible.builtin.assert:
        that: clab_verify.rc == 0
        fail_msg: "{{ (clab_verify.stdout_lines | default([])) + (clab_verify.stderr_lines | default([])) }}"
        success_msg: "{{ clab_verify.stdout | default('') }}"
      when: pmeta.clab_topology is defined

    # containerlab だけの問題(platform: clab・BL-274)は CML の生成物が無いので、採点の置き場をここで作る(照合が通った後)
    - name: 採点の置き場 topologies/_generated/<ID>/ を用意（containerlab だけの問題）
      ansible.builtin.file:
        path: "{{ repo }}/topologies/_generated/{{ problem }}"
        state: directory
        mode: "0755"
      when: (pmeta.platform | default('cml')) == 'clab'

    - name: variant パラメータを読み込む（params/<variant>.yml。無ければ未定義＝従来問題はparams不使用）
      ansible.builtin.include_vars:
        file: "{{ problem_dir }}/params/{{ variant | default('base') }}.yml"
        name: params
      when: (problem_dir ~ '/params/' ~ (variant | default('base')) ~ '.yml') is exists

    - name: grading をレンダリング（grading.yml.j2 があれば params で描画、無ければ静的 grading.yml）
      ansible.builtin.template:
        src: "{{ problem_dir }}/grading.yml.j2"
        dest: "{{ repo }}/topologies/_generated/{{ problem }}/grading.rendered.yml"
      when: (problem_dir ~ '/grading.yml.j2') is exists

    # ★-e checkpoint=<名前> で中間チェック用の problems/<ID>/grading.<名前>.yml を使う(BL-231)。
    #   途中のタスクが後のタスクに上書きされて最終状態に痕跡が残らない問題向け。
    #   ノルマには記録しない(記録は lab.sh grade = 本番採点だけ)。
    - ansible.builtin.include_vars:
        file: >-
          {{ (problem_dir ~ '/grading.' ~ checkpoint ~ '.yml') if (checkpoint | default('')) else
             ((problem_dir ~ '/grading.yml.j2') is exists | ternary(repo ~ '/topologies/_generated/' ~ problem ~ '/grading.rendered.yml', problem_dir ~ '/grading.yml')) }}
        name: grading
    - ansible.builtin.include_vars: { file: "{{ repo }}/topologies/_generated/{{ problem }}/mgmt_map.yml", name: mgmt_map }
      when: (pmeta.platform | default('cml')) != 'clab'

    - name: containerlab だけの問題は CML の mgmt_map を持たない（接続先は clab_nodes だけ）
      ansible.builtin.set_fact:
        mgmt_map: {}
      when: (pmeta.platform | default('cml')) == 'clab'

    - name: 収集方式を決定（problem.yml の access。既定 ssh / telnet・console=SSH不可ノード）
      ansible.builtin.set_fact:
        access: "{{ pmeta.access | default('ssh') }}"

    - name: 接続先マップ = mgmt_map ＋ clab ノード（problem.yml の clab_nodes。BL-061 複合ラボ）
      ansible.builtin.set_fact:
        hostmap: "{{ mgmt_map | combine(pmeta.clab_nodes | default({})) }}"

    - name: 各チェックに既定(genie_os 等)と接続先を併合した checks を作る
      ansible.builtin.set_fact:
        checks: >-
          {{ checks | default([]) + [
               (grading.defaults | default({})) | combine(item) | combine({'ansible_host': hostmap[item.node]})
             ] }}
      loop: "{{ grading.checks | default([]) }}"
      loop_control: { label: "{{ item.node }}: {{ item.name }}" }

    - name: 大域不変条件（軸1）= model / invariants / 採点対象ノードを確定
      ansible.builtin.set_fact:
        invariants: "{{ grading.invariants | default([]) }}"
        gmodel: "{{ grading.model | default({}) }}"
        genie_os: "{{ (grading.defaults | default({})).genie_os | default('iosxe') }}"
        rib_nodes: "{{ (grading.model | default({})).loopbacks | default({}) | dict2items | map(attribute='key') | list }}"

    - name: shell 採点ノード(Linux)を特定（指紋照合の取得方式振分け用）
      ansible.builtin.set_fact:
        shell_nodes: "{{ grading.checks | default([]) | selectattr('exec', 'defined')
                         | selectattr('exec', 'equalto', 'shell')
                         | map(attribute='node') | unique | list }}"

    - name: junos 採点ノード(clab)を特定（exec=junos。接続は network_cli / 指紋照合は対象外）
      ansible.builtin.set_fact:
        junos_nodes: "{{ grading.checks | default([]) | selectattr('exec', 'defined')
                         | selectattr('exec', 'equalto', 'junos')
                         | map(attribute='node') | unique | list }}"

    # BL-274 ②: Arista EOS(cEOS)は junos と同じ network_cli、FRR は SSH を持たないので採点機から
    #   clab_ops.py exec(szk-cl01 の docker exec で vtysh)で集める(_graded には入れない)。
    - name: eos・frr 採点ノード(clab)を特定（exec=eos / exec=frr）
      ansible.builtin.set_fact:
        eos_nodes: "{{ grading.checks | default([]) | selectattr('exec', 'defined')
                       | selectattr('exec', 'equalto', 'eos')
                       | map(attribute='node') | unique | list }}"
        frr_nodes: "{{ grading.checks | default([]) | selectattr('exec', 'defined')
                       | selectattr('exec', 'equalto', 'frr')
                       | map(attribute='node') | unique | list }}"

    - name: clab の採点ノード(IOS として登録しない)
      ansible.builtin.set_fact:
        clab_exec_nodes: "{{ junos_nodes + eos_nodes + frr_nodes }}"

    # ★採点先の古い SSH ホスト鍵を消す(2026-10-15 実発)。IOL は起動のたびに鍵を作り直すので、ラボを CML の画面から
    #   止めて再開すると known_hosts の鍵と食い違い、paramiko は host_key_checking=False でも「host key mismatch」で
    #   接続を拒む → その回の出力がエラー文になり、チェックが FAIL する。lab_up は起動時に消しているが、
    #   lab_up を通らない再開(CML の画面からの Start)では消えない。どのラボかは直後のラボ指紋の照合が守る。
    - name: 採点先の古い known_hosts エントリを削除
      ansible.builtin.command:
        argv: ["ssh-keygen", "-R", "{{ item }}"]
      loop: "{{ hostmap.values() | list | unique }}"
      changed_when: false
      failed_when: false
      when: access == 'ssh'

    - name: 採点対象ノードに ansible_host を付与（delegate 接続用・ssh のみ。checks＋invariant の全 RIB ノード）
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: _graded
        ansible_host: "{{ hostmap[item] }}"
        labid_exec: "{{ 'shell' if item in shell_nodes else 'ios' }}"
      loop: "{{ (checks | default([]) | map(attribute='node') | list) + rib_nodes | unique | list }}"
      loop_control: { label: "{{ item }} -> {{ hostmap[item] }}" }
      when: access == 'ssh' and item not in clab_exec_nodes

    # IOS XR ノード(BL-246): 収集は IOS と同じ ios_command で通るが、特権昇格(enable)は無い。
    #   become したままだと接続直後に `show privilege` を打って失敗し、その回の出力がエラー文になる
    #   (2026-10-12 実測)。XR はログインした時点で権限が決まるので become を切る。
    - name: IOS XR ノードは become しない（problem.yml の node_image_families が iosxr のノード）
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: _graded
        ansible_become: false
      # ★採点対象に入っているノードだけ(2026-10-18 実発: XR を見ないチェックポイントで XR01 が接続先なしで
      #   _graded に入り、指紋照合が「labid_exec is undefined」で止まった)
      loop: "{{ (pmeta.node_image_families | default({})) | dict2items | selectattr('value', 'equalto', 'iosxr') | map(attribute='key')
                | select('in', (checks | default([]) | map(attribute='node') | list) + (rib_nodes | default([]))) | list }}"
      when: access == 'ssh'

    - name: junos・eos ノードを登録（clab 側。vault の IOS 用接続変数をホスト変数で上書き）
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: _graded
        ansible_host: "{{ hostmap[item] }}"
        labid_exec: "{{ 'eos' if item in eos_nodes else 'junos' }}"
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: "{{ 'arista.eos.eos' if item in eos_nodes else 'junipernetworks.junos.junos' }}"
        # 認証: junos= vrnetlab の既定(local.yml の clab_node_*)・eos= containerlab の cEOS の既定 admin/admin
        ansible_user: "{{ (clab_eos_username | default('admin')) if item in eos_nodes else (clab_node_username | default('admin')) }}"
        ansible_password: "{{ (clab_eos_password | default('admin')) if item in eos_nodes else (clab_node_password | default('admin@123')) }}"
        ansible_ssh_pass: "{{ (clab_eos_password | default('admin')) if item in eos_nodes else (clab_node_password | default('admin@123')) }}"
        # ★EOS は enable する: containerlab の cEOS の既定の設定は `username admin privilege 15` だけで
        #   `aaa authorization exec default local` が無く、ログインすると特権レベル 1(`>`)になる
        #   (show running-config が「% Incomplete command」・2026-11-14 cEOS 4.37.0F で実測)。enable secret は無いので素通り。
        ansible_become: "{{ item in eos_nodes }}"
        ansible_become_method: enable
        # clab ラボは deploy のたびにホスト鍵が変わる(使い捨てVM)ため照合しない
        ansible_host_key_checking: false
        # 制御ホストから clab の管理網へ経路で届かない時(Wi-Fi のブリッジ越し等)は、clab ホストを踏み台にする。
        #   local.yml の clab_mgmt_jump(例 user@host)があれば ProxyCommand で通す。
        #   ★network_cli の paramiko はホスト変数の proxy_command を読まない(netcommon の内部実装が direct の値しか
        #   受け取らない・2026-11-14 実測で直接 TCP をつなぎに行き時間切れ)→ 踏み台の時だけ libssh にする。
        #   vault の ansible_network_cli_ssh_type: paramiko(IOS 用)はホスト変数で上書きされる。
        ansible_network_cli_ssh_type: "{{ 'libssh' if (clab_mgmt_jump | default('')) else omit }}"
        ansible_libssh_proxy_command: >-
          {{ ('ssh -o BatchMode=yes -o ConnectTimeout=10 -W %h:%p ' ~ clab_mgmt_jump)
             if (clab_mgmt_jump | default('')) else omit }}
      loop: "{{ junos_nodes + eos_nodes }}"
      loop_control: { label: "{{ item }} -> {{ hostmap[item] }} ({{ 'eos' if item in eos_nodes else 'junos' }})" }
      when: access == 'ssh'

    # ★BL-225: 採点前フック。problem.yml に `pre_grade: <repo 相対のスクリプト>` があれば、
    #   収束待ちの試行ループに入る前に **1 回だけ**実行する(回線断→待ち→確認→復旧のような
    #   動的試験は試行のたびに繰り返せないため)。スクリプトは結果をノード上のファイルに書き、
    #   checks はそれを読む。引数= 問題 ID。失敗しても採点は続行(該当チェックが落ちるだけ)。
    - name: 採点前フック（problem.yml の pre_grade）
      ansible.builtin.command:
        argv:
          - "{{ repo }}/.venv/bin/python3"
          - "{{ repo }}/{{ pmeta.pre_grade }}"
          - "{{ problem }}"
      environment:
        CCNP_USER: "{{ ansible_user }}"
        CCNP_PASS: "{{ ansible_ssh_pass }}"
      register: pre_grade_out
      changed_when: false
      failed_when: false
      when: pmeta.pre_grade is defined

    - name: 採点前フックの出力
      ansible.builtin.debug:
        msg: "{{ pre_grade_out.stdout_lines | default([]) + pre_grade_out.stderr_lines | default([]) }}"
      when: pmeta.pre_grade is defined

# === ラボ指紋の照合（誤ラボ採点の決定的防御） ================================
# baseline が焼き込んだ labid（IOS: alias exec labid / Linux: /etc/ccnp-lab-id）を
# 採点前に照合する。MGMT IP が別ラボに当たっていれば別ラボの labid が返り即中止＝
# 台帳バグ・teardown 漏れがあっても「別問題を静かに誤採点」は構造的に起きない。
# 指紋が無い(台帳導入前の旧build/到達不能)場合は警告のみで続行（後方互換）。
- name: ラボ指紋の照合（ssh のみ。telnet は collect_telnet.py 内 / console はラボ名解決で対象外）
  hosts: _graded
  gather_facts: false
  any_errors_fatal: true   # 1台でも別ラボ検知 → プレイブック全体を中止（採点に進まない）
  vars:
    expected_labid: "CCNP-LAB-{{ (problem | hash('md5'))[:8] }}"
  tasks:
    - name: labid を取得（IOS）
      cisco.ios.ios_command:
        commands: ["show running-config | include alias exec labid"]
      register: fp_ios
      changed_when: false
      failed_when: false
      when: labid_exec == 'ios'
    - name: labid を取得（Linux）
      ansible.builtin.command: cat /etc/ccnp-lab-id
      register: fp_sh
      changed_when: false
      failed_when: false
      when: labid_exec == 'shell'
    - name: 照合（別ラボの labid が返ったら採点中止）
      vars:
        fp_text: "{{ (fp_ios.stdout[0] if (fp_ios.stdout | default([])) | length > 0
                      else (fp_sh.stdout | default(''))) | default('') }}"
      ansible.builtin.assert:
        that: "(expected_labid in fp_text) or ('CCNP-LAB-' not in fp_text)"
        fail_msg: >-
          ★誤ラボ検知: {{ inventory_hostname }}({{ ansible_host }}) の labid は
          「{{ fp_text | trim }}」・期待は {{ expected_labid }}。MGMT IP が別ラボに
          当たっています。mgmt_alloc.py status / gc で台帳と CML を突合してください（採点を中止）。
        success_msg: >-
          {{ ('labid OK: ' ~ expected_labid) if expected_labid in fp_text
             else '指紋なし(台帳導入前の旧build or 到達不能)→照合スキップ' }}

- name: 収束待ち付き採点
  hosts: localhost
  gather_facts: false
  vars:
    repo: "{{ playbook_dir }}/.."
    gen_dir: "{{ repo }}/topologies/_generated/{{ problem }}"
    max_attempts: 10
    settle_delay: 9
  tasks:
    - name: 全チェック PASS まで（または最大試行まで）採点を繰り返す
      ansible.builtin.include_tasks:
        file: "{{ ('_grade_attempt_' ~ access ~ '.yml') if access in ['telnet', 'console'] else '_grade_attempt.yml' }}"
      loop: "{{ range(max_attempts | int) | list }}"
      loop_control:
        loop_var: attempt
        label: "attempt {{ attempt + 1 }}/{{ max_attempts }}"
      when: not (converged | default(false))

    - name: 最終結果
      ansible.builtin.debug:
        msg: "{{ last_report | default(['(採点未実行)']) }}"

    - name: 収束したか
      ansible.builtin.debug:
        msg: >-
          {{ '✅ 全チェック PASS で収束' if (converged | default(false))
             else '⚠ ' ~ (max_attempts | string) ~ ' 回試行しても全 PASS に至らず（上の未充足を参照）' }}
