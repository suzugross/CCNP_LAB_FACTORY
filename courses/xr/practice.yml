# 実践ページの対応表(scripts/course.sh が読む)。課題文の正本は problems/<ID>/task.en.md・task.md。
intro:
  en: |
    These are the tasks of lab **{problem}**, shown here so that you can read them away from the lab.
    Do them in the lab workspace: the **Tasks** tab there has a Check button, staged hints and,
    once a task passes, a reference solution for each task. No command examples are given on purpose.
  ja: |
    ラボ **{problem}** の課題です。ラボから離れた場所でも読めるように、ここに載せています。
    取り組むのはラボのワークスペースです。**Tasks** タブに、課題ごとの確認ボタン、段階式のヒント、
    通過後に開く模範解があります。コマンド例は意図して示していません。
