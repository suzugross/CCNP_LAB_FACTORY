# 自動生成 (gen_route_ctrl.py) seed=7914 shape=longer_only excl=acl_num e2o=rm_pl o2e=rm
problem: GEN-RTCTL-7914
total_points: 100
defaults:
  genie_os: iosxe
checks:
- name: '基線維持: RT01 の EIGRP 隣接が両フィードと確立している'
  node: RT01
  command: show ip eigrp neighbors
  raw:
  - contains: 10.1.12.2
  - contains: 10.1.13.2
  points: 2
- name: '基線維持: RT01-RT05 の OSPF 隣接が FULL である'
  node: RT01
  command: show ip ospf neighbor
  raw:
  - contains: FULL
  - contains: 10.1.15.2
  points: 2
- name: 'T1: RT05 の外部経路が指定の 2 経路のみである'
  node: RT05
  command: show ip route ospf
  raw:
  - regex: (?m)^O E2 +172\.22\.41\.0/25 \[110/
  - regex: (?m)^O E2 +172\.22\.42\.0/26 \[110/
  - not_contains: 172.22.40.0
  - not_contains: 172.22.43.0
  - not_contains: 172.22.28.0
  - not_regex: 10\.58\.
  - not_regex: 192\.168\.
  - not_regex: 10\.1\.(12|13|24|34)\.
  points: 9
- name: 'T1: 制約 — prefix-list PL-BRANCH24 が 1 行である'
  node: RT01
  command: show ip prefix-list PL-BRANCH24
  raw:
  - regex: 'ip prefix-list PL-BRANCH24: 1 entries'
  - contains: permit
  points: 4
- name: 'T1: 制約 — 再配送が route-map RM-E2O を参照している'
  node: RT01
  command: show running-config | section router ospf
  raw:
  - regex: redistribute eigrp 100 (subnets )?route-map RM-E2O
  points: 4
- name: 'T2: 192.168.58.0/24 が RT03 から学習されていない'
  node: RT01
  command: show ip route 192.168.58.0
  raw:
  - contains: 10.1.12.2
  - not_contains: 10.1.13.2
  points: 4
- name: 'T2: 192.168.144.0/24 が RT03 から学習されていない'
  node: RT01
  command: show ip route 192.168.144.0
  raw:
  - contains: 10.1.12.2
  - not_contains: 10.1.13.2
  points: 4
- name: 'T2: 巻き添えなし — 10.1.34.0/30 が RT03 直行のまま'
  node: RT01
  command: show ip route 10.1.34.0 255.255.255.252
  raw:
  - contains: 10.1.13.2
  - not_contains: 10.1.12.2
  points: 6
- name: 'T2: 巻き添えなし — 172.22.28.0/24 の ECMP(両フィード)が維持されている'
  node: RT01
  command: show ip route 172.22.28.0
  raw:
  - contains: 10.1.13.2
  - contains: 10.1.12.2
  points: 3
- name: 'T2: 制約 — 指定リスト 27 の distribute-list を Ethernet0/1 の in に適用'
  node: RT01
  command: show running-config | section router eigrp
  raw:
  - regex: distribute-list 27 in Ethernet0/1
  points: 4
- name: 'T2: 制約 — リスト 27 に deny エントリが無い(permit 列挙)'
  node: RT01
  command: show access-lists 27
  raw:
  - contains: permit
  - not_regex: '(?m)^\s*\d+ deny '
  points: 4
- name: 'T3: 10.58.29.0/24 が Ethernet0/0 経由で転送される'
  node: RT01
  command: show ip route 10.58.29.0
  raw:
  - contains: via Ethernet0/0
  - not_contains: Ethernet0/1
  points: 7
- name: 'T3: 10.58.40.0/24 が Ethernet0/1 経由で転送される'
  node: RT01
  command: show ip route 10.58.40.0
  raw:
  - contains: via Ethernet0/1
  - not_contains: Ethernet0/0
  points: 7
- name: 'T3: 10.58.29.0/24 の代替経路が topology table に残っている(切替可能)'
  node: RT01
  command: show ip eigrp topology 10.58.29.0/24
  raw:
  - contains: 1 Successor
  - contains: Ethernet0/0
  - contains: Ethernet0/1
  points: 3
- name: 'T3: 10.58.40.0/24 の代替経路が topology table に残っている(切替可能)'
  node: RT01
  command: show ip eigrp topology 10.58.40.0/24
  raw:
  - contains: 1 Successor
  - contains: Ethernet0/0
  - contains: Ethernet0/1
  points: 3
- name: 'T4: RT04 が 10.36.48.0/24 と 10.36.40.0/24 のみ外部学習(デコイ遮断)'
  node: RT04
  command: show ip route eigrp
  raw:
  - regex: (?m)^D EX +10.36.48.0/24
  - regex: (?m)^D EX +10.36.40.0/24
  - not_contains: 172.18.100.0
  - not_contains: 10.1.15.0
  points: 6
- name: 'T4: 制約 — route-map RM-FROM-OSPF と seed metric(distribute-list 不使用)'
  node: RT01
  command: show running-config | section router eigrp
  raw:
  - regex: redistribute ospf 1 metric 100000 100 255 1 1500(?!\d) route-map RM-FROM-OSPF
  - not_regex: distribute-list \S+ out ospf
  points: 4
- name: 'T4: 制約 — route-map RM-FROM-OSPF が ACL 81 を参照'
  node: RT01
  command: show running-config | section route-map
  raw:
  - regex: route-map RM-FROM-OSPF permit
  - regex: match ip address 81(?!\d)
  points: 2
- name: 'T5: 追加要件 — 10.36.44.0/24 が EIGRP ドメインへ届いている'
  node: RT04
  command: show ip route 10.36.44.0
  raw:
  - contains: Known via "eigrp 100"
  - contains: distance 170
  points: 4
- name: 'T5: ACL 81 が 3 permit(deny なし)である'
  node: RT01
  command: show access-lists 81
  raw:
  - contains: 10.36.48.0
  - contains: 10.36.40.0
  - contains: 10.36.44.0
  - not_regex: '(?m)^\s*\d+ deny '
  points: 4
- name: 'T6: RT04 から 10.36.48.1 への source 指定 ping が成功'
  node: RT04
  command: ping 10.36.48.1 source 172.22.41.1 repeat 5
  raw:
  - regex: Success rate is (80|100) percent
  points: 6
- name: '監査: RT02 の構成が変更されていない'
  node: RT02
  command: show running-config | include distribute-list|offset-list|route-map|redistribute
  raw:
  - not_regex: (distribute-list|offset-list|route-map|redistribute)
  points: 2
- name: '監査: RT03 の構成が変更されていない'
  node: RT03
  command: show running-config | include distribute-list|offset-list|route-map|redistribute
  raw:
  - not_regex: (distribute-list|offset-list|route-map|redistribute)
  points: 2
- name: '監査: RT04 の構成が変更されていない'
  node: RT04
  command: show running-config | include distribute-list|offset-list|route-map|redistribute
  raw:
  - not_regex: (distribute-list|offset-list|route-map|redistribute)
  points: 2
- name: '監査: RT05 の構成が変更されていない'
  node: RT05
  command: show running-config | include distribute-list|offset-list|route-map|redistribute
  raw:
  - not_regex: (distribute-list|offset-list|route-map|redistribute)
  points: 2
