# 自動生成 (gen_v6addr_build.py) seed=54910 worlds=A:W_MP,B:W_MA method=prefix
# telnet 収集。挙動採点(TS と同型)+LAN-B 供給源正当性+FHS 方式指紋+ROG/ポート無改変。
problem: GEN-V6BUILD-54910
total_points: 100
defaults:
  genie_os: iosxe
checks:
- name: 'LAN-A: 端末がサーバ管理アドレスを取得し OPEN'
  node: CLA
  command: show ipv6 dhcp interface Ethernet0/0
  raw:
  - regex: (?i)Address State is OPEN
  - regex: '(?i)Address\s*:\s*2001\:DB8\:22\:A:'
  points: 8
- name: 'LAN-A: サーバの binding に IA_NA 割当が存在'
  node: RT01
  command: show ipv6 dhcp binding
  raw:
  - regex: '(?i)Address\s*:\s*2001\:DB8\:22\:A:'
  points: 4
- name: 'LAN-A: RA が方針どおり停止されている (RT02・過剰解の防止)'
  node: RT02
  command: show ipv6 interface Ethernet0/1
  raw:
  - regex: (?i)RAs are suppressed \(all\)
  points: 4
- name: 'LAN-A: 端末が静的既定ゲートウェイを保持'
  node: CLA
  command: show running-config | include ^ipv6 route
  raw:
  - regex: (?i)(?m)^ipv6 route ::/0 \S+ FE80::1\s*$
  points: 4
- name: 'LAN-A: DNS/ドメインがサーバから配布されている'
  node: CLA
  command: show ipv6 dhcp interface Ethernet0/0
  raw:
  - regex: (?i)DNS server\s*:\s*2001\:DB8\:22\:1\:\:53
  - regex: (?i)Domain name\s*:\s*corp\.example
  points: 5
- name: 'LAN-A: 端末が静的既定経路を持ちサーバ Lo0 へ実疎通'
  node: CLA
  command: ping 2001:DB8:22:1::1 source Ethernet0/0 repeat 6
  raw:
  - regex: (?i)Success rate is (100|8[3-9]|9[0-9]) percent
  points: 5
- name: 'LAN-B: 端末が SLAAC でグローバルアドレスを自動生成 (EUI-64)'
  node: CLB
  command: show ipv6 interface brief Ethernet0/0
  raw:
  - regex: (?i)2001\:DB8\:22\:B:[0-9A-Fa-f:]*[Aa]8[Bb][Bb]:CCFF:FE
  points: 8
- name: 'LAN-B: 端末がサーバ管理アドレスを取得し OPEN'
  node: CLB
  command: show ipv6 dhcp interface Ethernet0/0
  raw:
  - regex: (?i)Address State is OPEN
  - regex: '(?i)Address\s*:\s*2001\:DB8\:22\:B:'
  points: 8
- name: 'LAN-B: サーバの binding に IA_NA 割当が存在'
  node: RT01
  command: show ipv6 dhcp binding
  raw:
  - regex: '(?i)Address\s*:\s*2001\:DB8\:22\:B:'
  points: 4
- name: 'LAN-B: 管理アドレスと自動生成アドレスが併存'
  node: CLB
  command: show ipv6 interface brief Ethernet0/0
  raw:
  - regex: (?i)2001\:DB8\:22\:B:[0-9A-Fa-f:]*[Aa]8[Bb][Bb]:CCFF:FE
  points: 4
- name: 'LAN-B: DNS/ドメインがサーバから配布されている'
  node: CLB
  command: show ipv6 dhcp interface Ethernet0/0
  raw:
  - regex: (?i)DNS server\s*:\s*2001\:DB8\:22\:1\:\:53
  - regex: (?i)Domain name\s*:\s*corp\.example
  points: 5
- name: 'LAN-B: 端末が既定経路を持ちサーバ Lo0 へ実疎通'
  node: CLB
  command: ping 2001:DB8:22:1::1 source Ethernet0/0 repeat 6
  raw:
  - regex: (?i)Success rate is (100|8[3-9]|9[0-9]) percent
  points: 5
- name: 'LAN-B: 未認可の高優先ルータ広告が端末に届いていない (正規 GW のみ)'
  node: CLB
  command: show ipv6 routers
  raw:
  - not_regex: (?i)Preference=High
  - regex: (?i)Preference=Medium
  points: 7
- name: 'LAN-B: 端末に偽プレフィックスのアドレスが無い'
  node: CLB
  command: show ipv6 interface brief Ethernet0/0
  raw:
  - not_regex: '(?i)2001\:DB8\:22\:BAD:'
  points: 4
- name: 'SWB: RA Guard が有効 (ポリシーが適用されている)'
  node: SWB
  command: show device-tracking policies
  raw:
  - regex: (?i)(?m)^.+\s(PORT|VLAN)\s+\S+\s+RA guard
  points: 4
- name: 'SWB: DHCPv6 Guard が有効 (ポリシーが適用されている)'
  node: SWB
  command: show device-tracking policies
  raw:
  - regex: (?i)(?m)^.+\s(PORT|VLAN)\s+\S+\s+DHCP Guard
  points: 4
- name: 'SWB: 要件どおりの方式(許可プレフィックスリスト方式)で不正 RA が遮断されている (drop 理由の指紋)'
  node: SWB
  command: show device-tracking counters all
  raw:
  - regex: (?i)RA guard:[\s\S]*?reason:\s+Unauthorized prefix in prefix list
  points: 5
- name: 'SWB: ROG 接続ポートが稼働中 (ポート閉塞による解決は不可)'
  node: SWB
  command: show interfaces status
  raw:
  - regex: (?i)(?m)^Et0/2\s+.*\sconnected\s
  points: 4
- name: 'ROG: 他部署機器が無改変 (RA/DHCPv6 設定と IF が初期状態のまま)'
  node: ROG
  command: show running-config interface Ethernet0/0
  raw:
  - regex: (?i)ipv6 nd router-preference High
  - regex: (?i)ipv6 dhcp server GUEST
  - not_regex: (?i)(?m)^\s*shutdown
  - not_regex: (?i)ra suppress
  points: 8
