- name: 'SW02: 各 SVI の受信方向に命名規約どおりの ACL を適用'
  node: SW02
  command: show ip interface | include line protocol|Inbound  access list
  raw:
  - regex: (?m)^Vlan130 is up[^\n]*\n\s*Inbound\s+access list is ACL-ACCT-IN\s*$
  - regex: (?m)^Vlan20 is up[^\n]*\n\s*Inbound\s+access list is ACL-PLAN-IN\s*$
  - regex: (?m)^Vlan120 is up[^\n]*\n\s*Inbound\s+access list is ACL-GA-IN\s*$
  - regex: (?m)^Vlan230 is up[^\n]*\n\s*Inbound\s+access list is ACL-IT-IN\s*$
  - regex: (?m)^Vlan240 is up[^\n]*\n\s*Inbound\s+access list is ACL-GUEST-IN\s*$
  - regex: (?m)^Vlan30 is up[^\n]*\n\s*Inbound\s+access list is ACL-PRINT-IN\s*$
  - regex: (?m)^Vlan170 is up[^\n]*\n\s*Inbound\s+access list is ACL-SERVER-IN\s*$
  - regex: (?m)^Vlan110 is up[^\n]*\n\s*Inbound\s+access list is ACL-MGMT-IN\s*$
  points: 1
  via: console
- name: 'SW02: VLAN 間 ACL の許可/拒否が要件どおり (意味評価・8 本)'
  node: SW02
  command: show ip access-lists
  points: 2
  acl_vectors:
    acls:
    - acl: ACL-ACCT-IN
      vectors: *id001
    - acl: ACL-PLAN-IN
      vectors: *id002
    - acl: ACL-GA-IN
      vectors: *id003
    - acl: ACL-IT-IN
      vectors: *id004
    - acl: ACL-GUEST-IN
      vectors: *id005
    - acl: ACL-PRINT-IN
      vectors: *id006
    - acl: ACL-SERVER-IN
      vectors: *id007
    - acl: ACL-MGMT-IN
      vectors: *id008
  via: console
