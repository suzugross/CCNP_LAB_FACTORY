# J1-3: JUN02 が ISP から受け入れるのは 0/0・192.0.2.0/24・198.51.100.0/24・203.0.113.0/24 だけ(私的・共有・ベンチマーク用・/24 より長いものは import で拒む)・J1-2 の既定経路は保たれる。
problem: JNT-02
total_points: 100
checks:
  - name: "J1-3 JUN02: the default route and the three public /24 routes are accepted"
    node: JUN02
    exec: junos
    command: "show route receive-protocol bgp 10.0.23.2 table inet.0"
    raw:
      - regex: '\*\s+0\.0\.0\.0/0\s'
      - regex: '\*\s+192\.0\.2\.0/24\s'
      - regex: '\*\s+198\.51\.100\.0/24\s'
      - regex: '\*\s+203\.0\.113\.0/24\s'
    points: 25
  - name: "J1-3 JUN02: the private, shared, benchmarking and longer-than-/24 routes are rejected by import policy"
    node: JUN02
    exec: junos
    command: "show route receive-protocol bgp 10.0.23.2 hidden table inet.0"
    raw:
      - regex: '10\.200\.0\.0/16\s'
      - regex: '172\.31\.0\.0/16\s'
      - regex: '192\.168\.50\.0/24\s'
      - regex: '100\.64\.0\.0/10\s'
      - regex: '198\.18\.0\.0/15\s'
      - regex: '198\.51\.100\.128/25\s'
    points: 25
  - name: "J1-3 JUN02: none of those routes is in use"
    node: JUN02
    exec: junos
    command: "show route protocol bgp table inet.0"
    raw:
      - not_regex: '(10\.200\.0\.0/16|172\.31\.0\.0/16|192\.168\.50\.0/24|100\.64\.0\.0/10|198\.18\.0\.0/15|198\.51\.100\.128/25)\s+\*\['
    points: 25
  - name: "J1-3 JUN01: the default route from J1-2 is still there"
    node: JUN01
    exec: junos
    command: "show route 0.0.0.0/0 exact table inet.0"
    raw:
      - regex: '0\.0\.0\.0/0\s+\*\[OSPF/150\]'
    points: 25
