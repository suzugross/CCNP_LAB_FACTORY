# JNT-02 の本採点(J1 の 5 課題の到達点)。学習ラボなのでノルマには数えない使い方をする(確認は学習モードの確認ボタン= grading.j1t*.yml)。
problem: JNT-02
total_points: 100
checks:
  - name: "J1-1 JUN02: 172.16.10.0/24 and 172.16.20.0/24 (metric 20) come from JUN01 as OSPF external routes, 172.16.99.0/24 does not"
    node: JUN02
    exec: junos
    command: "show ospf database external extensive"
    raw:
      - regex: 'Extern\s+172\.16\.10\.0\s+192\.168\.0\.1\s'
      - regex: 'Extern\s+172\.16\.20\.0\s+192\.168\.0\.1\s[^\n]*\n[^\n]*\n[^\n]*\n\s+Type: \d, Metric: 20,'
    points: 10
  - name: "J1-1 JUN02: the test network 172.16.99.0/24 is not in the routing table"
    node: JUN02
    exec: junos
    command: "show route 172.16.99.0/24 table inet.0"
    raw:
      - not_regex: '172\.16\.99\.0/24'
    points: 5
  - name: "J1-1 JUN01: OSPF does not run on et-0/0/1"
    node: JUN01
    exec: junos
    command: "show ospf interface"
    raw:
      - regex: 'et-0/0/0\.0'
      - not_regex: 'et-0/0/1'
    points: 5
  - name: "J1-2 JUN01: a default route is learned through OSPF from JUN02"
    node: JUN01
    exec: junos
    command: "show route 0.0.0.0/0 exact table inet.0"
    raw:
      - regex: '0\.0\.0\.0/0\s+\*\[OSPF/150\][^\n]*\n\s+>\s+to 10\.0\.12\.2 via et-0/0/0\.0'
    points: 10
  - name: "J1-2 JUN02: the default route in use is the one from the ISP (BGP)"
    node: JUN02
    exec: junos
    command: "show route 0.0.0.0/0 exact table inet.0"
    raw:
      - regex: '0\.0\.0\.0/0\s+\*\[BGP/170\]'
    points: 5
  - name: "J1-2 JUN01: no other route from the ISP is in OSPF"
    node: JUN01
    exec: junos
    command: "show ospf database external"
    raw:
      - regex: 'Extern\s+0\.0\.0\.0\s+192\.168\.0\.2\s'
      - not_regex: 'Extern\s+(203\.0\.113|198\.51\.100|192\.0\.2|198\.18|10\.200|100\.64|192\.168\.50|172\.31)\.\S*\s+192\.168\.0\.2\s+\S+\s+(?!3600\s)\d+'
    points: 5
  - name: "J1-3 JUN02: only the default route and the three public /24 routes are accepted from the ISP"
    node: JUN02
    exec: junos
    command: "show route receive-protocol bgp 10.0.23.2 table inet.0"
    raw:
      - regex: '\*\s+0\.0\.0\.0/0\s'
      - regex: '\*\s+192\.0\.2\.0/24\s'
      - regex: '\*\s+198\.51\.100\.0/24\s'
      - regex: '\*\s+203\.0\.113\.0/24\s'
      - not_regex: '\*\s+(10\.200\.0\.0/16|172\.31\.0\.0/16|192\.168\.50\.0/24|100\.64\.0\.0/10|198\.18\.0\.0/15|198\.51\.100\.128/25)\s'
    points: 15
  - name: "J1-3 JUN02: the other routes are rejected by import policy (hidden)"
    node: JUN02
    exec: junos
    command: "show route receive-protocol bgp 10.0.23.2 hidden table inet.0"
    raw:
      - regex: '10\.200\.0\.0/16\s'
      - regex: '172\.31\.0\.0/16\s'
      - regex: '192\.168\.50\.0/24\s'
      - regex: '100\.64\.0\.0/10\s'
      - regex: '198\.18\.0\.0/15\s'
      - regex: '198\.51\.100\.128/25\s'
    points: 5
  - name: "J1-4 JUN02: only 172.16.0.0/16 is advertised to the ISP"
    node: JUN02
    exec: junos
    command: "show route advertising-protocol bgp 10.0.23.2"
    raw:
      - regex: '172\.16\.0\.0/16\s+Self'
      - not_regex: '172\.16\.\d+\.0/24|192\.168\.0\.\d+/32|10\.0\.(12|23)\.\d+/\d+|0\.0\.0\.0/0'
    points: 10
  - name: "J1-4 FRR1: the AS path of 172.16.0.0/16 is 65000 65000 65000"
    node: FRR1
    exec: frr
    command: "show bgp ipv4 unicast 172.16.0.0/16"
    raw:
      - regex: '(?m)^\s+65000 65000 65000(,|\s*$)'
    points: 5
  - name: "J1-4 SRV1: the server network (172.16.20.1) reaches the ISP's loopback (203.0.113.1)"
    node: SRV1
    exec: local
    command: ".venv/bin/python3 topologies/clab_ops.py exec --repo . --problem JNT-02 --node SRV1 -- ping -c 5 -W 1 -I 172.16.20.1 203.0.113.1"
    raw:
      - regex: '\b5 (packets )?received'
    points: 10
  - name: "J1-5 JUN02: 203.0.113.0/24 carries community 65000:100 and local preference 200"
    node: JUN02
    exec: junos
    command: "show route 203.0.113.0/24 exact detail table inet.0"
    raw:
      - regex: 'Communities: 65000:100'
      - regex: 'Localpref: 200'
    points: 10
  - name: "J1-5 JUN02: the other accepted routes keep local preference 100 and carry no community"
    node: JUN02
    exec: junos
    command: "show route protocol bgp table inet.0 detail"
    raw:
      - not_regex: '(?s)(0\.0\.0\.0/0|192\.0\.2\.0/24|198\.51\.100\.0/24) \(\d+ entr[^)]*\)(?:(?!\n\S).)*?(Communities:|Localpref: (?!100\b))'
      - regex: '(?s)192\.0\.2\.0/24 \(\d+ entr(?:(?!\n\S).)*?Localpref: 100\b'
    points: 5
