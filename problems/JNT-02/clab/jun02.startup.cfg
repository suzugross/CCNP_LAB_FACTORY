/* JNT-02 JUN02 の初めの設定(J0 の範囲＋ISP との eBGP のセッション。ポリシーは無い)。vrnetlab の init.conf へ連結される。
   ★形式は階層(カーリー)必須。mgmt と認証は init.conf 側が持つ。 */
interfaces {
    et-0/0/0 {
        description "to JUN01";
        unit 0 {
            family inet {
                address 10.0.12.2/30;
            }
        }
    }
    et-0/0/1 {
        description "to ISP (FRR1)";
        unit 0 {
            family inet {
                address 10.0.23.1/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.168.0.2/32;
            }
        }
    }
}
routing-options {
    router-id 192.168.0.2;
    autonomous-system 65000;
}
protocols {
    bgp {
        group ISP {
            type external;
            peer-as 64500;
            neighbor 10.0.23.2;
        }
    }
    ospf {
        area 0.0.0.0 {
            interface et-0/0/0.0;
            interface lo0.0 {
                passive;
            }
        }
    }
}
