# XRT-08: XR トラック M8 追補 Unified MPLS(SPCOR 3.1.d)。BL-246。設計= problems/_drafts/XR-TRACK.design.md §21(PoC= _POC-XRUMPLS)。
# 学習目的のラボ(パック・ノルマの対象外)。初期状態= XRT-07(M8-1〜5)を解き終えた状態+アクセスの領域+仕込み。
# 盤面= XRT-07 の四角形の XR01 の先にアクセスの領域を足す。
#   RT05(アクセスの PE) Et0/0 ── Et0/1 RT04(アクセスの P) Et0/0 ── Gi0/0/0/2 XR01(境界) ── RT01/RT03(コアの P) ── RT02(コアの PE)
# アクセスの IGP= IS-IS ACCESS(エリア 49.0002)。コアの IS-IS CORE とは経路を交換しない(XR01 の Lo0 だけはアクセスにも見せる)。
# お客さま A(RT02 10.20/16)⇔ B(RT05 10.50/16)は PE 同士の直接の iBGP(据え付け)が運び、XR01 は PE のループバックを BGP ラベル付きユニキャストで運ぶ。
# 仕込み(XR01)= M8-7: 前任者の LU の設定(近隣 2 つ・route-reflector-client・next-hop-self)だけ。enforce-modifications と allocate-label が無い。
# ★XR01 は XRd(§21.5= ラベル付きの通過なら TCP も正常。PE 同士の iBGP は XR01 をラベル付きで通り抜ける)。
id: XRT-08
title: "XR Track 08 — Unified MPLS"
exam: SP
topics: [iosxr, mpls, ldp, isis, bgp, tutorial]
difficulty: 3
topology: generated
access: ssh
target_nodes: [XR01, RT01, RT02, RT03, RT04, RT05]
points: 100
image_family: iol
node_image_families: { XR01: iosxr }
node_xr_platforms: { XR01: iosxrd }
grade_attempts: 2
# やり直し(lab.sh reset)の後に流す行。XR01 を戻すとアクセスへの経路が消えるが、RT02⇔RT05・RT05⇔XR01 の BGP セッションは
# 保持時間(180 秒)のあいだ古い経路ごと残り、M8-7 の確認が白紙でも一部通る(実測 35 点)→ その場で消す
xr_reset_exec:
  XR01: ['clear bgp 10.255.0.15']
  RT02: ['clear ip bgp 10.255.0.15']
  RT05: ['clear ip bgp *']
lab:
  # 横一列(左= アクセス・右= コア)。コアは XRT-07 と同じ四角形
  positions: { RT05: [-800, 0], RT04: [-400, 0], XR01: [0, 0], RT01: [400, 0], RT03: [0, 240], RT02: [400, 240] }
  links:
    - { a: XR01, a_if: 3, b: RT01, b_if: 0 }
    - { a: RT01, a_if: 1, b: RT02, b_if: 0 }
    - { a: XR01, a_if: 4, b: RT03, b_if: 0 }
    - { a: RT03, a_if: 1, b: RT02, b_if: 1 }
    - { a: XR01, a_if: 5, b: RT04, b_if: 0 }
    - { a: RT04, a_if: 1, b: RT05, b_if: 0 }
