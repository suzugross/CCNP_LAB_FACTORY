# XRT-07 最終確認(M8 の 5 課題を終えた状態。配点= M8-1 25・M8-2 20・M8-3 20・M8-4 20・M8-5 15)。
# 学習目的のラボ= パック・ノルマの対象外。中身は課題ごとの確認(grading.<課題>.yml)を寄せ集めて配点を付け直したもの
# (手で保守する。課題ごとの確認を直したらここも直す)。白紙で通る項目は無い。
# ★exec: local のチェック(採点のあいだだけ故障を起こす)は、show のチェックがすべて済んだ後に並び順で走る。
#   順= M8-3(RT01 Et0/0 で no mpls ip → 25 秒 → 戻して 30 秒)→ M8-4(XR01-RT01 を loss 100 → 45 秒 → 戻して 45 秒)→ M8-4(Up time)。
problem: XRT-07
total_points: 100
checks:
- name: 'M8-1 XR01: LDP runs on both core links'
  node: XR01
  command: show mpls interfaces
  raw:
  - regex: GigabitEthernet0/0/0/0\s+Yes
  - regex: GigabitEthernet0/0/0/1\s+Yes
  points: 5
- name: 'M8-1 XR01: identifies itself in LDP with its Loopback0 address (LDP ID and transport address)'
  node: XR01
  command: show mpls ldp parameters
  raw:
  - regex: 'Router ID: 10\.255\.0\.1\s'
  - regex: 'Transport address:\s*\n\s*IPv4: 10\.255\.0\.1\s'
  points: 5
- name: 'M8-1 RT01: the LDP session with XR01 is operational, over XR01''s Loopback0'
  node: RT01
  command: show mpls ldp neighbor 10.255.0.1
  raw:
  - regex: 'Peer LDP Ident: 10\.255\.0\.1:0'
  - regex: 'TCP connection: 10\.255\.0\.1\.\d+ - 10\.255\.0\.11\.\d+'
  - regex: 'State: Oper'
  points: 5
- name: 'M8-1 XR01: traffic for RT02 leaves on PRIMARY with a label'
  node: XR01
  command: show mpls forwarding prefix 10.255.0.12/32
  raw:
  - regex: \d+\s+\d+\s+10\.255\.0\.12/32\s+Gi0/0/0/0
  points: 5
- name: 'M8-1 XR01: customer A''s networks reach each other across the core'
  node: XR01
  command: ping 10.20.0.1 source Loopback100 count 5
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 5
- name: 'M8-2 XR01: the LDP session with RT03 is operational and authenticated'
  node: XR01
  command: show mpls ldp neighbor 10.255.0.13:0
  raw:
  - regex: 'TCP connection: [^\n]*MD5 on'
  - regex: 'State: Oper'
  points: 6
- name: 'M8-2 RT03: uses its password on the session with XR01'
  node: RT03
  command: show mpls ldp neighbor 10.255.0.1 detail
  raw:
  - regex: 'Password: required, neighbor, in use'
  - regex: 'State: Oper'
  points: 4
- name: 'M8-2 RT01: receives labels from XR01 for host routes only'
  node: RT01
  command: show mpls ldp bindings neighbor 10.255.0.1
  raw:
  - regex: 'lib entry: 10\.255\.0\.12/32'
  - not_regex: 'lib entry: [\d.]+/(?:[0-9]|[12][0-9]|3[01]),'
  points: 8
- name: 'M8-2 XR01: customer A''s networks still reach each other'
  node: XR01
  command: ping 10.20.0.1 source Loopback100 count 5
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 2
- name: 'M8-3 XR01: IS-IS waits for LDP on both core links'
  node: XR01
  command: show isis interface
  raw:
  - regex: GigabitEthernet0/0/0/0\s+Enabled(?:(?!\n(?:GigabitEthernet|Loopback))[\s\S])*?MPLS LDP Sync \(L1/L2\):\s+\w+/Enabled
  - regex: GigabitEthernet0/0/0/1\s+Enabled(?:(?!\n(?:GigabitEthernet|Loopback))[\s\S])*?MPLS LDP Sync \(L1/L2\):\s+\w+/Enabled
  points: 5
- name: 'M8-3 XR01: waits 10 seconds after LDP is ready on a link'
  node: XR01
  command: show mpls ldp igp sync
  raw:
  - regex: 'GigabitEthernet0/0/0/0:\s*\n[^\n]*\n\s*Sync delay: 10 sec'
  - regex: 'GigabitEthernet0/0/0/1:\s*\n[^\n]*\n\s*Sync delay: 10 sec'
  points: 5
- name: 'M8-3 XR01: moves customer traffic off PRIMARY while LDP is down on it (LDP disabled on RT01 for the check)'
  node: XR01
  exec: local
  command: .venv/bin/python topologies/login_probe.py XRT-07 ssh XR01 --pre-cli 'RT01:configure terminal;;interface Ethernet0/0;;no mpls ip;;end' --settle 25 --post-cli
    'RT01:configure terminal;;interface Ethernet0/0;;mpls ip;;end' --post-settle 30 -- 'show isis database verbose XR01.00-00' 'show mpls forwarding prefix 10.255.0.12/32'
    'ping 10.20.0.1 source Loopback100 count 5'
  raw:
  - regex: '== CLI RT01: 4 lines'
  - regex: 'Metric: 16777214\s+IS-Extended RT01\.00'
  - regex: \d+\s+\d+\s+10\.255\.0\.12/32\s+Gi0/0/0/1
  - regex: Success rate is (?:100|80) percent
  points: 10
- name: 'M8-4 XR01: the session with RT01 is protected for 10 minutes at most'
  node: XR01
  command: show mpls ldp neighbor 10.255.0.11:0 detail
  raw:
  - regex: 'Session Protection:\s*\n\s*Enabled, state: Ready'
  - regex: 'Duration: 600 sec'
  points: 4
- name: 'M8-4 XR01: sends targeted hellos to RT01 only'
  node: XR01
  command: show mpls ldp discovery
  raw:
  - regex: Targeted Hellos:[\s\S]*10\.255\.0\.1 -> 10\.255\.0\.11 \(active\), xmit/recv
  - not_regex: -> 10\.255\.0\.13
  points: 4
- name: 'M8-4 XR01: keeps the session and RT01''s labels while PRIMARY is down (packets on PRIMARY discarded for the check)'
  node: XR01
  exec: local
  command: .venv/bin/python topologies/login_probe.py XRT-07 ssh XR01 --fail-link XR01:RT01 --settle 45 --post-settle 45 -- 'show mpls ldp neighbor 10.255.0.11:0
    detail' 'show mpls ldp bindings 10.255.0.12/32' 'ping 10.20.0.1 source Loopback100 count 5'
  raw:
  - regex: 'Enabled, state: Protecting'
  - regex: 10\.255\.0\.11:0\s+\d+
  - regex: Success rate is (?:100|80) percent
  points: 9
- name: 'M8-4 XR01: the session with RT01 was not re-established when PRIMARY came back'
  node: XR01
  exec: local
  command: .venv/bin/python topologies/login_probe.py XRT-07 ssh XR01 -- 'show mpls ldp neighbor 10.255.0.11:0'
  raw:
  - regex: 'State: Oper'
  - regex: 'Up time: (?:\d+d\d+h|(?:0[1-9]|[1-9]\d):\d\d:\d\d|00:(?:0[2-9]|[1-5]\d):\d\d|00:01:[3-5]\d)'
  points: 3
- name: 'M8-5 RT02: an MPLS LSP ping to XR01''s Loopback0 succeeds'
  node: RT02
  command: ping mpls ipv4 10.255.0.1/32 repeat 3
  raw:
  - regex: Success rate is 100 percent
  points: 4
- name: 'M8-5 RT02: an MPLS LSP traceroute to XR01 ends at XR01, with the label kept to the last hop'
  node: RT02
  command: traceroute mpls ipv4 10.255.0.1/32 timeout 1 ttl 4
  raw:
  - regex: L 1 10\.0\.12\.11 [^\n]*explicit-null
  - regex: '! 2 10\.0\.1\.1 '
  points: 5
- name: 'M8-5 RT01: sends XR01''s traffic with the explicit null label'
  node: RT01
  command: show mpls forwarding-table 10.255.0.1
  raw:
  - regex: explicit-n\s+10\.255\.0\.1/32
  points: 2
- name: 'M8-5 XR01: an MPLS LSP ping from XR01 to RT02''s Loopback0 succeeds'
  node: XR01
  command: ping mpls ipv4 10.255.0.12/32 repeat 3
  raw:
  - regex: Success rate is 100 percent
  points: 4
