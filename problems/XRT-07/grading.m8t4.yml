# M8-4: PRIMARY が切れても RT01 とのセッションと RT01 から受けたラベルを保つ(最長 10 分)。RT03 は targeted ハローを受けないので送らない。
# 3 つ目の確認は採点のあいだだけ CML のリンク条件で XR01-RT01 を loss 100(両端のポートは up のまま)→ 45 秒後に Protecting・
# RT01 からの束縛・お客さまの ping(RT03 経由)→ 戻して 45 秒待つ。4 つ目= 戻した後もセッションが張り直されていない(Up time ≥ 1:30)。
# 保護なし= リンクのハローが切れて 15 秒でセッションが落ち、戻った時に張り直す(Up time は 1 分足らず)。PoC §20.4-9・10。
problem: XRT-07
total_points: 100
checks:
  - name: 'M8-4 XR01: the session with RT01 is protected for 10 minutes at most'
    node: XR01
    command: 'show mpls ldp neighbor 10.255.0.11:0 detail'
    raw:
      - { regex: 'Session Protection:\s*\n\s*Enabled, state: Ready' }
      - { regex: 'Duration: 600 sec' }
    points: 20
  - name: 'M8-4 XR01: sends targeted hellos to RT01 only'
    node: XR01
    command: 'show mpls ldp discovery'
    raw:
      - { regex: 'Targeted Hellos:[\s\S]*10\.255\.0\.1 -> 10\.255\.0\.11 \(active\), xmit/recv' }
      - { not_regex: '-> 10\.255\.0\.13' }
    points: 20
  - name: 'M8-4 XR01: keeps the session and RT01''s labels while PRIMARY is down (packets on PRIMARY discarded for the check)'
    node: XR01
    exec: local
    command: >-
      .venv/bin/python topologies/login_probe.py XRT-07 ssh XR01 --fail-link XR01:RT01 --settle 45 --post-settle 45
      -- 'show mpls ldp neighbor 10.255.0.11:0 detail' 'show mpls ldp bindings 10.255.0.12/32' 'ping 10.20.0.1 source Loopback100 count 5'
    raw:
      - { regex: 'Enabled, state: Protecting' }
      - { regex: '10\.255\.0\.11:0\s+\d+' }
      - { regex: 'Success rate is (?:100|80) percent' }
    points: 45
  - name: 'M8-4 XR01: the session with RT01 was not re-established when PRIMARY came back'
    node: XR01
    exec: local
    command: >-
      .venv/bin/python topologies/login_probe.py XRT-07 ssh XR01 -- 'show mpls ldp neighbor 10.255.0.11:0'
    raw:
      - { regex: 'State: Oper' }
      - { regex: 'Up time: (?:\d+d\d+h|(?:0[1-9]|[1-9]\d):\d\d:\d\d|00:(?:0[2-9]|[1-5]\d):\d\d|00:01:[3-5]\d)' }
    points: 15
