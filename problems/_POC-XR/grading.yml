# _POC-XR: XR を既存の採点経路(SSH・exec=ios)に通せるかの確認用(BL-246 PoC)
problem: _POC-XR
total_points: 100
checks:
  - name: "XR01: OSPF 隣接 FULL (Genie iosxr)"
    node: XR01
    command: "show ospf neighbor"
    parser: "show ospf neighbor"
    genie_os: iosxr
    find: "vrfs.*.neighbors.*"
    match: { state: "FULL/  -" }
    points: 40
  - name: "XR01: OSPF 隣接 FULL (raw)"
    node: XR01
    command: "show ospf neighbor"
    raw:
      - regex: "2\\.2\\.2\\.2\\s+\\d+\\s+FULL"
    points: 30
  - name: "RT01: OSPF 隣接 FULL"
    node: RT01
    command: "show ip ospf neighbor"
    raw:
      - regex: "1\\.1\\.1\\.1\\s+\\d+\\s+FULL"
    points: 30
