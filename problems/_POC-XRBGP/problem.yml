# BL-257 PoC: M6 追補「BGP の運用機能」(SPCOR 2.4.g 追加パス・2.4.h PIC・1.5.b TTL セキュリティと認証・1.5.c プレフィックスの抑制)。
# 記録= problems/_drafts/XR-TRACK.design.md §32。手順= poc/xr/bgpops_poc.sh
# 盤面(AS 65000= IS-IS CORE レベル 2+LDP・P1 は BGP なし・RR1 は道の外の専用 RR):
#   CE1(65001)─ PE1(XRd) ─┐                 ┌─ PE2(XRd)─ X1 ─┐
#                          ├── P1(XRd) ──────┤      (65100)    ├─ T(宛先 203.0.113.1・IP SLA の responder)
#   CE4(65004)─ PE4(XRv) ─┘     │           └─ PE3(XRd)─ X2 ─┘   X1 ─ X2 も直結(iBGP・OSPF)
#                              RR1(XRd)
# - PE2 は X1 からの経路に local-preference 200 → PE3 の最良は PE2 経由の iBGP になり、PE3 は自分の eBGP の経路(X2)を広告しない
#   (best-external なし)→ RR1 も PE1 も道を 1 本しか知らない。ここから best-external・追加パス・PIC(予備の経路の install)を足していく。
# - 入口の PE を XRd(PE1)と XRv9000(PE4)の 2 台にして、PIC の切り替えのデータプレーンを両方で測る(sla_loss.py で CE→T の片道の欠け)。
