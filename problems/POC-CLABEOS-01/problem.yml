# containerlab だけで回す Arista cEOS × FRRouting の PoC・雛形(BL-274 ②)。出題用ではない。
# 2026-11-14 cEOS 4.37.0F で E2E 済み(CLAB-SOLO.design.md §7.5)。cEOS の取り込み= clab_ops.py import-ceos。
# ★admin でログインすると特権レベル 1(`>`)。採点は enable する(grade.yml)・解く時も `enable` から。
# EOS1 は containerlab が作る既定の設定(admin/admin・管理 IF)で白紙起動し、受験者が設定する。FRR1 は据え付け。
id: POC-CLABEOS-01
title: "[PoC] containerlab 単独 Arista cEOS × FRR OSPF"
exam: POC
topics: [eos, arista, frr, ospf, containerlab, multivendor]
difficulty: 1
platform: clab
target_nodes: [EOS1]
points: 100
access: ssh

clab_nodes:
  EOS1: 172.20.20.21
  FRR1: 172.20.20.22
clab_topology: clab/ccnp-clabeos.clab.yml

# === トポロジ =============================================
#   EOS1(白紙・受験者が設定) Ethernet1 ── eth1 FRR1(据え付け)
#    Loopback0 192.168.0.4/32      10.0.14.0/30      lo 192.168.0.3/32
#                              OSPF area 0
