# 起動後に上から順に 1 コミットずつ入れる(前任者の作業の履歴)。p2p ごとに l2vpn から書く(最上位に戻る仕組み= xr_bringup の push)。
# M11-2: お客さま B の拠点 1⇔2 の E-Line 2 本(LDP の疑似回線・相手 RT02 は据付)。300= rewrite の付け忘れ(AC の MTU が 1504 になる)/
#        CHG-1402= お客さまの要望でポート(Gi0/0/0/3)をジャンボ(mtu 9014)に= 310 の AC の MTU が 9000・300 は 9004(相手 RT02 は 1500)。
#        ジャンボを外しても 300 は 1504 のまま= 原因が 2 つ重なる(実測 §24.8。サブインタフェースの mtu は親を超えられず効かない)。
# M11-4: お客さま B の拠点 1⇔3 の E-Line 2 本(EVPN-VPWS)の XR01 側(こちらは正しい)。XR03 側の誤りは XR03.commits.yml。
- label: CHG-1401
  comment: CUST-B E-Line site 1 - site 2 (VLAN 300 and 310)
  lines: |
    interface GigabitEthernet0/0/0/3.300 l2transport
     description CUST-B E-Line 300 to site 2
     encapsulation dot1q 300
    interface GigabitEthernet0/0/0/3.310 l2transport
     description CUST-B E-Line 310 to site 2
     encapsulation dot1q 310
     rewrite ingress tag pop 1 symmetric
    l2vpn
     xconnect group CUST-B
      p2p B-300
       interface GigabitEthernet0/0/0/3.300
       neighbor ipv4 10.255.0.12 pw-id 300
    l2vpn
     xconnect group CUST-B
      p2p B-310
       interface GigabitEthernet0/0/0/3.310
       neighbor ipv4 10.255.0.12 pw-id 310
- label: CHG-1402
  comment: CUST-B jumbo frames on the site 1 port (customer request)
  lines: |
    interface GigabitEthernet0/0/0/3
     mtu 9014
- label: CHG-1411
  comment: CUST-B E-Line site 1 - site 3 (EVPN-VPWS, EVI 410 and 420)
  lines: |
    interface GigabitEthernet0/0/0/3.410 l2transport
     description CUST-B E-Line 410 to site 3
     encapsulation dot1q 410
     rewrite ingress tag pop 1 symmetric
    interface GigabitEthernet0/0/0/3.420 l2transport
     description CUST-B E-Line 420 to site 3
     encapsulation dot1q 420
     rewrite ingress tag pop 1 symmetric
    l2vpn
     xconnect group CUST-B
      p2p B-410
       interface GigabitEthernet0/0/0/3.410
       neighbor evpn evi 410 target 3 source 1
    l2vpn
     xconnect group CUST-B
      p2p B-420
       interface GigabitEthernet0/0/0/3.420
       neighbor evpn evi 420 target 3 source 1
