# XRT-11: XR トラック M11 L2VPN とキャリア イーサネット(SPCOR 4.2・4.1.a)。BL-246。設計= problems/_drafts/XR-TRACK.design.md §24(PoC= _POC-XRL2VPN)。
# 学習目的のラボ(パック・ノルマの対象外)。初期状態= XRT-10(M10-1〜5)を解き終えた状態(SR のコア・XR01 に LDP なし・L3VPN・SR ポリシー・PCE)に、
# PE をもう 1 台(XR03= XRv9000・RT01 の先・IS-IS と SR は据付)と、お客さま B の拠点 3(CEB3)を足したもの。
#   XR01(PE) Gi0/0/0/2 CEA1・Gi0/0/0/3 CEB1(どちらも L3VPN の上に L2 のサブインタフェースを足す)  XR03(PE) Gi0/0/0/1 CEB3
#   RT02(PE・IOL・据付)= お客さま A/B の E-Line の相手(サブインタフェースの xconnect)  XR02(XRd)= VPNv4 の RR・PCE。M11-3 で l2vpn evpn の RR にもする
# 仕込み= XR01.commits.yml(M11-2: お客さま B の E-Line 2 本= rewrite の付け忘れ・ジャンボの MTU/M11-4 の XR01 側)・XR03.commits.yml(M11-4: target の取り違え・rewrite の付け忘れ)。
# ★XR は VPWS だけ(XRv9000 はブリッジ ドメイン不可= §24.3-1)。EVPN-VPWS は XR 同士だけ(XR⇔IOS XE はデータが通らない= §24.3-4)。XRv9000 は同時 2 台が上限。
