# 自動生成 (gen_redist_arena.py) GEN-RDFIELD-29213 ring=inject_ospf method=filter
# 初期: 192.168.31.0/24 が RT06 → RT05 → RT07 → RT06 で定常ループ。是正後: RT06 が iBGP を採用し全到達。
problem: GEN-RDFIELD-29213
total_points: 100
defaults:
  genie_os: iosxe
model:
  loopbacks:
    RT04: 192.168.31.1
    RT06: 36.36.36.36
    RT05: 92.92.92.92
    RT07: 50.50.50.50
    RT02: 58.58.58.58
    RT01: 86.86.86.86
    RT03: 22.22.22.22
  links:
  - a: RT04
    a_ip: 10.151.153.1
    b: RT06
    b_ip: 10.151.153.2
  - a: RT06
    a_ip: 10.53.23.1
    b: RT05
    b_ip: 10.53.23.2
  - a: RT06
    a_ip: 10.158.8.1
    b: RT07
    b_ip: 10.158.8.2
  - a: RT05
    a_ip: 10.230.87.1
    b: RT07
    b_ip: 10.230.87.2
  - a: RT07
    a_ip: 10.156.8.1
    b: RT02
    b_ip: 10.156.8.2
  - a: RT02
    a_ip: 10.132.35.1
    b: RT01
    b_ip: 10.132.35.2
  - a: RT05
    a_ip: 10.223.209.1
    b: RT03
    b_ip: 10.223.209.2
invariants:
  - { type: reachability_all, name: "全ルータ間 Loopback 到達性(被害プレフィクスを含む)", points: 30 }
  - { type: loop_free, name: "転送ループ無し(RT06 → RT05 → RT07 → RT06 の再配送リングループ解消)", points: 25 }
  - type: optimal
    name: "被害プレフィクスへの最短転送(震源でループ・遠回りが無い)"
    points: 15
    pairs: [["RT06", "RT04"], ["RT07", "RT06"], ["RT06", "RT07"]]
checks:
  - name: "RT06: 192.168.31.0/24 を BGP(iBGP)で学習(戻り経路でなく起点方向を選択＝ループ解消の核心)"
    node: RT06
    command: "show ip route 192.168.31.0"
    raw:
      - { regex: 'Known via "bgp 65483"' }
    points: 5
  - name: "RT04: IGP側 Loopback(50.50.50.50) を BGP(B)で学習(戻り再配送 IGP→BGP が機能)"
    node: RT04
    command: "show ip route bgp"
    raw:
      - { regex: "B\\s+50.50.50.50" }
    points: 10
  - name: "RT07: 192.168.31.0/24 を OSPF 外部(extern 2)で学習(再配送リングの OSPF 部が機能)"
    node: RT07
    command: "show ip route 192.168.31.0"
    raw:
      - { regex: 'Known via "ospf' }
      - { regex: "extern 2" }
    points: 5
  - name: "RT06: 静的経路なし(暫定対処の残置禁止)"
    node: RT06
    command: "show ip route static"
    raw:
      - { not_regex: "(?m)^S" }
    points: 5
  - name: "RT06: 管理距離(distance)を変更していない(監査ポリシー遵守＝フィルタで解くこと)"
    node: RT06
    command: "show running-config | include distance"
    raw:
      - { not_regex: "distance" }
    points: 5
