# 既定値。ネットワーク/タグ/シードメトリックは要件仕様の一部なので固定
# （ランダム化するのは Loopback0 と /30 セグメントのみ = _gen.yml）。
rt01_lo: 1.1.1.1
rt02_lo: 2.2.2.2
rt03_lo: 3.3.3.3
rt04_lo: 4.4.4.4
seg12: 10.0.12
seg13: 10.0.13
seg23: 10.0.23
seg24: 10.0.24
seg34: 10.0.34
# 本社(OSPF)側セグメント: <net>.1/24 の Loopback で模擬（RT01 収容・変更不可）
hq_srv: 172.16.10    # 本社基幹サーバ（EIGRP 側へ優遇シードメトリックで広告）
hq_cli: 172.16.20    # 本社クライアント
hq_lab: 172.16.99    # 本社検証セグメント（ドメイン間接続禁止）
# 拠点(EIGRP)側セグメント: <net>.1/24 の Loopback で模擬（RT04 収容・変更不可）
br_srv: 10.20.10     # 拠点サーバ（OSPF 側へ Type-1 外部で広告）
br_cli: 10.20.20     # 拠点クライアント
br_lab: 10.20.99     # 拠点検証セグメント（ドメイン間接続禁止）
# 出自タグ（監査要件）
tag_eigrp: 90        # EIGRP 由来経路に付ける印
tag_ospf: 110        # OSPF 由来経路に付ける印
# OSPF→EIGRP シードメトリック（bw[kbps] delay[10us] rel load mtu）
seed_srv: "10000 100 255 1 1500"   # 本社基幹サーバ網（優遇）
seed_def: "1000 100 255 1 1500"    # その他
