# XRT-14: XR トラック M12 データプレーンの保護と QoS(SPCOR 1.7・4.5・1.4)。BL-246。設計= problems/_drafts/XR-TRACK.design.md §27(PoC= _POC-XRQOS と同じ盤面)。
# 学習目的のラボ(パック・ノルマの対象外)。盤面= P1(IOL・P だけ)を挟んで XR01(XRv9000・PE 兼インターネットの出入り口)と PE2(IOL の PE)。
#   RR1(XRd)は P1 の脇の行き止まり= RR(ipv4 unicast・vpnv4)兼 RTBH の起点。サービスの土台(IS-IS・LDP・iBGP・VRF A・PE-CE・インターネット)は据付。
#   XR01 Gi0/0/0/0 P1・Gi0/0/0/1 CE1(VRF A)・Gi0/0/0/2 CUST1(グローバルのお客さま・静的)・Gi0/0/0/3 INET(AS 64500)
#   PE2  Et0/0 P1・Et0/1 CE2(VRF A)・Et0/2 CUST2(グローバルのお客さま・攻撃される側)
# 学ぶ側が設定するのは XR01(M12-1〜5)と RR1(M12-5)。採点の数え役= CE1・CE2 の入力(DSCP ごと)・P1 の Et0/0 の入力(EXP ごと)・CUST2 が受けた echo の数(topologies/qos_probe.py)。
# 仕込み= P1 の Et0/1 の入力で EXP 3 → 1 の格下げ(M12-3)・RR1 の初期設定に前任者の RTBH の起点(M12-5= no-export なし・次ホップ 192.0.2.1 の再帰)。
# ★XR01 は XRv9000 26.1.1(方策のカウンタは 10〜30 秒遅れる・1 class の印は 2 種類まで・送信元の RTBH は set next-hop discard でだけ効く= §27.3)。
