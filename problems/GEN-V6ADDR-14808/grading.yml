# 自動生成 (gen_v6addr_ts.py) seed=14808 faults=a_not_suppressed
# 挙動ベース(世界ごと)。SLAAC=EUI-64 有無 / stateful=Address State OPEN+binding
# / DNS=show ipv6 dhcp interface / 実疎通=ping Lo0。
problem: GEN-V6ADDR-14808
total_points: 100
defaults:
  genie_os: iosxe
checks:
- name: 'LAN-A: 端末が SLAAC でグローバルアドレスを自動生成 (EUI-64)'
  node: CLA
  command: show ipv6 interface brief Ethernet0/0
  raw:
  - regex: (?i)2001\:DB8\:4e\:A:[0-9A-Fa-f:]*[Aa]8[Bb][Bb]:CCFF:FE
  points: 18
- name: 'LAN-A: DNS サーバが RA(DNS オプション)で配布されている'
  node: CLA
  command: show ipv6 routers
  raw:
  - regex: (?i)DNS server\s+2001\:DB8\:4e\:1\:\:53
  points: 12
- name: 'LAN-A: 端末が既定経路を持ちサーバ Lo0 へ実疎通'
  node: CLA
  command: ping 2001:DB8:4e:1::1 source Ethernet0/0 repeat 6
  raw:
  - regex: (?i)Success rate is (100|8[3-9]|9[0-9]) percent
  points: 12
- name: 'LAN-B: 端末がサーバ管理アドレスを取得し OPEN'
  node: CLB
  command: show ipv6 dhcp interface Ethernet0/0
  raw:
  - regex: (?i)Address State is OPEN
  - regex: '(?i)Address\s*:\s*2001\:DB8\:4e\:B:'
  points: 18
- name: 'LAN-B: サーバの binding に IA_NA 割当が存在'
  node: RT01
  command: show ipv6 dhcp binding
  raw:
  - regex: '(?i)Address\s*:\s*2001\:DB8\:4e\:B:'
  points: 9
- name: 'LAN-B: GW が自動生成を抑止 (RA prefix no-autoconfig)'
  node: RT02
  command: show running-config interface Ethernet0/2
  raw:
  - regex: (?i)ipv6 nd prefix \S+ .*no-autoconfig
  points: 9
- name: 'LAN-B: DNS/ドメインがサーバから配布されている'
  node: CLB
  command: show ipv6 dhcp interface Ethernet0/0
  raw:
  - regex: (?i)DNS server\s*:\s*2001\:DB8\:4e\:1\:\:53
  - regex: (?i)Domain name\s*:\s*ccnp\.local
  points: 12
- name: 'LAN-B: 端末が既定経路を持ちサーバ Lo0 へ実疎通'
  node: CLB
  command: ping 2001:DB8:4e:1::1 source Ethernet0/0 repeat 6
  raw:
  - regex: (?i)Success rate is (100|8[3-9]|9[0-9]) percent
  points: 10
