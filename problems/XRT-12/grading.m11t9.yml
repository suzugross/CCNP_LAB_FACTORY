# M11-9: 据付の E-Line 130 を CFM で監視(MD PROV レベル 4・MA E130・EVC E130・MEP ID= 拠点の番号 1/3)+Y.1731(IP SLA 130)。
# ★`ethernet cfm global` が無いと MEP の CC が I(無効)のまま相手を覚えない(実測)。
# 「黙った故障を 5 秒以内に」= 採点中だけ XE3⇔P1 のリンクに CML のリンク条件 loss 100 を入れ、1.4 秒ごとに相手の MEP の表を取る
# (watch の 4 回目= 約 +4.6 秒)。CC 1 秒なら寿命 3.5 秒で +3.2 秒には消える・既定の 10 秒なら +10 秒でも残る(実測)。
# IS-IS(保持 30 秒)と LDP はこの間に切れない。白紙= MEP なし= 0 点。
# ★相手の MEP が消えると XE1 の Y.1731(DMM)は Internal error で止まったまま戻らない(17.15.1a 実測・MEP が戻っても再開しない)
#   `ip sla restart 130` で再開する(予定の無い操作は Inactive のまま= 予定の書き忘れは隠さない・実測)。
#   → IP SLA の確認は先頭に置き、確認の前に restart して 15 秒待つ(再試行や最終確認の前に採点が起こした故障の跡を消す)。
problem: XRT-12
total_points: 100
checks:
  - name: 'M11-9 XE1: IP SLA operation 130 measures the two-way delay to MEP 3 with Y.1731, without stopping'
    node: XE1
    exec: local
    command: >-
      .venv/bin/python topologies/login_probe.py XRT-12 ssh XE1 --pre-cli 'XE1:configure terminal;;ip sla restart 130;;end' --settle 15
      -- 'show ip sla configuration 130' 'show ip sla statistics 130 details'
    raw:
      - { regex: 'Ethernet Y1731 Delay Operation\s*\nFrame Type: DMM\s*\nDomain: PROV\s*\nEvc: E130\s*\nTarget Mpid: 3\s*\nSource Mpid: 1' }
      - { regex: 'Latest operation return code: OK' }
      - { regex: 'Number of TwoWay observations: [1-9]' }
      - { regex: 'Operation time to live: Forever' }
      - { regex: 'Operational state of entry: Active' }
    points: 25
  - name: 'M11-9 XE1, XE3: each end''s MEP (domain PROV, level 4, service E130) knows the other end''s MEP (MEP IDs 1 and 3)'
    node: XE1
    exec: local
    command: >-
      echo '## XE1'; .venv/bin/python topologies/login_probe.py XRT-12 ssh XE1 -- 'show ethernet cfm maintenance-points remote';
      echo '## XE3'; .venv/bin/python topologies/login_probe.py XRT-12 ssh XE3 -- 'show ethernet cfm maintenance-points remote'; echo '## END'
    raw:
      - { regex: '## XE1[\s\S]*?\n3\s+PROV\s+[0-9a-f.]{14}\s+Up\s+Up\s*\n\s*4\s+PROV[\s\S]*?E130\s+XCON[\s\S]*?MPID: 1 Domain: PROV MA: E130[\s\S]*?## XE3' }
      - { regex: '## XE3[\s\S]*?\n1\s+PROV\s+[0-9a-f.]{14}\s+Up\s+Up\s*\n\s*4\s+PROV[\s\S]*?E130\s+XCON[\s\S]*?MPID: 3 Domain: PROV MA: E130[\s\S]*?## END' }
    points: 20
  - name: 'M11-9 XE1, XE3: a CFM loopback reaches the other end''s MEP'
    node: XE1
    exec: local
    command: >-
      echo '## XE1'; .venv/bin/python topologies/login_probe.py XRT-12 ssh XE1 -- 'ping ethernet mpid 3 domain PROV service E130';
      echo '## XE3'; .venv/bin/python topologies/login_probe.py XRT-12 ssh XE3 -- 'ping ethernet mpid 1 domain PROV service E130'; echo '## END'
    raw:
      - { regex: '## XE1[\s\S]*?Success rate is (?:100|80) percent[\s\S]*?## XE3[\s\S]*?Success rate is (?:100|80) percent[\s\S]*?## END' }
    points: 15
  - name: 'M11-9 XE1: notices a silent break of the E-Line within 5 seconds (the far MEP is gone at +4.6 s)'
    node: XE1
    exec: local
    command: >-
      .venv/bin/python topologies/login_probe.py XRT-12 watch XE1 'show ethernet cfm maintenance-points remote'
      --samples 4 --interval 1 --fail-link XE3:P1 --post-settle 15
    raw:
      - { regex: '== SAMPLE 1 at[^\n]*\n[\s\S]*?\n3\s+PROV\s[\s\S]*?== SAMPLE 2' }
      - { regex: '== SAMPLE 4 at' }
      - { not_regex: '== SAMPLE 4 at[^\n]*\n[\s\S]*Total Remote MEPs: [1-9]' }
    points: 20
  - name: 'M11-9 XE3: notices the same silent break within 5 seconds (the far MEP is gone at +4.6 s)'
    node: XE1
    exec: local
    command: >-
      .venv/bin/python topologies/login_probe.py XRT-12 watch XE3 'show ethernet cfm maintenance-points remote'
      --samples 4 --interval 1 --fail-link XE3:P1 --post-settle 15
    raw:
      - { regex: '== SAMPLE 1 at[^\n]*\n[\s\S]*?\n1\s+PROV\s[\s\S]*?== SAMPLE 2' }
      - { regex: '== SAMPLE 4 at' }
      - { not_regex: '== SAMPLE 4 at[^\n]*\n[\s\S]*Total Remote MEPs: [1-9]' }
    points: 20
