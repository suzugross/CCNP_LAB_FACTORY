# XRT-12: XR トラック M11 追補= Catalyst 8000V で E-LAN・EVPN のマルチホーム・イーサネット OAM(SPCOR 4.2.a・4.2.c・4.1.a)。BL-246。
# 設計= problems/_drafts/XR-TRACK.design.md §25(PoC= §24.5b の _POC-XRL2XE)。学習目的のラボ(パック・ノルマの対象外)。
# ★IOS XR は入らない(XRv9000 はブリッジ ドメイン不可・CFM なし/XR⇔XE の EVPN-VPWS は不通= §24.3・§24.5b)。
# 盤面= P1(IOL・P ルータ・l2vpn evpn の RR・据付)を中心にした星形。PE= XE1/XE2/XE3(Cat8000v)。
#   XE1 Gi2 CE1(拠点 1)・Gi3 SW1 / XE2 Gi2 CE2(拠点 2)・Gi3 SW1 / XE3 Gi2 CE3(拠点 3)。SW1(IOL-L2)= 拠点 4・XE1 と XE2 に束で二重に収容。
# 前任者の作り= VPLS 210(M11-6 の故障)。据付= E-Line 130(XE1⇔XE3・M11-9 で CFM を足す)。
id: XRT-12
title: "XR Track 12 — E-LAN, Multihoming and Ethernet OAM (IOS XE)"
exam: SP
topics: [iosxe, mpls, l2vpn, evpn, vpls, multihoming, cfm, carrier-ethernet, tutorial]
difficulty: 3
topology: generated
access: ssh
target_nodes: [XE1, XE2, XE3, P1, CE1, CE2, CE3, SW1]
points: 100
image_family: iol
node_image_families: { XE1: cat8000v, XE2: cat8000v, XE3: cat8000v }
grade_attempts: 2
# 8000V のライセンスの段階(既定は空欄= MPLS が無い)。構築の最後に xe_license.py が保存+再起動する
xe_license_boot:
  level: network-advantage addon dna-advantage
  nodes: [XE1, XE2, XE3]
# lab.sh reset で構築直後へ戻す IOS XE の機器(configure replace。xr_reset.py)
xe_reset_nodes: [XE1, XE2, XE3]
# EEM の無い IOL-L2 は SSH の鍵が作られない → 構築の最後に telnet で作る(telnet_keygen.py。採点の login_probe は SSH)
ssh_keygen_telnet: [SW1]
lab:
  # 中央= P1、左= 拠点 1・4・2(XE1・XE2)、右= 拠点 3(XE3)
  positions: { P1: [400, 240], XE1: [0, 0], XE2: [0, 480], XE3: [800, 240],
               CE1: [-400, -80], SW1: [-400, 240], CE2: [-400, 560], CE3: [1200, 240] }
  links:
    - { a: P1, a_if: 0, b: XE1, b_if: 0 }
    - { a: P1, a_if: 1, b: XE2, b_if: 0 }
    - { a: P1, a_if: 2, b: XE3, b_if: 0 }
    - { a: XE1, a_if: 1, b: CE1, b_if: 0 }
    - { a: XE1, a_if: 2, b: SW1, b_if: 0 }
    - { a: XE2, a_if: 1, b: CE2, b_if: 0 }
    - { a: XE2, a_if: 2, b: SW1, b_if: 1 }
    - { a: XE3, a_if: 1, b: CE3, b_if: 0 }
