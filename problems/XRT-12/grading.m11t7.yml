# M11-7: EVPN の E-LAN(EVI 200・vlan-based)を拠点 1〜3 で。BGP は RR(P1)経由だけ・ルータ ID= Lo0。
# 拠点 3 はタグなし(encapsulation untagged)。replication-type ingress が無いと EVI が Incomplete で何も通らない(実測)。白紙= PE に BGP なし= 0 点。
# ★MAC は CE のフレームからしか覚えない(CE2 のサブインタフェースは何も送らない)→ MAC の確認は ping の後に置き、確認の前にも CE から ping して 10 秒待つ(実測)。
problem: XRT-12
total_points: 100
checks:
  - name: 'M11-7 P1: reflects EVPN routes for XE1, XE2 and XE3'
    node: P1
    command: show bgp l2vpn evpn summary
    raw:
      - { regex: '\n10\.255\.0\.41\s+4\s+65000(?:\s+\d+){5}\s+\S+\s+[1-9]\d*' }
      - { regex: '\n10\.255\.0\.42\s+4\s+65000(?:\s+\d+){5}\s+\S+\s+[1-9]\d*' }
      - { regex: '\n10\.255\.0\.43\s+4\s+65000(?:\s+\d+){5}\s+\S+\s+[1-9]\d*' }
    points: 15
  - name: 'M11-7 XE1, XE2, XE3: one BGP session each, to P1 only, with Loopback0 as the router ID'
    node: XE1
    exec: local
    command: >-
      for n in 1 2 3; do echo "## XE$n"; .venv/bin/python topologies/login_probe.py XRT-12 ssh XE$n -- 'show bgp l2vpn evpn summary'; done; echo '## END'
    raw:
      - { regex: '## XE1[\s\S]*?BGP router identifier 10\.255\.0\.41,[\s\S]*?\n10\.255\.0\.51\s+4\s+65000(?:\s+\d+){5}\s+\S+\s+[1-9]\d*[\s\S]*?## XE2' }
      - { regex: '## XE2[\s\S]*?BGP router identifier 10\.255\.0\.42,[\s\S]*?\n10\.255\.0\.51\s+4\s+65000(?:\s+\d+){5}\s+\S+\s+[1-9]\d*[\s\S]*?## XE3' }
      - { regex: '## XE3[\s\S]*?BGP router identifier 10\.255\.0\.43,[\s\S]*?\n10\.255\.0\.51\s+4\s+65000(?:\s+\d+){5}\s+\S+\s+[1-9]\d*[\s\S]*?## END' }
      - { not_regex: '\n10\.255\.0\.4[123]\s+4\s+65000' }
    points: 15
  - name: 'M11-7 CE1, CE2: the three sites reach each other over the EVPN E-LAN (172.31.200.0/24; site 3 untagged)'
    node: XE1
    exec: local
    command: >-
      echo '## 1-2'; .venv/bin/python topologies/login_probe.py XRT-12 ssh CE1 -- 'ping 172.31.200.2 repeat 5';
      echo '## 1-3'; .venv/bin/python topologies/login_probe.py XRT-12 ssh CE1 -- 'ping 172.31.200.3 repeat 5';
      echo '## 2-3'; .venv/bin/python topologies/login_probe.py XRT-12 ssh CE2 -- 'ping 172.31.200.3 repeat 5'
    raw:
      - { regex: '## 1-2[\s\S]*?Success rate is (?:100|80) percent[\s\S]*?## 1-3[\s\S]*?Success rate is (?:100|80) percent[\s\S]*?## 2-3[\s\S]*?Success rate is (?:100|80) percent' }
    points: 45
  - name: 'M11-7 XE1: learns the MACs of sites 2 and 3 through BGP, and replicates broadcasts by ingress replication'
    node: XE1
    exec: local
    command: >-
      .venv/bin/python topologies/login_probe.py XRT-12 ssh XE1 --pre-cli 'CE2:ping 172.31.200.1 repeat 3' --pre-cli 'CE3:ping 172.31.200.1 repeat 3'
      --settle 10 -- 'show l2vpn evpn mac' 'show l2vpn evpn evi 200 detail'
    raw:
      - { regex: '\n[0-9a-f.]{14}\s+200\s+\d+\s+0000\.0000\.0000\.0000\.0000\s+0\s+10\.255\.0\.42\s' }
      - { regex: '\n[0-9a-f.]{14}\s+200\s+\d+\s+0000\.0000\.0000\.0000\.0000\s+0\s+10\.255\.0\.43\s' }
      - { regex: 'Replication Type:\s+Ingress' }
    points: 25
