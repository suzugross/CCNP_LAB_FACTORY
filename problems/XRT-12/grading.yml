# XRT-12 最終確認(M11-6〜9 の 4 課題を終えた状態。配点= 各課題 25)。
# 学習目的のラボ= パック・ノルマの対象外。中身は課題ごとの確認(grading.<課題>.yml)を寄せ集めて配点を付け直したもの
# (手で保守する= 課題ごとの確認を直したらここも直す)。白紙で通る項目は無い(どの確認も CE の到達・PE の新しい状態を含む)。
# ★MAC を読む確認は ping の後(M11-7・8)。M11-9 の黙った故障の確認(XE3⇔P1 のリンク条件)は最後に置く。IP SLA の確認はその前で、先に restart する(grading.m11t9.yml の注記)。
problem: XRT-12
total_points: 100
checks:
- name: 'M11-6 CE2: reaches site 3 over the VPLS E-LAN (172.31.210.3)'
  node: XE1
  exec: local
  command: .venv/bin/python topologies/login_probe.py XRT-12 ssh CE2 -- 'ping 172.31.210.3 repeat 5'
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 9
- name: 'M11-6 CE1: reaches site 3 over the VPLS E-LAN (172.31.210.3), and site 2 still (172.31.210.2)'
  node: XE1
  exec: local
  command: echo '## 3'; .venv/bin/python topologies/login_probe.py XRT-12 ssh CE1 -- 'ping 172.31.210.3 repeat 5'; echo '## 2'; .venv/bin/python topologies/login_probe.py XRT-12 ssh CE1 -- 'ping 172.31.210.2
    repeat 5'
  raw:
  - regex: '## 3[\s\S]*?Success rate is (?:100|80) percent[\s\S]*?## 2[\s\S]*?Success rate is (?:100|80) percent'
  points: 9
- name: 'M11-6 XE1, XE2, XE3: a full mesh of pseudowires in VFI VPLS210, with split horizon still on at XE2'
  node: XE1
  exec: local
  command: echo '## XE1'; .venv/bin/python topologies/login_probe.py XRT-12 ssh XE1 -- 'show l2vpn vfi name VPLS210' 'show l2vpn atom vc'; echo '## XE2'; .venv/bin/python topologies/login_probe.py XRT-12
    ssh XE2 -- 'show l2vpn vfi name VPLS210'; echo '## XE3'; .venv/bin/python topologies/login_probe.py XRT-12 ssh XE3 -- 'show l2vpn vfi name VPLS210' 'show l2vpn atom vc'
  raw:
  - regex: '## XE1[\s\S]*?pw\d+\s+10\.255\.0\.42\s+210\s+vfi\s+VPLS210\s+UP[\s\S]*?## XE2'
  - regex: '## XE1[\s\S]*?pw\d+\s+10\.255\.0\.43\s+210\s+vfi\s+VPLS210\s+UP[\s\S]*?## XE2'
  - regex: '## XE2[\s\S]*?pseudowire\d+\s+10\.255\.0\.41\s+210\s+Y[\s\S]*?## XE3'
  - regex: '## XE2[\s\S]*?pseudowire\d+\s+10\.255\.0\.43\s+210\s+Y[\s\S]*?## XE3'
  - regex: '## XE3[\s\S]*?pw\d+\s+10\.255\.0\.41\s+210\s+vfi\s+VPLS210\s+UP'
  - regex: '## XE3[\s\S]*?pw\d+\s+10\.255\.0\.42\s+210\s+vfi\s+VPLS210\s+UP'
  points: 7
- name: 'M11-7 P1: reflects EVPN routes for XE1, XE2 and XE3'
  node: P1
  command: show bgp l2vpn evpn summary
  raw:
  - regex: \n10\.255\.0\.41\s+4\s+65000(?:\s+\d+){5}\s+\S+\s+[1-9]\d*
  - regex: \n10\.255\.0\.42\s+4\s+65000(?:\s+\d+){5}\s+\S+\s+[1-9]\d*
  - regex: \n10\.255\.0\.43\s+4\s+65000(?:\s+\d+){5}\s+\S+\s+[1-9]\d*
  points: 4
- name: 'M11-7 XE1, XE2, XE3: one BGP session each, to P1 only, with Loopback0 as the router ID'
  node: XE1
  exec: local
  command: for n in 1 2 3; do echo "## XE$n"; .venv/bin/python topologies/login_probe.py XRT-12 ssh XE$n -- 'show bgp l2vpn evpn summary'; done; echo '## END'
  raw:
  - regex: '## XE1[\s\S]*?BGP router identifier 10\.255\.0\.41,[\s\S]*?\n10\.255\.0\.51\s+4\s+65000(?:\s+\d+){5}\s+\S+\s+[1-9]\d*[\s\S]*?## XE2'
  - regex: '## XE2[\s\S]*?BGP router identifier 10\.255\.0\.42,[\s\S]*?\n10\.255\.0\.51\s+4\s+65000(?:\s+\d+){5}\s+\S+\s+[1-9]\d*[\s\S]*?## XE3'
  - regex: '## XE3[\s\S]*?BGP router identifier 10\.255\.0\.43,[\s\S]*?\n10\.255\.0\.51\s+4\s+65000(?:\s+\d+){5}\s+\S+\s+[1-9]\d*[\s\S]*?## END'
  - not_regex: \n10\.255\.0\.4[123]\s+4\s+65000
  points: 4
- name: 'M11-7 CE1, CE2: the three sites reach each other over the EVPN E-LAN (172.31.200.0/24; site 3 untagged)'
  node: XE1
  exec: local
  command: echo '## 1-2'; .venv/bin/python topologies/login_probe.py XRT-12 ssh CE1 -- 'ping 172.31.200.2 repeat 5'; echo '## 1-3'; .venv/bin/python topologies/login_probe.py XRT-12 ssh CE1 -- 'ping 172.31.200.3
    repeat 5'; echo '## 2-3'; .venv/bin/python topologies/login_probe.py XRT-12 ssh CE2 -- 'ping 172.31.200.3 repeat 5'
  raw:
  - regex: '## 1-2[\s\S]*?Success rate is (?:100|80) percent[\s\S]*?## 1-3[\s\S]*?Success rate is (?:100|80) percent[\s\S]*?## 2-3[\s\S]*?Success rate is (?:100|80) percent'
  points: 11
- name: 'M11-7 XE1: learns the MACs of sites 2 and 3 through BGP, and replicates broadcasts by ingress replication'
  node: XE1
  exec: local
  command: .venv/bin/python topologies/login_probe.py XRT-12 ssh XE1 --pre-cli 'CE2:ping 172.31.200.1 repeat 3' --pre-cli 'CE3:ping 172.31.200.1 repeat 3' --settle 10 -- 'show l2vpn evpn mac' 'show l2vpn
    evpn evi 200 detail'
  raw:
  - regex: \n[0-9a-f.]{14}\s+200\s+\d+\s+0000\.0000\.0000\.0000\.0000\s+0\s+10\.255\.0\.42\s
  - regex: \n[0-9a-f.]{14}\s+200\s+\d+\s+0000\.0000\.0000\.0000\.0000\s+0\s+10\.255\.0\.43\s
  - regex: Replication Type:\s+Ingress
  points: 6
- name: 'M11-8 SW1: bundles both links to XE1 and XE2 into one LACP bundle'
  node: XE1
  exec: local
  command: .venv/bin/python topologies/login_probe.py XRT-12 ssh SW1 -- 'show etherchannel summary' 'show lacp neighbor'
  raw:
  - regex: Po1\(SU\)\s+LACP\s+Et0/0\(P\)\s+Et0/1\(P\)
  points: 6
- name: 'M11-8 XE1, XE2: share the all-active Ethernet segment 0000.0000.0000.0000.0401'
  node: XE1
  exec: local
  command: echo '## XE1'; .venv/bin/python topologies/login_probe.py XRT-12 ssh XE1 -- 'show l2vpn evpn ethernet-segment detail'; echo '## XE2'; .venv/bin/python topologies/login_probe.py XRT-12 ssh XE2
    -- 'show l2vpn evpn ethernet-segment detail'; echo '## END'
  raw:
  - regex: '## XE1[\s\S]*?Ethernet Segment ID: 0000\.0000\.0000\.0000\.0401\s+[\s\S]*?Redundancy mode:\s+all-active[\s\S]*?Forwarder List:\s+10\.255\.0\.41 10\.255\.0\.42[\s\S]*?## XE2'
  - regex: '## XE2[\s\S]*?Ethernet Segment ID: 0000\.0000\.0000\.0000\.0401\s+[\s\S]*?Redundancy mode:\s+all-active[\s\S]*?Forwarder List:\s+10\.255\.0\.41 10\.255\.0\.42[\s\S]*?## END'
  points: 5
- name: 'M11-8 SW1: reaches sites 1, 2 and 3 over the E-LAN'
  node: XE1
  exec: local
  command: for d in 1 2 3; do echo "## $d"; .venv/bin/python topologies/login_probe.py XRT-12 ssh SW1 -- "ping 172.31.200.$d repeat 5"; done; echo '## END'
  raw:
  - regex: '## 1[\s\S]*?Success rate is (?:100|80) percent[\s\S]*?## 2[\s\S]*?Success rate is (?:100|80) percent[\s\S]*?## 3[\s\S]*?Success rate is (?:100|80) percent[\s\S]*?## END'
  points: 8
- name: 'M11-8 XE3: can send site 4''s traffic to XE1 or XE2 (SW1''s MAC behind the segment, two next hops)'
  node: XE1
  exec: local
  command: .venv/bin/python topologies/login_probe.py XRT-12 ssh XE3 --pre-cli 'SW1:ping 172.31.200.3 repeat 3' --settle 10 -- 'show l2vpn evpn mac'
  raw:
  - regex: \n[0-9a-f.]{14}\s+200\s+\d+\s+0000\.0000\.0000\.0000\.0401\s+0\s+10\.255\.0\.41\s*\n\s+10\.255\.0\.42
  points: 6
- name: 'M11-9 XE1: IP SLA operation 130 measures the two-way delay to MEP 3 with Y.1731, without stopping'
  node: XE1
  exec: local
  command: .venv/bin/python topologies/login_probe.py XRT-12 ssh XE1 --pre-cli 'XE1:configure terminal;;ip sla restart 130;;end' --settle 15 -- 'show ip sla configuration 130' 'show ip sla statistics 130
    details'
  raw:
  - regex: 'Ethernet Y1731 Delay Operation\s*\nFrame Type: DMM\s*\nDomain: PROV\s*\nEvc: E130\s*\nTarget Mpid: 3\s*\nSource Mpid: 1'
  - regex: 'Latest operation return code: OK'
  - regex: 'Number of TwoWay observations: [1-9]'
  - regex: 'Operation time to live: Forever'
  - regex: 'Operational state of entry: Active'
  points: 6
- name: 'M11-9 XE1, XE3: each end''s MEP (domain PROV, level 4, service E130) knows the other end''s MEP (MEP IDs 1 and 3)'
  node: XE1
  exec: local
  command: echo '## XE1'; .venv/bin/python topologies/login_probe.py XRT-12 ssh XE1 -- 'show ethernet cfm maintenance-points remote'; echo '## XE3'; .venv/bin/python topologies/login_probe.py XRT-12 ssh
    XE3 -- 'show ethernet cfm maintenance-points remote'; echo '## END'
  raw:
  - regex: '## XE1[\s\S]*?\n3\s+PROV\s+[0-9a-f.]{14}\s+Up\s+Up\s*\n\s*4\s+PROV[\s\S]*?E130\s+XCON[\s\S]*?MPID: 1 Domain: PROV MA: E130[\s\S]*?## XE3'
  - regex: '## XE3[\s\S]*?\n1\s+PROV\s+[0-9a-f.]{14}\s+Up\s+Up\s*\n\s*4\s+PROV[\s\S]*?E130\s+XCON[\s\S]*?MPID: 3 Domain: PROV MA: E130[\s\S]*?## END'
  points: 5
- name: 'M11-9 XE1, XE3: a CFM loopback reaches the other end''s MEP'
  node: XE1
  exec: local
  command: echo '## XE1'; .venv/bin/python topologies/login_probe.py XRT-12 ssh XE1 -- 'ping ethernet mpid 3 domain PROV service E130'; echo '## XE3'; .venv/bin/python topologies/login_probe.py XRT-12 ssh
    XE3 -- 'ping ethernet mpid 1 domain PROV service E130'; echo '## END'
  raw:
  - regex: '## XE1[\s\S]*?Success rate is (?:100|80) percent[\s\S]*?## XE3[\s\S]*?Success rate is (?:100|80) percent[\s\S]*?## END'
  points: 4
- name: 'M11-9 XE1: notices a silent break of the E-Line within 5 seconds (the far MEP is gone at +4.6 s)'
  node: XE1
  exec: local
  command: .venv/bin/python topologies/login_probe.py XRT-12 watch XE1 'show ethernet cfm maintenance-points remote' --samples 4 --interval 1 --fail-link XE3:P1 --post-settle 15
  raw:
  - regex: == SAMPLE 1 at[^\n]*\n[\s\S]*?\n3\s+PROV\s[\s\S]*?== SAMPLE 2
  - regex: == SAMPLE 4 at
  - not_regex: '== SAMPLE 4 at[^\n]*\n[\s\S]*Total Remote MEPs: [1-9]'
  points: 5
- name: 'M11-9 XE3: notices the same silent break within 5 seconds (the far MEP is gone at +4.6 s)'
  node: XE1
  exec: local
  command: .venv/bin/python topologies/login_probe.py XRT-12 watch XE3 'show ethernet cfm maintenance-points remote' --samples 4 --interval 1 --fail-link XE3:P1 --post-settle 15
  raw:
  - regex: == SAMPLE 1 at[^\n]*\n[\s\S]*?\n1\s+PROV\s[\s\S]*?== SAMPLE 2
  - regex: == SAMPLE 4 at
  - not_regex: '== SAMPLE 4 at[^\n]*\n[\s\S]*Total Remote MEPs: [1-9]'
  points: 5
