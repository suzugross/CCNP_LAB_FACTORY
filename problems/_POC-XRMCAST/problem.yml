# BL-257 PoC: マルチキャスト(SPCOR 4.4= PIM-SM・PIM-SSM・PIM-BIDIR・PIMv6・IGMP v1/v2/v3・MLD)を IOS XR で。
# 記録= problems/_drafts/XR-TRACK.design.md §31。手順= poc/xr/mcast_poc.sh
# 盤面(IS-IS CORE レベル 2・IPv4/IPv6。マルチキャストの設定は PoC の段で足す):
#   SRC1 ─ PE1(XRv9000)──────────── PE2(XRv9000)─ RCV2
#             └── P1(XRd・RP の候補)──┘    └ R5(IOL)┐
#                    └ P2(XRd)───────── SW1(LAN 192.168.3.0/24)─ RCV3
# - PE2 から SRC1 への最短は PE1 との直結(10)、RP(P1)へは P1 経由 → 共有木と最短経路木の道が分かれる(切り替えが見える)。
# - SW1 の LAN に P2(.252・XRd)と R5(.253・IOL)が並ぶ(DR= IP 最大= R5・querier= IP 最小= P2 の見込み)。LAN は両者とも IS-IS で passive。
# - XRd と XRv9000 の両方をデータの道に置く(XRd がマルチキャストを転送するかを見る。だめでも PE1─PE2 の直結は XRv9000 だけで通る)。
