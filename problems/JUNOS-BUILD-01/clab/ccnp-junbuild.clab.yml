# JUNOS-BUILD-01 の containerlab 側トポロジ。
# ★startup-config を意図的に置かない = JUN01 はブランク起動(mgmt/admin は
#   vrnetlab init.conf が持つ)。受験者が SSH でゼロから設定するのが本問の主題。
name: ccnp-junbuild
topology:
  nodes:
    jun01:
      kind: juniper_vjunosevolved
      image: vrnetlab/juniper_vjunosevolved:26.2R1.7-EVO
      mgmt-ipv4: 172.20.20.2
    br-cml:
      kind: bridge          # szk-cl01 上の既存ブリッジ(ens160=CML LAN-IX へのL2出口)
  links:
    - endpoints: ["jun01:eth1", "br-cml:eth1"]   # eth1 = et-0/0/0
