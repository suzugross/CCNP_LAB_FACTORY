# M13-6: SNMP の TS(前任者)。故障= ACL の許可の相手違い(v2c が無応答)・グループに notify のビューなし(トラップが 1 つも出ない)。
# ★ホストの auth/priv の取り違えは故障にしない(上書きしても動作が変わらない版固有の癖= design §30.9)。
# ★notify のビューなしは公式と実機の食い違い(リファレンスは host が自動で作ると書く= design §30.10)。2026-11-10 ユーザ判断で、読み物 e4 §2.8 の注記を前提に故障に使う。白紙= 0 点。
problem: XRT-15
total_points: 100
checks:
  - name: 'M13-6 SRV01: the NMS reads XR01 with SNMPv2c, community NMS-RO, and only SRV01 is allowed'
    node: XR01
    exec: local
    command: >-
      .venv/bin/python topologies/nms_probe.py XRT-15 linux SRV01 --
      'timeout 15 snmpget -v2c -c NMS-RO -t 3 -r 1 10.0.50.1 1.3.6.1.2.1.1.5.0 2>&1';
      .venv/bin/python topologies/login_probe.py XRT-15 ssh XR01 -- 'show running-config snmp-server community' 'show access-lists ipv4 NMS-ONLY'
    raw:
      - { regex: '\.3\.6\.1\.2\.1\.1\.5\.0 = STRING: "XR01"' }
      - { regex: 'snmp-server community NMS-RO RO IPv4 NMS-ONLY' }
      - { regex: 'permit ipv4 host 10\.0\.50\.10 any' }
      - { not_regex: 'permit ipv4 (?!host 10\.0\.50\.10 any)' }
    points: 40
  - name: 'M13-6 SRV01: link down and link up on XR01 arrive at the trap receiver as SNMPv3 authPriv traps (user nms-trap)'
    node: XR01
    exec: local
    command: .venv/bin/python topologies/nms_probe.py XRT-15 trap XR01 GigabitEthernet0/0/0/2 SRV01 /var/log/snmptrapd-lab.log --wait 15
    raw:
      - { regex: '== TRAPS linkDown=[1-9]\d* linkUp=[1-9]\d*' }
    points: 60
