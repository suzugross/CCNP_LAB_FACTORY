# XRT-15 最終確認(M13-1〜6 を終えた状態。配点= M13-1 15・M13-2 15・M13-3 20・M13-4 20・M13-5 15・M13-6 15)。学習目的のラボ= パック・ノルマの対象外。
# 中身は課題ごとの確認(grading.m13t<n>.yml)を写して配点を付け直したもの(機械的に組んだ・課題ごとの確認を直したらここも組み直す)。
# 確認は NMS(SRV01)の側で受けた数を数える(topologies/nms_probe.py)。フローは最大 100 秒待つので、全部で 5 分ほどかかる。
problem: XRT-15
total_points: 100
checks:
- name: 'M13-1 SRV01: the NMS opens a NETCONF session to XR01 on port 830 (hello with the candidate datastore)'
  node: XR01
  exec: local
  command: .venv/bin/python topologies/nms_probe.py XRT-15 netconf SRV01 10.0.50.1
  raw:
  - regex: == NETCONF OK capabilities=\d+ candidate=yes
  points: 6
- name: 'M13-1 XR01: Loopback100 (NMS-MANAGED, 10.255.100.1/32) is in place, committed through NETCONF'
  node: XR01
  exec: local
  command: .venv/bin/python topologies/nms_probe.py XRT-15 xr-commit XR01 'interface Loopback100'; .venv/bin/python topologies/login_probe.py XRT-15 ssh XR01 -- 'show running-config interface Loopback100'
  raw:
  - regex: == COMMIT \d+ line=netconf client=YANG Frame
  - regex: interface Loopback100\s*\n description NMS-MANAGED\s*\n ipv4 address 10\.255\.100\.1 255\.255\.255\.255
  points: 9
- name: 'M13-2 SRV01: the RESTCONF GET of the NMS script answers 200 over HTTPS with the account nms-api'
  node: PE2
  exec: local
  command: '.venv/bin/python topologies/nms_probe.py XRT-15 linux SRV01 -- ''curl -sk --max-time 20 -u nms-api:Api-Pass-15 -H "Accept: application/yang-data+json" -w "\n== HTTPS %{http_code}\n" https://10.0.50.2/restconf/data/Cisco-IOS-XE-native:native/hostname'''
  raw:
  - regex: '"Cisco-IOS-XE-native:hostname": "PE2"'
  - regex: == HTTPS 200
  points: 6
- name: 'M13-2 PE2: the service loopback from the script is in place (Loopback200, CUSTOMER-A-SERVICE, 10.255.200.2/32)'
  node: PE2
  exec: local
  command: .venv/bin/python topologies/login_probe.py XRT-15 ssh PE2 -- 'show running-config interface Loopback200'
  raw:
  - regex: description CUSTOMER-A-SERVICE
  - regex: ip address 10\.255\.200\.2 255\.255\.255\.255
  points: 6
- name: 'M13-2 PE2: plain HTTP stays closed, and nms-api is a local account'
  node: PE2
  exec: local
  command: .venv/bin/python topologies/nms_probe.py XRT-15 linux SRV01 -- 'curl -s -o /dev/null --max-time 10 -w "== HTTP %{http_code}\n" http://10.0.50.2/restconf/data/Cisco-IOS-XE-native:native/hostname;
    true'; .venv/bin/python topologies/login_probe.py XRT-15 ssh PE2 -- 'show running-config | include ^username nms-api|^ip http'
  raw:
  - regex: == HTTP 000
  - regex: '\nusername nms-api '
  - not_regex: \nip http server
  points: 3
- name: 'M13-3 SRV01: gNMI to XR01 port 57400 works with the NMS client certificate, and is refused without TLS or without a certificate'
  node: XR01
  exec: local
  command: .venv/bin/python topologies/nms_probe.py XRT-15 gnmi SRV01 10.0.50.1:57400
  raw:
  - regex: == GNMI plain FAIL
  - regex: == GNMI tls-nocert FAIL
  - regex: == GNMI tls-cert OK
  points: 14
- name: 'M13-3 XR01: the gRPC server runs on port 57400 in the global table, with TLS and mutual TLS'
  node: XR01
  exec: local
  command: .venv/bin/python topologies/login_probe.py XRT-15 ssh XR01 -- 'show grpc'
  raw:
  - regex: Port\s+:\s+57400\s*\n
  - regex: VRF\s+:\s+global-vrf
  - regex: \nTLS\s+:\s+enabled
  - regex: TLS mutual\s+:\s+enabled
  points: 6
- name: 'M13-4 XR01: subscription SUB-IF is active every 10 seconds, its sensor paths resolve, and the destination is active over TLS'
  node: XR01
  exec: local
  command: .venv/bin/python topologies/login_probe.py XRT-15 ssh XR01 -- 'show telemetry model-driven subscription SUB-IF'
  raw:
  - regex: Subscription:\s+SUB-IF[\s\S]*?State:\s+ACTIVE
  - regex: Sample Interval:\s+10000 ms
  - not_regex: Not Resolved
  - regex: Destination Port:\s+57500[\s\S]*?Transport:\s+grpc\s*\n\s+State:\s+Active\s*\n\s+TLS :\s+(?!False)\S+
  points: 8
- name: 'M13-4 SRV01: the collector receives the packet counters of XR01''s interfaces through SUB-IF during the check (30 seconds)'
  node: XR01
  exec: local
  command: .venv/bin/python topologies/nms_probe.py XRT-15 mdt SRV01 /var/log/telegraf/mdt.json --source XR01 --sub SUB-IF --within 40 --fresh 30 --iface GigabitEthernet0/0/0/0
  raw:
  - regex: == MDT RECENT [1-9]\d*
  - regex: == MDT IF GigabitEthernet0/0/0/0 PACKETS yes
  points: 12
- name: 'M13-5 SRV01: the traffic that customer A sends in on PE2 arrives at the collector as an IPFIX flow record with the right packet count'
  node: PE2
  exec: local
  command: .venv/bin/python topologies/nms_probe.py XRT-15 flow CE1 Loopback100 10.255.0.1 SRV01 /var/cache/nfdump/lab --count 37 --wait 100
  raw:
  - regex: == FLOW PACKETS (?:3[7-9]|[4-9]\d|\d{3,})\b
  points: 9
- name: 'M13-5 PE2: IPFIX from Loopback0 to 10.0.50.10 port 4739, on GigabitEthernet2 input, active flows reported within 60 seconds, with the required fields'
  node: PE2
  exec: local
  command: .venv/bin/python topologies/login_probe.py XRT-15 ssh PE2 -- 'show flow exporter' 'show flow monitor' 'show flow interface GigabitEthernet2' 'show flow exporter templates'
  raw:
  - regex: Export protocol:\s+IPFIX \(Version 10\)[\s\S]*?Destination IP address:\s+10\.0\.50\.10[\s\S]*?Source Interface:\s+Loopback0[\s\S]*?Destination Port:\s+4739
  - regex: Active Timeout:\s+(?:[1-9]|[1-5]\d|60) secs
  - regex: Interface GigabitEthernet2\s*\n\s+FNF:\s+monitor:\s+\S+\s*\n\s+direction:\s+Input
  - regex: '\| ipv4 source address '
  - regex: '\| ipv4 destination address '
  - regex: '\| ip protocol '
  - regex: '\| transport source-port '
  - regex: '\| transport destination-port '
  - regex: '\| interface input snmp '
  - regex: \| counter bytes
  - regex: \| counter packets
  points: 6
- name: 'M13-6 SRV01: the NMS reads XR01 with SNMPv2c, community NMS-RO, and only SRV01 is allowed'
  node: XR01
  exec: local
  command: .venv/bin/python topologies/nms_probe.py XRT-15 linux SRV01 -- 'timeout 15 snmpget -v2c -c NMS-RO -t 3 -r 1 10.0.50.1 1.3.6.1.2.1.1.5.0 2>&1'; .venv/bin/python topologies/login_probe.py XRT-15
    ssh XR01 -- 'show running-config snmp-server community' 'show access-lists ipv4 NMS-ONLY'
  raw:
  - regex: '\.3\.6\.1\.2\.1\.1\.5\.0 = STRING: "XR01"'
  - regex: snmp-server community NMS-RO RO IPv4 NMS-ONLY
  - regex: permit ipv4 host 10\.0\.50\.10 any
  - not_regex: permit ipv4 (?!host 10\.0\.50\.10 any)
  points: 6
- name: 'M13-6 SRV01: link down and link up on XR01 arrive at the trap receiver as SNMPv3 authPriv traps (user nms-trap)'
  node: XR01
  exec: local
  command: .venv/bin/python topologies/nms_probe.py XRT-15 trap XR01 GigabitEthernet0/0/0/2 SRV01 /var/log/snmptrapd-lab.log --wait 15
  raw:
  - regex: == TRAPS linkDown=[1-9]\d* linkUp=[1-9]\d*
  points: 9
