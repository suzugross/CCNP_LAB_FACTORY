# M13-2: RESTCONF(PE2)。NMS チームのスクリプトの GET が通る(HTTPS・nms-api)・スクリプトが入れる Loopback200 がある・平文の HTTP は閉じたまま。白紙= 0 点。
# ★RESTCONF は設定から約 1 分で答え始める(nginx のエラー ページの間は 200 にならない)。
problem: XRT-15
total_points: 100
checks:
  - name: 'M13-2 SRV01: the RESTCONF GET of the NMS script answers 200 over HTTPS with the account nms-api'
    node: PE2
    exec: local
    command: >-
      .venv/bin/python topologies/nms_probe.py XRT-15 linux SRV01 --
      'curl -sk --max-time 20 -u nms-api:Api-Pass-15 -H "Accept: application/yang-data+json" -w "\n== HTTPS %{http_code}\n" https://10.0.50.2/restconf/data/Cisco-IOS-XE-native:native/hostname'
    raw:
      - { regex: '"Cisco-IOS-XE-native:hostname": "PE2"' }
      - { regex: '== HTTPS 200' }
    points: 40
  - name: 'M13-2 PE2: the service loopback from the script is in place (Loopback200, CUSTOMER-A-SERVICE, 10.255.200.2/32)'
    node: PE2
    exec: local
    command: .venv/bin/python topologies/login_probe.py XRT-15 ssh PE2 -- 'show running-config interface Loopback200'
    raw:
      - { regex: 'description CUSTOMER-A-SERVICE' }
      - { regex: 'ip address 10\.255\.200\.2 255\.255\.255\.255' }
    points: 40
  - name: 'M13-2 PE2: plain HTTP stays closed, and nms-api is a local account'
    node: PE2
    exec: local
    command: >-
      .venv/bin/python topologies/nms_probe.py XRT-15 linux SRV01 --
      'curl -s -o /dev/null --max-time 10 -w "== HTTP %{http_code}\n" http://10.0.50.2/restconf/data/Cisco-IOS-XE-native:native/hostname; true';
      .venv/bin/python topologies/login_probe.py XRT-15 ssh PE2 -- 'show running-config | include ^username nms-api|^ip http'
    raw:
      - { regex: '== HTTP 000' }
      - { regex: '\nusername nms-api ' }
      - { not_regex: '\nip http server' }
    points: 20
