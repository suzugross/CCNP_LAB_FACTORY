# XRT-09: XR トラック M9 L3VPN(SPCOR 4.3)。BL-246。設計= problems/_drafts/XR-TRACK.design.md §22(PoC= _POC-XRL3VPN・_POC-XRL3VPNV)。
# 学習目的のラボ(パック・ノルマの対象外)。初期状態= XRT-07(M8-1〜5)を解き終えた状態からグローバルの「お客さま A'」を外し、
# VPNv4 のルート リフレクタ XR02・お客さま A/B の CE・共有サービス SVC・インターネット役 INET を足したもの。
#   XR01(PE・XRv9000) Gi0/0/0/2 CEA1・Gi0/0/0/3 CEB1・Gi0/0/0/4 SVC・Gi0/0/0/5 INET(グローバル)  RT02(PE・IOL・据付) Et0/2 CEA2・Et1/0 CEB2
#   XR02(RR・XRd)= RT03 の先の行き止まり(転送の道に入らない)
# 仕込み(XR02)= M9-2: route-reflector-client が ipv4 unicast の AF の下だけ+前任者が足した retain route-target all(全部持っているのに反映しない)。
# ★XR01 は XRv9000 26.1.1(§22.4= XRd の PE はお客さまから受けてラベルを付ける向きと通り抜けで TCP/UDP を壊す)。XR02 は XRd(転送しない)。
# ★お客さま側の IF は説明だけ(アドレスなし)= アドレスの付いた IF の VRF 変更は公式と実機が食い違うので採点しない(§22.6-1)。
