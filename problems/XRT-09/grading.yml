# XRT-09 最終確認(M9 の 4 課題を終えた状態。配点= M9-1 25・M9-2 35・M9-3 20・M9-4 20)。
# 学習目的のラボ= パック・ノルマの対象外。中身は課題ごとの確認(grading.<課題>.yml)を寄せ集めて配点を付け直したもの
# (手で保守する。課題ごとの確認を直したらここも直す)。白紙で通る項目は無い(否定の条件は肯定の条件と同じ確認に入れてある)。
problem: XRT-09
total_points: 100
checks:
- name: 'M9-1 XR01: the eBGP session with CEA1 in VRF CUST-A is up and both of its routes are accepted'
  node: XR01
  command: show bgp vrf CUST-A summary
  raw:
  - regex: 172\.16\.11\.2\s+0\s+65101(?:\s+\d+){5}\s+[\dwdhm:]+\s+2(?!\S)
  points: 5
- name: 'M9-1 XR01: the eBGP session with CEB1 in VRF CUST-B is up and its route is accepted'
  node: XR01
  command: show bgp vrf CUST-B summary
  raw:
  - regex: 172\.16\.21\.2\s+0\s+65201(?:\s+\d+){5}\s+[\dwdhm:]+\s+1(?!\S)
  points: 4
- name: 'M9-1 XR01: a VPNv4 session with XR02 is up, and none with RT02'
  node: XR01
  command: show bgp vpnv4 unicast summary
  raw:
  - regex: 10\.255\.0\.21\s+0\s+65000(?:\s+\d+){5}\s+[\dwdhm:]+\s+\d+(?!\S)
  - not_regex: \n10\.255\.0\.12\s
  points: 4
- name: 'M9-1 XR01: sends the routes of both VRFs to XR02'
  node: XR01
  command: show bgp vpnv4 unicast neighbors 10.255.0.21 advertised-count
  raw:
  - regex: 'No of prefixes Advertised: (?:[3-9]|\d{2,})\b'
  points: 3
- name: 'M9-1 XR01: customer A''s routes carry RD 10.255.0.1:101 and route target 65000:101'
  node: XR01
  command: show bgp vpnv4 unicast rd 10.255.0.1:101 10.101.1.0/24
  raw:
  - regex: 'Route Distinguisher: 10\.255\.0\.1:101'
  - regex: 'Extended community: RT:65000:101(?!\d)'
  points: 3
- name: 'M9-1 XR01: customer B''s routes carry RD 10.255.0.1:102 and route target 65000:102'
  node: XR01
  command: show bgp vpnv4 unicast rd 10.255.0.1:102 10.102.1.0/24
  raw:
  - regex: 'Route Distinguisher: 10\.255\.0\.1:102'
  - regex: 'Extended community: RT:65000:102(?!\d)'
  points: 3
- name: 'M9-1 XR01: the VRFs import the route targets of the table'
  node: XR01
  command: show vrf all detail
  raw:
  - regex: VRF CUST-A;[\s\S]*?Import VPN route-target communities:\s+RT:65000:101\s+RT:65000:900\s+Export VPN route-target communities:\s+RT:65000:101(?!\d)
  - regex: VRF CUST-B;[\s\S]*?Import VPN route-target communities:\s+RT:65000:102\s+RT:65000:900\s+Export VPN route-target communities:\s+RT:65000:102(?!\d)
  points: 3
- name: 'M9-2 RT02: learns customer A''s site 1 from XR01, reflected by XR02'
  node: RT02
  command: show ip bgp vpnv4 vrf CUST-A 10.101.1.0
  raw:
  - regex: 10\.255\.0\.1 \(metric \d+\)[\s\S]*?from 10\.255\.0\.21
  - regex: 'Cluster list: 10\.255\.0\.21'
  points: 6
- name: 'M9-2 CEA1: learns site 2 of customer A from XR01'
  node: CEA1
  command: show ip bgp
  raw:
  - regex: 10\.101\.2\.0/24\s+172\.16\.11\.1\s
  points: 5
- name: 'M9-2 CEA1: the LAN of site 1 reaches the LAN of site 2'
  node: CEA1
  command: ping 10.101.2.1 source Loopback10 repeat 5
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 6
- name: 'M9-2 CEA2: the LAN of site 2 reaches the LAN of site 1'
  node: CEA2
  command: ping 10.101.1.1 source Loopback10 repeat 5
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 5
- name: 'M9-2 CEB1: the sites of customer B reach each other'
  node: CEB1
  command: ping 10.102.2.1 source Loopback10 repeat 5
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 5
- name: 'M9-2 CEB2: the sites of customer B reach each other (the other way)'
  node: CEB2
  command: ping 10.102.1.1 source Loopback10 repeat 5
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 4
- name: 'M9-2 CEA2: customer A learns nothing of customer B'
  node: CEA2
  command: show ip route
  raw:
  - regex: 10\.101\.1\.0
  - not_regex: 10\.102\.
  points: 2
- name: 'M9-2 CEB1: customer B learns nothing of customer A'
  node: CEB1
  command: show ip route
  raw:
  - regex: 10\.102\.2\.0
  - not_regex: 10\.101\.
  points: 2
- name: 'M9-3 XR01: 10.99.1.0/24 leaves VRF SVC with route targets 65000:900 and 65000:999'
  node: XR01
  command: show bgp vpnv4 unicast rd 10.255.0.1:900 10.99.1.0/24
  raw:
  - regex: Extended community:[^\n]*RT:65000:900
  - regex: Extended community:[^\n]*RT:65000:999
  points: 4
- name: 'M9-3 XR01: 10.99.2.0/24 leaves VRF SVC with route target 65000:999 only'
  node: XR01
  command: show bgp vpnv4 unicast rd 10.255.0.1:900 10.99.2.0/24
  raw:
  - regex: Extended community:[^\n]*RT:65000:999
  - not_regex: RT:65000:900
  points: 2
- name: 'M9-3 CEA2: site 2 of customer A reaches the shared servers'
  node: CEA2
  command: ping 10.99.1.1 source Loopback10 repeat 5
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 2
- name: 'M9-3 CEB2: site 2 of customer B reaches the shared servers'
  node: CEB2
  command: ping 10.99.1.1 source Loopback10 repeat 5
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 2
- name: 'M9-3 CEA1: site 1 of customer A reaches the shared servers'
  node: CEA1
  command: ping 10.99.1.1 source Loopback10 repeat 5
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 2
- name: 'M9-3 CEB1: site 1 of customer B reaches the shared servers'
  node: CEB1
  command: ping 10.99.1.1 source Loopback10 repeat 5
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 1
- name: 'M9-3 SVC: reaches site 2 of customer A'
  node: SVC
  command: ping 10.101.2.1 source Loopback10 repeat 5
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 2
- name: 'M9-3 SVC: reaches site 2 of customer B'
  node: SVC
  command: ping 10.102.2.1 source Loopback10 repeat 5
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 2
- name: 'M9-3 CEA2: learns 10.99.1.0/24 but not 10.99.2.0/24, and nothing of customer B'
  node: CEA2
  command: show ip route
  raw:
  - regex: 10\.99\.1\.0
  - not_regex: 10\.99\.2\.0
  - not_regex: 10\.102\.
  points: 2
- name: 'M9-3 CEB1: learns 10.99.1.0/24 but not 10.99.2.0/24, and nothing of customer A'
  node: CEB1
  command: show ip route
  raw:
  - regex: 10\.99\.1\.0
  - not_regex: 10\.99\.2\.0
  - not_regex: 10\.101\.
  points: 1
- name: 'M9-4 INET: learns customer A''s two public segments, and nothing else from AS 65000'
  node: INET
  command: show ip bgp
  raw:
  - regex: 198\.51\.100\.0/25\s+192\.0\.2\.1\s
  - regex: 198\.51\.100\.128/25\s+192\.0\.2\.1\s
  - not_regex: \s(?:10|172)\.\S+\s+192\.0\.2\.1\s
  points: 5
- name: 'M9-4 CEA1: the public segment of site 1 reaches the Internet'
  node: CEA1
  command: ping 203.0.113.10 source Loopback11 repeat 5
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 3
- name: 'M9-4 CEA2: the public segment of site 2 reaches the Internet'
  node: CEA2
  command: ping 203.0.113.10 source Loopback11 repeat 5
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 3
- name: 'M9-4 INET: reaches the public segment of site 2'
  node: INET
  command: ping 198.51.100.129 source Loopback10 repeat 5
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 2
- name: 'M9-4 CEA1: learns a default route from XR01'
  node: CEA1
  command: show ip route 0.0.0.0
  raw:
  - regex: Known via "bgp 65101"
  points: 1
- name: 'M9-4 CEA2: learns a default route from RT02'
  node: CEA2
  command: show ip route 0.0.0.0
  raw:
  - regex: Known via "bgp 65101"
  points: 2
- name: 'M9-4 CEB1: customer B keeps its VPN and has no default route'
  node: CEB1
  command: show ip route
  raw:
  - regex: 10\.102\.2\.0
  - regex: Gateway of last resort is not set
  points: 2
- name: 'M9-4 CEB2: customer B keeps its VPN and has no default route (site 2)'
  node: CEB2
  command: show ip route
  raw:
  - regex: 10\.102\.1\.0
  - regex: Gateway of last resort is not set
  points: 2
