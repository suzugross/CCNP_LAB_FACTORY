# containerlab だけの問題を学習モードのワークスペースで解く確かめ・雛形(BL-275)。出題用ではない。
# 盤面は clab.yml から、コンソールは szk-cl01 を踏み台にした SSH(JUN01)と docker exec の vtysh(FRR1)。
# 開き方: scripts/lab.sh provision POC-CLABLEARN-01 → scripts/lab.sh learn POC-CLABLEARN-01
#         (ポータルからは /_learn?id=POC-CLABLEARN-01)。設計= problems/_drafts/JUNOS-TRACK.design.md §4
id: POC-CLABLEARN-01
title: "[PoC] containerlab 学習モード Junos × FRR"
exam: POC
topics: [junos, frr, ospf, containerlab, workspace]
difficulty: 1
platform: clab
target_nodes: [JUN01]
points: 100
access: ssh

clab_nodes:
  JUN01: 172.20.20.31
  FRR1: 172.20.20.32
clab_topology: clab/ccnp-clablearn.clab.yml

# === トポロジ =============================================
#   JUN01(白紙・受験者が設定) et-0/0/0 ── eth1 FRR1(据え付け)
#    lo0 192.168.0.1/32          10.0.14.0/30      lo 192.168.0.4/32
#                             OSPF area 0
