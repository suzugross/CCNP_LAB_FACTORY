# M0-1: JUN01 の et-0/0/0.0 と lo0.0 のアドレス(commit 済み=設定に出る)と、ユニットが up でアドレスが付いていること。
problem: POC-CLABLEARN-01
total_points: 100
checks:
  - name: "M0-1 JUN01: et-0/0/0.0 has 10.0.14.1/30 and lo0.0 has 192.168.0.1/32 (committed)"
    node: JUN01
    exec: junos
    command: "show configuration | display set"
    raw:
      - regex: 'set interfaces et-0/0/0 unit 0 family inet address 10\.0\.14\.1/30'
      - regex: 'set interfaces lo0 unit 0 family inet address 192\.168\.0\.1/32'
    points: 50
  - name: "M0-1 JUN01: et-0/0/0.0 is up with its address"
    node: JUN01
    exec: junos
    command: "show interfaces terse et-0/0/0.0"
    raw:
      - regex: 'et-0/0/0\.0\s+up\s+up\s+inet\s+10\.0\.14\.1/30'
    points: 50
