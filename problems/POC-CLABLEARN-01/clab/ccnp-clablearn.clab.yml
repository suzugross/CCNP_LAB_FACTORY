# POC-CLABLEARN-01 の containerlab トポロジ(学習モードのワークスペースの確かめ・BL-275)。
# jun01= 白紙(mgmt と admin は vrnetlab の init.conf)。eth1 → et-0/0/0。frr1= 据え付け(kind: frr)。
# labels の graph-posX / graph-posY= ワークスペースの結線図の座標(containerlab の graph と同じ書き方)。
name: ccnp-clablearn
topology:
  nodes:
    jun01:
      kind: juniper_vjunosevolved
      image: vrnetlab/juniper_vjunosevolved:26.2R1.7-EVO
      mgmt-ipv4: 172.20.20.31
      labels: { graph-posX: "0", graph-posY: "0" }
    frr1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      mgmt-ipv4: 172.20.20.32
      startup-config: frr1/frr.conf
      daemons: [ospfd]
      labels: { graph-posX: "260", graph-posY: "0" }
  links:
    # ★MTU 1500(veth の既定 9500 だと OSPF が ExStart で止まる・CLAB-SOLO.design.md §7)
    - type: veth
      mtu: 1500
      endpoints:
        - node: jun01
          interface: eth1
        - node: frr1
          interface: eth1
