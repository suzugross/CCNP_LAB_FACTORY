# 自動生成 (gen_route_ctrl.py) seed=39518 shape=quad24 excl=acl_named e2o=rm_pl o2e=rm
problem: GEN-RTCTL-39518
total_points: 100
defaults:
  genie_os: iosxe
checks:
- name: '基線維持: RT01 の EIGRP 隣接が両フィードと確立している'
  node: RT01
  command: show ip eigrp neighbors
  raw:
  - contains: 10.1.12.2
  - contains: 10.1.13.2
  points: 3
- name: '基線維持: RT01-RT05 の OSPF 隣接が FULL である'
  node: RT01
  command: show ip ospf neighbor
  raw:
  - contains: FULL
  - contains: 10.1.15.2
  points: 3
- name: 'T1: 192.168.67.0/24 が RT02 から学習されていない'
  node: RT01
  command: show ip route 192.168.67.0
  raw:
  - contains: 10.1.13.2
  - not_contains: 10.1.12.2
  points: 5
- name: 'T1: 192.168.31.0/24 が RT02 から学習されていない'
  node: RT01
  command: show ip route 192.168.31.0
  raw:
  - contains: 10.1.13.2
  - not_contains: 10.1.12.2
  points: 5
- name: 'T1: 巻き添えなし — 10.1.24.0/30 が RT02 直行のまま'
  node: RT01
  command: show ip route 10.1.24.0 255.255.255.252
  raw:
  - contains: 10.1.12.2
  - not_contains: 10.1.13.2
  points: 7
- name: 'T1: 巻き添えなし — 172.26.164.0/24 の ECMP(両フィード)が維持されている'
  node: RT01
  command: show ip route 172.26.164.0
  raw:
  - contains: 10.1.12.2
  - contains: 10.1.13.2
  points: 4
- name: 'T1: 制約 — 指定リスト FILTER-CORE-IN の distribute-list を Ethernet0/0 の in に適用'
  node: RT01
  command: show running-config | section router eigrp
  raw:
  - regex: distribute-list FILTER-CORE-IN in Ethernet0/0
  points: 5
- name: 'T1: 制約 — リスト FILTER-CORE-IN に deny エントリが無い(permit 列挙)'
  node: RT01
  command: show access-lists FILTER-CORE-IN
  raw:
  - contains: permit
  - not_regex: '(?m)^\s*\d+ deny '
  points: 5
- name: 'T2: RT05 の外部経路が指定の 4 経路のみである'
  node: RT05
  command: show ip route ospf
  raw:
  - regex: (?m)^O E2 +172\.26\.96\.0 \[110/
  - regex: (?m)^O E2 +172\.26\.97\.0 \[110/
  - regex: (?m)^O E2 +172\.26\.98\.0 \[110/
  - regex: (?m)^O E2 +172\.26\.99\.0 \[110/
  - not_contains: 172.26.164.0
  - not_regex: 10\.4\.
  - not_regex: 192\.168\.
  - not_regex: 10\.1\.(12|13|24|34)\.
  points: 10
- name: 'T2: 制約 — prefix-list PL-BRANCH24 が 1 行である'
  node: RT01
  command: show ip prefix-list PL-BRANCH24
  raw:
  - regex: 'ip prefix-list PL-BRANCH24: 1 entries'
  - contains: permit
  points: 5
- name: 'T2: 制約 — 再配送が route-map RM-REDIST-OUT を参照している'
  node: RT01
  command: show running-config | section router ospf
  raw:
  - regex: redistribute eigrp 100 (subnets )?route-map RM-REDIST-OUT
  points: 5
- name: 'T3: RT04 が 10.43.7.0/24 と 10.43.15.0/24 のみ外部学習(デコイ遮断)'
  node: RT04
  command: show ip route eigrp
  raw:
  - regex: (?m)^D EX +10.43.7.0/24
  - regex: (?m)^D EX +10.43.15.0/24
  - not_contains: 172.25.100.0
  - not_contains: 10.1.15.0
  points: 7
- name: 'T3: 制約 — route-map RM-OSPF-IMPORT と seed metric(distribute-list 不使用)'
  node: RT01
  command: show running-config
  raw:
  - regex: redistribute ospf 1[^\n]*route-map RM-OSPF-IMPORT(?!\S)
  - regex: (?:redistribute ospf 1 metric 50000 200 255 1 1500(?!\d)|default-metric 50000 200 255 1 1500(?!\d)|set metric 50000 200 255 1 1500(?!\d))
  - not_regex: distribute-list \S+ out ospf
  points: 5
- name: 'T3: 制約 — route-map RM-OSPF-IMPORT が ACL 76 を参照'
  node: RT01
  command: show running-config | section route-map
  raw:
  - regex: route-map RM-OSPF-IMPORT permit
  - regex: match ip address 76(?!\d)
  points: 3
- name: 'T4: 追加要件 — 10.43.23.0/24 が EIGRP ドメインへ届いている'
  node: RT04
  command: show ip route 10.43.23.0
  raw:
  - contains: Known via "eigrp 100"
  - contains: distance 170
  points: 5
- name: 'T4: ACL 76 が 3 permit(deny なし)である'
  node: RT01
  command: show access-lists 76
  raw:
  - contains: 10.43.7.0
  - contains: 10.43.15.0
  - contains: 10.43.23.0
  - not_regex: '(?m)^\s*\d+ deny '
  points: 5
- name: 'T5: RT04 から 10.43.7.1 への source 指定 ping が成功'
  node: RT04
  command: ping 10.43.7.1 source 172.26.96.1 repeat 5
  raw:
  - regex: Success rate is (80|100) percent
  points: 7
- name: '監査: RT02 の構成が変更されていない'
  node: RT02
  command: show running-config | include distribute-list|offset-list|route-map|redistribute
  raw:
  - not_regex: (distribute-list|offset-list|route-map|redistribute)
  points: 3
- name: '監査: RT03 の構成が変更されていない'
  node: RT03
  command: show running-config | include distribute-list|offset-list|route-map|redistribute
  raw:
  - not_regex: (distribute-list|offset-list|route-map|redistribute)
  points: 3
- name: '監査: RT04 の構成が変更されていない'
  node: RT04
  command: show running-config | include distribute-list|offset-list|route-map|redistribute
  raw:
  - not_regex: (distribute-list|offset-list|route-map|redistribute)
  points: 3
- name: '監査: RT05 の構成が変更されていない'
  node: RT05
  command: show running-config | include distribute-list|offset-list|route-map|redistribute
  raw:
  - not_regex: (distribute-list|offset-list|route-map|redistribute)
  points: 2
