# XRT-05 最終確認(M4 追補の 4 課題を終えた状態。配点 各 25 = M4-5 6/5/4/4/6・M4-6 8/6/6/5・M4-7 9/9/4/3・M4-8 6/5/4/10)。
# 学習目的のラボ= パック・ノルマの対象外。中身は課題ごとの確認(grading.<課題>.yml)を寄せ集めて配点を付け直したもの
# (手で保守する。課題ごとの確認を直したらここも直す。作り直しは problems/XRT-05 で同じスクリプトを流す)。白紙で通る項目は無い。
problem: XRT-05
total_points: 100
checks:
- name: 'M4-5 XR01: Level 2 adjacencies with RT02 and RT03 on CORE-A and CORE-B'
  node: XR01
  command: show isis adjacency
  raw:
  - regex: Level-2 adjacencies:[\s\S]*(?:RT02|0102\.5500\.0002)\s+Gi0/0/0/1\s+\*PtoP\*\s+Up
  - regex: Level-2 adjacencies:[\s\S]*(?:RT03|0102\.5500\.0003)\s+Gi0/0/0/2\s+\*PtoP\*\s+Up
  points: 6
- name: 'M4-5 RT02: accepts XR01''s LSP (IPv4 routes to the loopbacks of XR01 and RT01)'
  node: RT02
  command: show ip route isis
  raw:
  - regex: 'i L2\s+10\.255\.0\.1/32 '
  - regex: 'i L2\s+10\.255\.0\.11/32 '
  points: 5
- name: 'M4-5 RT03: IPv6 routes to the loopbacks of XR01 and RT01'
  node: RT03
  command: show ipv6 route isis
  raw:
  - regex: I2\s+2001:DB8:255::1/128
  - regex: I2\s+2001:DB8:255::11/128
  points: 4
- name: 'M4-5 RT01: reaches RT02''s services network'
  node: RT01
  command: ping 10.20.0.1 source Loopback0
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 4
- name: 'M4-5 Level 1 stays unauthenticated: a new prefix on RT01 (added for the check) reaches the backbone'
  node: RT02
  exec: local
  command: .venv/bin/python topologies/login_probe.py XRT-05 ssh RT02 --pre-cli 'RT01:configure terminal;;interface Loopback98;;ip address 10.111.0.1 255.255.255.0;;ip router isis;;end' --settle 25 --post-cli
    'RT01:configure terminal;;no interface Loopback98;;end' -- 'show ip route 10.111.0.0'
  raw:
  - regex: Known via "isis"
  points: 6
- name: 'M4-6 XR01: Level 2 adjacencies with RT02 and RT03 on SVC-LAN, as a LAN'
  node: XR01
  command: show isis adjacency
  raw:
  - regex: Level-2 adjacencies:[\s\S]*(?:RT02|0102\.5500\.0002)\s+Gi0/0/0/3\s+[0-9a-f]{4}\.[0-9a-f]{4}\.[0-9a-f]{4}\s+Up
  - regex: Level-2 adjacencies:[\s\S]*(?:RT03|0102\.5500\.0003)\s+Gi0/0/0/3\s+[0-9a-f]{4}\.[0-9a-f]{4}\.[0-9a-f]{4}\s+Up
  points: 8
- name: 'M4-6 XR01: SVC-LAN runs Level 2 only, IPv4 and IPv6, with a priority above RT03''s'
  node: XR01
  command: show isis interface GigabitEthernet0/0/0/3
  raw:
  - regex: Circuit Type:\s+level-2-only
  - regex: Media Type:\s+LAN
  - regex: Priority \(Local/DIS\):\s+(?:8[1-9]|9\d|1[01]\d|12[0-7])/
  - regex: IPv4 Unicast Topology:\s+Enabled\s*\n\s+Adjacency Formation:\s+Running
  - regex: IPv6 Unicast Topology:\s+Enabled\s*\n\s+Adjacency Formation:\s+Running
  points: 6
- name: 'M4-6 RT02: XR01 is the designated IS of SVC-LAN'
  node: RT02
  command: show clns interface Ethernet0/2
  raw:
  - regex: 'DR ID: (?:XR01|0102\.5500\.0001)\.\d+'
  points: 6
- name: 'M4-6 RT03: XR01 is the designated IS of SVC-LAN'
  node: RT03
  command: show clns interface Ethernet0/2
  raw:
  - regex: 'DR ID: (?:XR01|0102\.5500\.0001)\.\d+'
  points: 5
- name: 'M4-7 RT02: one IPv4 route for the access LANs, no individual /24, RT01''s loopback kept'
  node: RT02
  command: show ip route isis
  raw:
  - regex: 'i L2\s+10\.11\.0\.0/16 '
  - not_regex: 10\.11\.\d+\.0/24
  - regex: 'i L2\s+10\.255\.0\.11/32 '
  points: 9
- name: 'M4-7 RT02: one IPv6 route for the access LANs, no individual /64, RT01''s loopback kept'
  node: RT02
  command: show ipv6 route isis
  raw:
  - regex: 'I2\s+2001:DB8:1011::/48 '
  - not_regex: 2001:DB8:1011:[1-4]::/64
  - regex: 'I2\s+2001:DB8:255::11/128 '
  points: 9
- name: 'M4-7 XR01: the IPv4 summary is installed as a discard route'
  node: XR01
  command: show route ipv4 10.11.0.0/16
  raw:
  - regex: type manual summary
  - regex: via Null0
  points: 4
- name: 'M4-7 XR01: the IPv6 summary is installed as a discard route'
  node: XR01
  command: show route ipv6 2001:db8:1011::/48
  raw:
  - regex: type manual summary
  - regex: via Null0
  points: 3
- name: 'M4-8 XR01: area 49.0010 only, system ID 0102.5500.0001 kept'
  node: XR01
  command: show isis
  raw:
  - regex: 'System Id: 0102\.5500\.0001\s'
  - regex: Manual area address\(es\):\s*\n\s*49\.0010\s*\n\s*Routing for
  points: 6
- name: 'M4-8 XR01: adjacencies with RT01 (Level 1) and with RT02 and RT03 (Level 2) are up'
  node: XR01
  command: show isis adjacency
  raw:
  - regex: Level-1 adjacencies:(?:(?!Level-2)[\s\S])*(?:RT01|0102\.5500\.0011)\s+Gi0/0/0/0\s+\*PtoP\*\s+Up
  - regex: Level-2 adjacencies:[\s\S]*(?:RT02|0102\.5500\.0002)\s+Gi0/0/0/1\s+\*PtoP\*\s+Up
  - regex: Level-2 adjacencies:[\s\S]*(?:RT03|0102\.5500\.0003)\s+Gi0/0/0/2\s+\*PtoP\*\s+Up
  points: 5
- name: 'M4-8 RT01: still reaches RT03''s services network'
  node: RT01
  command: ping 10.30.0.1 source Loopback0
  raw:
  - regex: Success rate is (?:100|80) percent
  points: 4
- name: 'M4-8 XR01: no adjacency went down after the new area was configured'
  node: XR01
  exec: local
  command: .venv/bin/python topologies/login_probe.py XRT-05 xr-adj-since XR01 '^\s*net 49\.0010\.'
  raw:
  - regex: == ADJ STABLE
  points: 10
