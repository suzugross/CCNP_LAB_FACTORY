# BL-246 PoC: M8 MPLS LDP(隣接・認証とラベルの絞り込み・LDP と IS-IS の同期・セッション保護・OAM)。出題用ではない。記録= design §20
# 盤面(§20.1)= 四角形。XR01 は PE、RT01・RT03 は BGP を動かさない P(BGP フリー コア)、RT02 は PE。
#   XR01(XRv9000 26.1.1) Gi0/0/0/0 ── Et0/0 RT01 Et0/1 ── Et0/0 RT02   … 主経路(メトリック 10+10)
#   XR01 Gi0/0/0/1 ── Et0/0 RT03 Et0/1 ── Et0/1 RT02                   … 予備経路(メトリック 100+100)
#   XR01 ⇔ RT02 はループバック間で iBGP(AS 65000)。お客さまの経路= XR01 Lo100 10.30/16・RT02 Lo100 10.20/16(BGP だけ)。
# 脇の系統(XRd が MPLS を転送するかの確かめ・主の盤面とは配線なし):
#   RT04 Et0/0 ── Gi0/0/0/0 XR02(XRd 26.1.1) Gi0/0/0/1 ── Et0/0 RT05   … RT04 ⇔ RT05 が iBGP(AS 65100)・XR02 は BGP なし
