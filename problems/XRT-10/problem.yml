# XRT-10: XR トラック M10 セグメントルーティング(SPCOR 3.3)。BL-246。設計= problems/_drafts/XR-TRACK.design.md §23(PoC= _POC-XRSR)。
# 学習目的のラボ(パック・ノルマの対象外)。初期状態= XRT-09(M9-1〜4)を解き終えた状態(L3VPN が LDP の上で動いている)に、
# IOS 側の SR の準備(RT01〜RT03= SRGB 既定・index 11〜13・sr-label-preferred・TI-LFA・XR01 向きの IF は LDP の同期を外し BFD)を足したもの。
#   XR01(PE・XRv9000) Gi0/0/0/0 RT01(主)・Gi0/0/0/1 RT03(予備)・お客さま側は M9 のまま  XR02(RR・XRd)= M10-5 で PCE にする
# 仕込み(XR01.commits.yml)= M10-1: 前任者の CHG-1301 が SRGB を 16000-16009 に狭めた(相手の index が範囲外= SR のラベルができない)。
# ★XR01 は XRv9000 26.1.1(TI-LFA・BFD・PE の転送。XRd は BFD を作らず、PE の転送で TCP/UDP を壊す= §14・§22.4)。XR02 は XRd(PCE= 転送しない)。
# ★採点は状態で見る(故障を起こさない)= この環境では TI-LFA の差が BFD の検出時間に埋もれ、XR の BFD は落とすたびに dampening が延びる(§23.4-10・14)。
