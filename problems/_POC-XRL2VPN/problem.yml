# BL-246 PoC: M11 L2VPN とキャリア イーサネット(SPCOR 4.1.a・4.2)の機種の見極めと挙動の実測。記録= problems/_drafts/XR-TRACK.design.md §24。手順= poc/xr/l2vpn_poc.sh
# 盤面= 四角形のコア(IS-IS CORE・LDP。パスワードやセッション保護は省いた素の形)に PE を 4 台:
#   XR01(PE・XRv9000) Gi0/0/0/2 CE1・Gi0/0/0/3 SW1      XR02(PE・XRv9000・RT03 の先) Gi0/0/0/1 CE4・Gi0/0/0/2 SW1
#   XR03(PE・XRd・RT01 の先) Gi0/0/0/1 CE3(XRd が L2 を転送するかを見る)   RT02(PE・IOL) Et0/2 CE2
#   SW1(IOL-L2)= XR01 と XR02 に二重に収容する CE(EVPN のマルチホーム用)
# CE は IOL ルータのサブインタフェースで VLAN を出し分ける(サービスごとに 192.168.<VLAN>.0/24・ホスト部= CE の番号)。PE 側の設定は PoC の段で足す。
