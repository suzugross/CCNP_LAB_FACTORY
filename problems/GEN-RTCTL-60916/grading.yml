# 自動生成 (gen_route_ctrl.py) seed=60916 shape=quad24 excl=pl_dl e2o=ospf_dl_out o2e=free
problem: GEN-RTCTL-60916
total_points: 100
defaults:
  genie_os: iosxe
checks:
- name: '基線維持: RT01 の EIGRP 隣接が両フィードと確立している'
  node: RT01
  command: show ip eigrp neighbors
  raw:
  - contains: 10.1.12.2
  - contains: 10.1.13.2
  points: 2
- name: '基線維持: RT01-RT05 の OSPF 隣接が FULL である'
  node: RT01
  command: show ip ospf neighbor
  raw:
  - contains: FULL
  - contains: 10.1.15.2
  points: 2
- name: 'T1: 192.168.226.0/24 が RT02 から学習されていない'
  node: RT01
  command: show ip route 192.168.226.0
  raw:
  - contains: 10.1.13.2
  - not_contains: 10.1.12.2
  points: 4
- name: 'T1: 192.168.111.0/24 が RT02 から学習されていない'
  node: RT01
  command: show ip route 192.168.111.0
  raw:
  - contains: 10.1.13.2
  - not_contains: 10.1.12.2
  points: 4
- name: 'T1: 巻き添えなし — 10.1.24.0/30 が RT02 直行のまま'
  node: RT01
  command: show ip route 10.1.24.0 255.255.255.252
  raw:
  - contains: 10.1.12.2
  - not_contains: 10.1.13.2
  points: 6
- name: 'T1: 巻き添えなし — 172.31.96.0/24 の ECMP(両フィード)が維持されている'
  node: RT01
  command: show ip route 172.31.96.0
  raw:
  - contains: 10.1.12.2
  - contains: 10.1.13.2
  points: 3
- name: 'T1: 制約 — 指定リスト PL-EDGE-IN の distribute-list を Ethernet0/0 の in に適用'
  node: RT01
  command: show running-config | section router eigrp
  raw:
  - regex: distribute-list prefix PL-EDGE-IN in Ethernet0/0
  points: 4
- name: 'T1: 制約 — prefix-list PL-EDGE-IN に deny エントリが無い'
  node: RT01
  command: show ip prefix-list PL-EDGE-IN
  raw:
  - contains: permit
  - not_regex: '(?m)^\s+seq \d+ deny '
  points: 4
- name: 'T2: RT05 の外部経路が指定の 4 経路のみである'
  node: RT05
  command: show ip route ospf
  raw:
  - regex: (?m)^O E2 +172\.31\.180\.0 \[110/
  - regex: (?m)^O E2 +172\.31\.181\.0 \[110/
  - regex: (?m)^O E2 +172\.31\.182\.0 \[110/
  - regex: (?m)^O E2 +172\.31\.183\.0 \[110/
  - not_contains: 172.31.96.0
  - not_regex: 10\.42\.
  - not_regex: 192\.168\.
  - not_regex: 10\.1\.(12|13|24|34)\.
  points: 9
- name: 'T2: 制約 — OSPF 側のプロトコル指定 distribute-list(ACL 9)で実現(route-map 不使用)'
  node: RT01
  command: show running-config | section router ospf
  raw:
  - regex: distribute-list 9 out eigrp 100
  - regex: redistribute eigrp 100
  - not_regex: redistribute eigrp 100[^\n]*route-map
  points: 8
- name: 'T3: 10.42.42.0/24 が Ethernet0/0 経由で転送される'
  node: RT01
  command: show ip route 10.42.42.0
  raw:
  - contains: via Ethernet0/0
  - not_contains: Ethernet0/1
  points: 5
- name: 'T3: 10.42.49.0/24 が Ethernet0/0 経由で転送される'
  node: RT01
  command: show ip route 10.42.49.0
  raw:
  - contains: via Ethernet0/0
  - not_contains: Ethernet0/1
  points: 5
- name: 'T3: 例外 10.42.47.0/24 だけが Ethernet0/1 経由で転送される'
  node: RT01
  command: show ip route 10.42.47.0
  raw:
  - contains: via Ethernet0/1
  - not_contains: Ethernet0/0
  points: 7
- name: 'T3: 10.42.47.0/24 の代替経路が topology table に残っている(切替可能)'
  node: RT01
  command: show ip eigrp topology 10.42.47.0/24
  raw:
  - contains: 1 Successor
  - contains: Ethernet0/0
  - contains: Ethernet0/1
  points: 3
- name: 'T4: RT04 が 10.2.19.0/24 と 10.2.27.0/24 のみ外部学習(デコイ遮断)'
  node: RT04
  command: show ip route eigrp
  raw:
  - regex: (?m)^D EX +10.2.19.0/24
  - regex: (?m)^D EX +10.2.27.0/24
  - not_contains: 172.30.100.0
  - not_contains: 10.1.15.0
  points: 6
- name: 'T4: 指定の seed metric が使用されている'
  node: RT01
  command: show running-config
  raw:
  - regex: (?:redistribute ospf 1 metric 100000 100 255 1 1500(?!\d)|default-metric 100000 100 255 1 1500(?!\d)|set metric 100000 100 255 1 1500(?!\d))
  points: 6
- name: 'T5: 追加要件 — 10.2.23.0/24 が EIGRP ドメインへ届いている'
  node: RT04
  command: show ip route 10.2.23.0
  raw:
  - contains: Known via "eigrp 100"
  - contains: distance 170
  points: 8
- name: 'T6: RT04 から 10.2.19.1 への source 指定 ping が成功'
  node: RT04
  command: ping 10.2.19.1 source 172.31.180.1 repeat 5
  raw:
  - regex: Success rate is (80|100) percent
  points: 6
- name: '監査: RT02 の構成が変更されていない'
  node: RT02
  command: show running-config | include distribute-list|offset-list|route-map|redistribute
  raw:
  - not_regex: (distribute-list|offset-list|route-map|redistribute)
  points: 2
- name: '監査: RT03 の構成が変更されていない'
  node: RT03
  command: show running-config | include distribute-list|offset-list|route-map|redistribute
  raw:
  - not_regex: (distribute-list|offset-list|route-map|redistribute)
  points: 2
- name: '監査: RT04 の構成が変更されていない'
  node: RT04
  command: show running-config | include distribute-list|offset-list|route-map|redistribute
  raw:
  - not_regex: (distribute-list|offset-list|route-map|redistribute)
  points: 2
- name: '監査: RT05 の構成が変更されていない'
  node: RT05
  command: show running-config | include distribute-list|offset-list|route-map|redistribute
  raw:
  - not_regex: (distribute-list|offset-list|route-map|redistribute)
  points: 2
