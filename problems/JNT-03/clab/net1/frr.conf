frr version 10.7.1
frr defaults traditional
hostname NET1
log stdout
service integrated-vtysh-config
!
! インターネットの端末(JNT-03・J2)。ISP(FRR1)の先にいる。ループバックの 4 つは送信元に使い分ける(probe -s・ping -I)
!   198.51.100.10= ふつうのホスト(8080 番で Web を待つ)・203.0.113.10= ISP の運用の網のホスト・
!   10.200.0.1 と 192.168.50.1= 私的アドレスをかたる送信元
interface eth1
 ip address 192.0.2.2/30
exit
!
interface lo
 ip address 198.51.100.10/32
 ip address 203.0.113.10/32
 ip address 10.200.0.1/32
 ip address 192.168.50.1/32
exit
!
ip route 0.0.0.0/0 192.0.2.1
!
