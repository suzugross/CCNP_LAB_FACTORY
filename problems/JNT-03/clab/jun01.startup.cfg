/* JNT-03 JUN01 の初めの設定= J1 を解き終えた状態(JNT-02 の初めの設定＋J1 の模範解)。フィルタは無い。
   vrnetlab の init.conf へ連結される。★形式は階層(カーリー)必須。mgmt と認証は init.conf 側が持つ。 */
interfaces {
    et-0/0/0 {
        description "to JUN02";
        unit 0 {
            family inet {
                address 10.0.12.1/30;
            }
        }
    }
    et-0/0/1 {
        description "server LAN (SRV1)";
        unit 0 {
            family inet {
                address 172.16.10.1/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.168.0.1/32;
            }
        }
    }
}
routing-options {
    router-id 192.168.0.1;
    autonomous-system 65000;
    static {
        route 172.16.20.0/24 next-hop 172.16.10.10;
        route 172.16.99.0/24 discard;
    }
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface et-0/0/0.0;
            interface lo0.0 {
                passive;
            }
        }
        export SERVERS-TO-OSPF;
    }
}
policy-options {
    policy-statement SERVERS-TO-OSPF {
        term LAN {
            from {
                protocol direct;
                route-filter 172.16.10.0/24 exact;
            }
            then accept;
        }
        term SRV {
            from {
                protocol static;
                route-filter 172.16.20.0/24 exact;
            }
            then {
                metric 20;
                accept;
            }
        }
    }
}
