/* JNT-03 JUN02 の初めの設定= J1 を解き終えた状態(JNT-02 の初めの設定＋J1 の模範解)。フィルタは無い。
   vrnetlab の init.conf へ連結される。★形式は階層(カーリー)必須。mgmt と認証は init.conf 側が持つ。 */
interfaces {
    et-0/0/0 {
        description "to JUN01";
        unit 0 {
            family inet {
                address 10.0.12.2/30;
            }
        }
    }
    et-0/0/1 {
        description "to ISP (FRR1)";
        unit 0 {
            family inet {
                address 10.0.23.1/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.168.0.2/32;
            }
        }
    }
}
routing-options {
    router-id 192.168.0.2;
    autonomous-system 65000;
    aggregate {
        route 172.16.0.0/16;
    }
}
protocols {
    bgp {
        group ISP {
            type external;
            import [ MARK ISP-IN ];
            export TO-ISP;
            peer-as 64500;
            neighbor 10.0.23.2;
        }
    }
    ospf {
        area 0.0.0.0 {
            interface et-0/0/0.0;
            interface lo0.0 {
                passive;
            }
        }
        export DEFAULT-TO-OSPF;
    }
}
policy-options {
    policy-statement DEFAULT-TO-OSPF {
        term DEF {
            from {
                protocol bgp;
                route-filter 0.0.0.0/0 exact;
            }
            then accept;
        }
    }
    policy-statement ISP-IN {
        term DEFAULT {
            from {
                route-filter 0.0.0.0/0 exact;
            }
            then accept;
        }
        term BOGONS {
            from {
                route-filter 10.0.0.0/8 orlonger;
                route-filter 172.16.0.0/12 orlonger;
                route-filter 192.168.0.0/16 orlonger;
                route-filter 100.64.0.0/10 orlonger;
                route-filter 198.18.0.0/15 orlonger;
            }
            then reject;
        }
        term PUBLIC {
            from {
                route-filter 0.0.0.0/0 prefix-length-range /8-/24;
            }
            then accept;
        }
        term REST {
            then reject;
        }
    }
    policy-statement MARK {
        term t {
            from {
                route-filter 203.0.113.0/24 exact;
            }
            then {
                local-preference 200;
                community add FROM-ISP;
            }
        }
    }
    policy-statement TO-ISP {
        term SUMMARY {
            from {
                protocol aggregate;
                route-filter 172.16.0.0/16 exact;
            }
            then {
                as-path-prepend "65000 65000";
                accept;
            }
        }
        term REST {
            then reject;
        }
    }
    community FROM-ISP members 65000:100;
}
