# JNT-03 の containerlab トポロジ(Junos トラック J2 firewall filter・BL-275)。
# jun01・jun02= vJunos-Evolved。初めの設定= J1 を解き終えた状態(JNT-02 の初めの設定＋J1 の模範解)。フィルタは無い。
# mgmt と admin は vrnetlab の init.conf(startup-config はそこへ連結される)。eth1 → et-0/0/0・eth2 → et-0/0/1。
# frr1= ISP 役(kind: frr・AS 64500)。srv1= サーバの網の役・net1= インターネットの端末の役(どちらも kind: frr・
# 静的経路だけ・ラベル ccnp-role: host でコンソールは bash)。
# probe.py= TCP の到達を 1 語で出す道具(/usr/local/bin/probe)。srv1(80・443)と net1(8080)は python の http.server で Web を待つ。
# labels の graph-posX / graph-posY= ワークスペースの結線図の座標。
name: ccnp-jnt03
topology:
  nodes:
    srv1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      mgmt-ipv4: 172.20.20.61
      startup-config: srv1/frr.conf
      binds: [ "probe.py:/usr/local/bin/probe:ro" ]
      exec:
        - sh -c 'mkdir -p /srv/www && echo SRV1 > /srv/www/index.html'
        - sh -c 'cd /srv/www && setsid nohup python3 -m http.server 80 >/dev/null 2>&1 &'
        - sh -c 'cd /srv/www && setsid nohup python3 -m http.server 443 >/dev/null 2>&1 &'
      labels: { graph-posX: "0", graph-posY: "0", ccnp-role: host }
    jun01:
      kind: juniper_vjunosevolved
      image: vrnetlab/juniper_vjunosevolved:26.2R1.7-EVO
      mgmt-ipv4: 172.20.20.62
      startup-config: jun01.startup.cfg
      labels: { graph-posX: "240", graph-posY: "0" }
    jun02:
      kind: juniper_vjunosevolved
      image: vrnetlab/juniper_vjunosevolved:26.2R1.7-EVO
      mgmt-ipv4: 172.20.20.63
      startup-config: jun02.startup.cfg
      labels: { graph-posX: "480", graph-posY: "0" }
    frr1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      mgmt-ipv4: 172.20.20.64
      startup-config: frr1/frr.conf
      daemons: [bgpd]
      binds: [ "probe.py:/usr/local/bin/probe:ro" ]
      labels: { graph-posX: "720", graph-posY: "0" }
    net1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      mgmt-ipv4: 172.20.20.65
      startup-config: net1/frr.conf
      binds: [ "probe.py:/usr/local/bin/probe:ro" ]
      exec:
        - sh -c 'mkdir -p /srv/www && echo NET1 > /srv/www/index.html'
        - sh -c 'cd /srv/www && setsid nohup python3 -m http.server 8080 >/dev/null 2>&1 &'
      labels: { graph-posX: "960", graph-posY: "0", ccnp-role: host }
  links:
    # ★MTU 1500(veth の既定 9500 だと OSPF が ExStart で止まる・CLAB-SOLO.design.md §7)
    - type: veth
      mtu: 1500
      endpoints:
        - { node: srv1, interface: eth1 }
        - { node: jun01, interface: eth2 }
    - type: veth
      mtu: 1500
      endpoints:
        - { node: jun01, interface: eth1 }
        - { node: jun02, interface: eth1 }
    - type: veth
      mtu: 1500
      endpoints:
        - { node: jun02, interface: eth2 }
        - { node: frr1, interface: eth1 }
    - type: veth
      mtu: 1500
      endpoints:
        - { node: frr1, interface: eth2 }
        - { node: net1, interface: eth1 }
