frr version 10.7.1
frr defaults traditional
hostname FRR1
log stdout
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.23.2/30
exit
!
interface eth2
 ip address 192.0.2.1/30
exit
!
interface lo
 ip address 203.0.113.1/32
exit
!
! ISP が客に送る経路(PoC 用の取り合わせ: 長さと私的アドレスの混ざり)
ip route 203.0.113.0/24 Null0
ip route 198.51.100.0/24 Null0
ip route 198.51.100.128/25 Null0
ip route 192.0.2.0/24 Null0
ip route 198.18.0.0/15 Null0
ip route 10.200.0.0/16 Null0
ip route 192.168.50.0/24 Null0
ip route 100.64.0.0/10 Null0
ip route 172.31.0.0/16 Null0
!
! インターネットの端末(NET1)の送信元。198.51.100.10= ふつうのホスト・203.0.113.10= ISP の運用の網・
! 10.200.0.1 と 192.168.50.1= 私的アドレスをかたる送信元(J2-4)
ip route 198.51.100.10/32 192.0.2.2
ip route 203.0.113.10/32 192.0.2.2
ip route 10.200.0.1/32 192.0.2.2
ip route 192.168.50.1/32 192.0.2.2
!
router bgp 64500
 bgp router-id 203.0.113.1
 no bgp ebgp-requires-policy
 neighbor 10.0.23.1 remote-as 65000
 address-family ipv4 unicast
  network 203.0.113.0/24
  network 198.51.100.0/24
  network 198.51.100.128/25
  network 192.0.2.0/24
  network 198.18.0.0/15
  network 10.200.0.0/16
  network 192.168.50.0/24
  network 100.64.0.0/10
  network 172.31.0.0/16
  neighbor 10.0.23.1 default-originate
 exit-address-family
exit
!
