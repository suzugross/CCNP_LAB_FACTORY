# M7-4: 主経路(XR01 Gi0/0/0/2 ─ SW01 ─ RT02)が「ポートは up のまま」死んでも 1 秒以内に予備へ= IS-IS に BFD(RT02 は 100 ms × 3 と isis bfd を据え付け)。
# 3 つ目の確認は、採点のあいだだけ CML のリンク条件で RT02-SW01 のパケットを全部捨て、RT01 の連続 ping の最長の欠落を数える
# (落ちた ping は 1 秒待つ= 欠落数 ≒ 秒)。PoC: BFD なし 22・BFD あり 1。経路が XR01 経由でなければ(M7-3 が未了)素通りになるので経路も見る。
problem: XRT-06
total_points: 100
checks:
  - name: 'M7-4 XR01: a BFD session with RT02 on the primary link is up'
    node: XR01
    command: 'show bfd session'
    raw:
      - { regex: 'Gi0/0/0/2\s+10\.0\.2\.12\s[^\n]*\sUP' }
    points: 25
  - name: 'M7-4 XR01: the IS-IS adjacency with RT02 uses BFD'
    node: XR01
    command: 'show isis adjacency'
    raw:
      - { regex: '(?:RT02|0100\.0000\.0012)\s+Gi0/0/0/2\s+\*PtoP\*\s+Up\s+\d+\s+\S+\s+\w+\s+Up' }
    points: 25
  - name: 'M7-4 RT01: a silent failure of the primary path costs at most about one second (fault injected for the check)'
    node: RT01
    exec: local
    command: >-
      .venv/bin/python topologies/login_probe.py XRT-06 ping-loss RT01 10.20.0.1 Loopback1
      --count 15000 --fail-link RT02:SW01 --fail-at 3 --post-settle 45
    raw:
      - { regex: '10\.0\.1\.1, from 10\.255\.0\.12[^\n]*via Port-channel1' }
      - { regex: '== FAULT DURING PING' }
      - { regex: '== LONGEST GAP [0-2]\n' }
    points: 50
