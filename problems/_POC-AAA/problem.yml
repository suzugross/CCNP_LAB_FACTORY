difficulty: 0
topology: generated
access: ssh
target_nodes: [RT01, RT02, SRV01, SRV02]
points: 0
image_family: iol
node_image_families:
  SRV01: ubuntu
  SRV02: ubuntu

lab:
  links:
    - { a: SRV01, a_if: 1, b: RT01, b_if: 0 }   # 10.99.1.0/30  RT01=.1 SRV01=.2
    - { a: SRV02, a_if: 1, b: RT01, b_if: 1 }   # 10.99.2.0/30  RT01=.1 SRV02=.2
    - { a: RT01,  a_if: 2, b: RT02, b_if: 0 }   # 10.1.12.0/30  RT01=.1 RT02=.2
