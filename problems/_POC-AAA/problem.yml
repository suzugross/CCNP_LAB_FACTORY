# BL-101 P0 PoC: IOS AAA(RADIUS) のエッジ挙動確定。
# 目的= 紙面 shape=aaa とラボ(GEN-AAAGRP / gen_aaa_ts) が共有する故障種 8 種の
#       実機症状(test aaa の文言・秒数・debug 行・ログイン挙動・サーバ側ログ)を全件実測する。
# 実測表の出力先= poc/aaa/README.md
#
# 盤面(AAA-BASE.design.md §1 の正準盤面):
#   SRV01(FreeRADIUS 標準ポート) ─ RT01 ─ RT02
#   SRV02(FreeRADIUS 非標準ポート) ┘
#   ★RT01=サーバ直結 / RT02=1ホップ先 → 送信元が拠点ごとに違う罠を盤面に内蔵。
#   ★サーバ側 clients は Loopback0 のみ許可 → source-interface を外すと無言破棄(timeout)。
id: _POC-AAA
