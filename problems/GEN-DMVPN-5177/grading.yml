# 自動生成 (gen_dmvpn_ts.py) seed=5177
# 修復判定 = ENARSI-DMVPN-IPSEC-01 実機確立の 13 チェック(値差し替え)。
# ping(sorted で show より先に実行) が直結誘発の発射を兼ねる。
problem: GEN-DMVPN-5177
total_points: 100
defaults:
  genie_os: iosxe
checks:
- name: 'RT01(Hub): 両スポークが登録され DMVPN セッションが UP'
  node: RT01
  command: show dmvpn
  raw:
  - contains: Type:Hub
  - regex: 10\.0\.24\.1\s+10\.255\.72\.2\s+UP\s+\S+\s+D(T[12])?(?!\w)
  - regex: 10\.0\.34\.1\s+10\.255\.72\.3\s+UP\s+\S+\s+D(T[12])?(?!\w)
  points: 10
- name: 'RT01(Hub): 両スポークとの IKEv2 SA が READY'
  node: RT01
  command: show crypto ikev2 sa
  raw:
  - regex: 10\.0\.24\.1/500\s+\S+\s+READY
  - regex: 10\.0\.34\.1/500\s+\S+\s+READY
  points: 10
- name: 'RT01(Hub): IKEv2 SA が AES-GCM-256 / PRF SHA384 / DH19 / PSK'
  node: RT01
  command: show crypto ikev2 sa
  raw:
  - regex: 'Encr: AES-GCM, keysize: 256'
  - regex: 'PRF: SHA384'
  - regex: DH Grp:19
  - regex: 'Auth sign: PSK'
  points: 10
- name: 'RT01(Hub): ESP が transport mode / esp-gcm で暗号化カウンタが加算'
  node: RT01
  command: show crypto ipsec sa
  raw:
  - regex: 'transform: esp-gcm'
  - regex: in use settings =\{Transport,
  - not_contains: ={Tunnel,
  - regex: '#pkts encaps: [1-9]'
  - regex: '#pkts decaps: [1-9]'
  points: 10
- name: 'RT02(Spoke1): 3.3.3.3/32 の next-hop がハブ(10.255.72.1)のまま'
  node: RT02
  command: show ip route
  parser: show ip route
  find: vrf.*.address_family.*.routes.*
  match:
    route: 3.3.3.3/32
    source_protocol: eigrp
    next_hop.next_hop_list.*.next_hop: 10.255.72.1
    next_hop.next_hop_list.*.outgoing_interface: Tunnel0
  points: 10
- name: 'RT03(Spoke2): 2.2.2.2/32 の next-hop がハブ(10.255.72.1)のまま'
  node: RT03
  command: show ip route
  parser: show ip route
  find: vrf.*.address_family.*.routes.*
  match:
    route: 2.2.2.2/32
    source_protocol: eigrp
    next_hop.next_hop_list.*.next_hop: 10.255.72.1
    next_hop.next_hop_list.*.outgoing_interface: Tunnel0
  points: 5
- name: 'RT02(Spoke1): スポーク間疎通 (能動・直結誘発)'
  node: RT02
  command: ping 3.3.3.3 source Loopback0 repeat 5
  raw:
  - regex: Success rate is [1-9]
  points: 5
- name: 'RT03(Spoke2): スポーク間疎通 (能動・直結誘発)'
  node: RT03
  command: ping 2.2.2.2 source Loopback0 repeat 5
  raw:
  - regex: Success rate is [1-9]
  points: 5
- name: 'RT02(Spoke1): スポーク2への動的(直結)トンネルが UP'
  node: RT02
  command: show dmvpn
  raw:
  - regex: 10\.0\.34\.1\s+10\.255\.72\.3\s+UP\s+\S+\s+D(T[12])?(?!\w)
  points: 10
- name: 'RT03(Spoke2): スポーク1への動的(直結)トンネルが UP'
  node: RT03
  command: show dmvpn
  raw:
  - regex: 10\.0\.24\.1\s+10\.255\.72\.2\s+UP\s+\S+\s+D(T[12])?(?!\w)
  points: 5
- name: 'RT02(Spoke1): スポーク間の IKEv2 SA が動的に確立 (直行暗号の証明1)'
  node: RT02
  command: show crypto ikev2 sa
  raw:
  - regex: 10\.0\.34\.1/500\s+\S+\s+READY
  points: 10
- name: 'RT02(Spoke1): スポーク間 IPsec SA で暗号化カウンタ加算 (直行暗号の証明2)'
  node: RT02
  command: show crypto ipsec sa peer 10.0.34.1
  raw:
  - regex: in use settings =\{Transport,
  - regex: '#pkts encaps: [1-9]'
  points: 5
- name: 'RT01: Tunnel0 が mGRE+key260+protection+MTU1400+MSS1360'
  node: RT01
  command: show running-config interface Tunnel0
  raw:
  - contains: ip mtu 1400
  - contains: ip tcp adjust-mss 1360
  - contains: tunnel mode gre multipoint
  - contains: tunnel key 260
  - regex: tunnel protection ipsec profile \S+
  - contains: ip nhrp authentication HONSHA72
  points: 5
