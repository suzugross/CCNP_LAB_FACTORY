# 自動生成 (gen_vrf_maze.py) seed=777
# 足跡採点=traceroute のホップ番号×中継IPで順路まで拘束。
problem: GEN-VRFMAZE-777
total_points: 100
defaults:
  genie_os: iosxe
checks:
- name: 'RT01: 部屋 ROOM-TEAL の収容(入口/出口サブIF)'
  node: RT01
  command: show vrf detail ROOM-TEAL
  raw:
  - regex: Et0/0\.690\b
  - regex: Lo11\b
  points: 8
- name: 'RT01: 部屋 ROOM-AMBER の収容(入口/出口サブIF)'
  node: RT01
  command: show vrf detail ROOM-AMBER
  raw:
  - regex: Et0/0\.377\b
  - regex: Et0/0\.445\b
  points: 8
- name: 'RT01: 部屋 ROOM-GREEN の収容(入口/出口サブIF)'
  node: RT01
  command: show vrf detail ROOM-GREEN
  raw:
  - regex: Et0/0\.651\b
  - regex: Lo99\b
  points: 8
- name: 'RT02: TURN1 の収容(廊下1/2)'
  node: RT02
  command: show vrf detail TURN1
  raw:
  - regex: Et0/0\.690\b
  - regex: Et0/0\.377\b
  points: 8
- name: 'RT02: TURN2 の収容(廊下3/4)'
  node: RT02
  command: show vrf detail TURN2
  raw:
  - regex: Et0/0\.445\b
  - regex: Et0/0\.651\b
  points: 8
- name: 'RT01: 温め(ARP解決・採点対象外)'
  node: RT01
  command: ping vrf ROOM-TEAL 172.30.173.1 source 172.30.235.1 repeat 3
  raw:
  - regex: Success rate
  points: 0
- name: 'RT01: START→GOAL 迷路走破 (172.30.235.1→172.30.173.1)'
  node: RT01
  command: ping vrf ROOM-TEAL 172.30.173.1 source 172.30.235.1 repeat 10
  raw:
  - regex: Success rate is (100|[89][0-9]) percent
  points: 20
- name: 'RT01: GOAL→START 帰路走破'
  node: RT01
  command: ping vrf ROOM-GREEN 172.30.235.1 source 172.30.173.1 repeat 10
  raw:
  - regex: Success rate is (100|[89][0-9]) percent
  points: 10
- name: 'RT01: traceroute 足跡が設計の順路と完全一致'
  node: RT01
  command: traceroute vrf ROOM-TEAL 172.30.173.1 source 172.30.235.1 numeric timeout
    1 probe 2
  raw:
  - regex: (?m)^\s*1\s+[* ]*10\.62\.1\.2\b
  - regex: (?m)^\s*2\s+[* ]*10\.62\.2\.1\b
  - regex: (?m)^\s*3\s+[* ]*10\.62\.3\.2\b
  - regex: (?m)^\s*4\s+[* ]*(172\.30\.173\.1|10\.62\.4\.1)\b
  points: 20
- name: 'RT01: ちょうど 4 歩で GOAL(近道・遠回りなし)'
  node: RT01
  command: traceroute vrf ROOM-TEAL 172.30.173.1 source 172.30.235.1 numeric timeout
    1 probe 2
  raw:
  - regex: (?m)^\s*4\s+[* ]*(172\.30\.173\.1|10\.62\.4\.1)\b
  - not_regex: (?m)^\s*5\s
  points: 10
