# BL-261 PoC: MPLS サービスのまとめ直し= 同じ盤面・同じ CE の組の上で L3VPN・VPWS(LDP/EVPN)・VPLS・EVPN の E-LAN を並べて組み、
#   ラベルの積み方と設定の骨組みを比べる。記録= problems/_drafts/XR-TRACK.design.md §26。手順= poc/xr/svc_poc.sh
# 盤面= P1(IOL・P ルータだけ= BGP なし)を中心にした星形のコア(IS-IS CORE L2・LDP)。RR(vpnv4 と l2vpn evpn)は RR1(IOL)で、
#   P1 の脇に 1 本でつなぐ(転送の道の外・LDP なし)。2026-11-04 に P1 兼 RR から分けた(BGP を持たないコアを見せるため)。
#   PE= XE1/XE2/XE3(Catalyst 8000V 17.15)と XR01(XRv9000 26.1.1)。CE1〜CE4(IOL)は VLAN でサービスを出し分ける(CE 側は据付)。
#   VLAN 100= L3VPN(CE1・CE2・CE4)/130= VPWS LDP(CE1⇔CE4)/140= VPWS EVPN(CE2⇔CE3)/200= EVPN E-LAN(CE1〜3)/210= VPLS(CE1〜3)
