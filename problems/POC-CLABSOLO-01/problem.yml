# containerlab だけで回す問題の PoC・雛形(BL-274 ①)。出題用ではなく、CML を使わない
# provision → grade → reset → teardown の実証用(problems/_drafts/CLAB-SOLO.design.md)。
# ★platform: clab = lab.sh が CML の build_topology・lab_up・MGMT リースを飛ばし、clab_ops.py だけで回す。
id: POC-CLABSOLO-01
title: "[PoC] containerlab 単独 OSPF (vJunos EVO ×2)"
exam: POC
topics: [junos, ospf, containerlab]
difficulty: 1
platform: clab
target_nodes: [JUN01]
points: 100
access: ssh

# 採点の接続先(トポロジの mgmt-ipv4 と一致させる。キーはトポロジのノード名と大文字小文字を無視して一致)
clab_nodes:
  JUN01: 172.20.20.2
  JUN02: 172.20.20.3
clab_topology: clab/ccnp-clabsolo.clab.yml

# === トポロジ =============================================
#   JUN01(白紙・受験者が設定) et-0/0/0 ── et-0/0/0 JUN02(据え付け)
#    lo0 192.168.0.1/32          10.0.12.0/30          lo0 192.168.0.2/32
#                             OSPF area 0
