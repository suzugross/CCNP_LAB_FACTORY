# POC-CLABSOLO-01 の containerlab トポロジ(CML を使わない・BL-274)。
# jun01 は startup-config を置かない = 白紙(mgmt と admin は vrnetlab の init.conf が持つ)。
# jun02 は据え付けの対向。eth1 → et-0/0/0(vrnetlab の対応は ethN → et-0/0/(N-1))。
# mgmt IP は problem.yml の clab_nodes と一致させるため固定。
name: ccnp-clabsolo
topology:
  nodes:
    jun01:
      kind: juniper_vjunosevolved
      image: vrnetlab/juniper_vjunosevolved:26.2R1.7-EVO
      mgmt-ipv4: 172.20.20.2
    jun02:
      kind: juniper_vjunosevolved
      image: vrnetlab/juniper_vjunosevolved:26.2R1.7-EVO
      mgmt-ipv4: 172.20.20.3
      startup-config: jun02.startup.cfg
  links:
    - endpoints: ["jun01:eth1", "jun02:eth1"]
