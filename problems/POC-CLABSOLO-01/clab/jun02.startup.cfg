/* POC-CLABSOLO-01 JUN02(据え付けの対向)の startup-config。vrnetlab の init.conf へ連結される。
   ★形式は階層(カーリー)必須。set 形式は make-config.sh が壊れる。mgmt と認証は init.conf 側が持つ。 */
interfaces {
    et-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.12.2/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.168.0.2/32;
            }
        }
    }
}
routing-options {
    router-id 192.168.0.2;
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface et-0/0/0.0;
            interface lo0.0 {
                passive;
            }
        }
    }
}
