# containerlab だけで回す Junos × FRRouting の PoC・雛形(BL-274 ②)。出題用ではない。
# FRR は kind: frr(containerlab 0.80 から。2026-11-14 に 0.83 へ上げて kind: linux から切り替え)。
# 採点は exec: frr(clab_ops.py exec = szk-cl01 の docker exec で vtysh・パスワード不要)、
# 解く時は scripts/lab.sh connect POC-CLABFRR-01 FRR1(または ssh admin@172.20.20.12・パスワード admin)。
# 詳細= problems/_drafts/CLAB-SOLO.design.md §7。
id: POC-CLABFRR-01
title: "[PoC] containerlab 単独 Junos × FRR OSPF"
exam: POC
topics: [junos, frr, ospf, containerlab, multivendor]
difficulty: 1
platform: clab
target_nodes: [JUN01]
points: 100
access: ssh

clab_nodes:
  JUN01: 172.20.20.11
  FRR1: 172.20.20.12
clab_topology: clab/ccnp-clabfrr.clab.yml

# === トポロジ =============================================
#   JUN01(白紙・受験者が設定) et-0/0/0 ── eth1 FRR1(据え付け)
#    lo0 192.168.0.1/32          10.0.13.0/30      lo 192.168.0.3/32
#                             OSPF area 0
