# M3-2: OSPFv3 で IPv6 のループバックを交換する(LINK1)。
problem: XRT-02
total_points: 100
checks:
  - name: "M3-2 XR01: 2001:DB8::2/128 is an OSPFv3 route"
    node: XR01
    command: "show route ipv6 2001:db8::2/128"
    # ★XR の IPv6 ルート表は OSPFv3 のルートも "ospf 1" と表示する(24.3.1 実測)
    raw: [ { regex: "Known via \"ospf 1\"" } ]
    points: 50
  - name: "M3-2 RT01: 2001:DB8::1/128 is an OSPF route"
    node: RT01
    command: "show ipv6 route 2001:DB8::1/128"
    raw: [ { regex: "Known via \"ospf 1\"" } ]
    points: 50
