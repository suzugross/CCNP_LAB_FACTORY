# POC-CLABHYB-01 の containerlab 側トポロジ(repo 管理・clab_ops.py がデプロイ)。
# JUN01 1台構成(RAM≈7.3GiB。旧 ospf ラボの evo2 は PoC 未使用のため落として半減)。
# eth1 → et-0/0/0 (vrnetlab の対応は ethN → et-0/0/(N-1))。
# mgmt IP は problem.yml の clab_nodes と一致させるため固定。
name: ccnp-clabhyb
topology:
  nodes:
    jun01:
      kind: juniper_vjunosevolved
      image: vrnetlab/juniper_vjunosevolved:26.2R1.7-EVO
      mgmt-ipv4: 172.20.20.2
      startup-config: jun01.startup.cfg
    br-cml:
      kind: bridge          # szk-cl01 上の既存ブリッジ(ens160=CML LAN-IX へのL2出口)
  links:
    - endpoints: ["jun01:eth1", "br-cml:eth1"]
