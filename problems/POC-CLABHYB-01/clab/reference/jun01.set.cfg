# JUN01 (clab-ospf-evo1 / 172.20.20.2) の参照 config スナップショット
# 採取: 2026-07-28 (PoC 100/100 時点・show configuration | display set)
# 用途: clab ラボを destroy した場合の復元用。PoC が依存するのは
#       et-0/0/1 (10.0.12.1/30) / lo0 (192.168.0.1/24) / OSPF area 0 の3点。
# 復元: ssh admin@172.20.20.2 → configure → load set terminal (貼り付け) → commit
set system host-name JUN01
set system services netconf ssh
set system services ssh root-login allow
set system time-zone Asia/Tokyo
set system management-instance
set system name-server 8.8.8.8
set system name-server 8.8.4.4
set interfaces et-0/0/1 unit 0 family inet address 10.0.12.1/30
set interfaces lo0 unit 0 family inet address 192.168.0.1/24
set interfaces re0:mgmt-0 unit 0 family inet address 10.0.0.15/24
set interfaces re0:mgmt-0 unit 0 family inet6 address 2001:db8::2/64
set policy-options policy-statement EXRT01 term T01 from protocol static
set policy-options policy-statement EXRT01 term T01 from route-filter 172.16.1.0/24 exact
set policy-options policy-statement EXRT01 term T01 from route-filter 172.16.0.0/24 exact
set policy-options policy-statement EXRT01 term T01 then accept
set routing-instances mgmt_junos routing-options rib mgmt_junos.inet6.0 static route ::/0 next-hop 2001:db8::1
set routing-instances mgmt_junos routing-options static route 0.0.0.0/0 next-hop 10.0.0.2
set routing-options static route 172.16.0.0/24 discard
set routing-options static route 172.16.1.0/24 discard
set protocols ospf area 0.0.0.0 interface et-0/0/1.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf export EXRT01
# 注: root/admin のパスワードハッシュ行は秘匿のため省略(現行ラボは admin/admin@123)。
