/* POC-CLABHYB-01 JUN01 startup-config (vrnetlab init.conf へ連結される)
   ★形式は階層(カーリー)必須。set 形式は make-config.sh が壊れる。
   mgmt/認証は init.conf 側が持つ(admin/admin@123)のでここではデータ面のみ。
   境界IF: 単一ノード構成では eth1=et-0/0/0 (旧2台構成の et-0/0/1 から移動)。 */
interfaces {
    et-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.12.1/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.168.0.1/24;
            }
        }
    }
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface et-0/0/0.0;
            interface lo0.0 {
                passive;
            }
        }
    }
}
