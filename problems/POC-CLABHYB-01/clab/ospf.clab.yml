# szk-cl01:~/labs/ospf.clab.yml のコピー (2026-07-28 時点・PoC が依存する clab 側トポロジ)
# デプロイ: szk-cl01 上で `containerlab deploy -t ~/labs/ospf.clab.yml` (sudo 不要)
# ※vJunos EVO は 1台 ≈ RAM 7.3GiB。ホスト 23GiB のため同時 2〜3 台が上限。
name: ospf
topology:
  nodes:
    evo1:
      kind: juniper_vjunosevolved
      image: vrnetlab/juniper_vjunosevolved:26.2R1.7-EVO
    evo2:
      kind: juniper_vjunosevolved
      image: vrnetlab/juniper_vjunosevolved:26.2R1.7-EVO
      startup-delay: 60
    br-cml:
      kind: bridge          # ホスト上の既存ブリッジ名と一致させる
  links:
    - endpoints: ["evo1:eth1", "evo2:eth1"]
    - endpoints: ["evo1:eth2", "br-cml:eth1"]   # ← CML への出口
