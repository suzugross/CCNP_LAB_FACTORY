- name: 'SW02: 各 SVI の受信方向に命名規約どおりの ACL を適用'
  node: SW02
  command: show ip interface | include line protocol|Inbound  access list
  raw:
  - regex: (?m)^Vlan130 is up[^\n]*\n\s*Inbound\s+access list is IN-MFG\s*$
  - regex: (?m)^Vlan220 is up[^\n]*\n\s*Inbound\s+access list is IN-SALES\s*$
  - regex: (?m)^Vlan210 is up[^\n]*\n\s*Inbound\s+access list is IN-GA\s*$
  - regex: (?m)^Vlan110 is up[^\n]*\n\s*Inbound\s+access list is IN-IT\s*$
  - regex: (?m)^Vlan120 is up[^\n]*\n\s*Inbound\s+access list is IN-GUEST\s*$
  - regex: (?m)^Vlan170 is up[^\n]*\n\s*Inbound\s+access list is IN-PRINT\s*$
  - regex: (?m)^Vlan100 is up[^\n]*\n\s*Inbound\s+access list is IN-SERVER\s*$
  - regex: (?m)^Vlan40 is up[^\n]*\n\s*Inbound\s+access list is IN-MGMT\s*$
  points: 1
- name: 'SW02: VLAN 間 ACL の許可/拒否が要件どおり (意味評価・8 本)'
  node: SW02
  command: show ip access-lists
  points: 2
  acl_vectors:
    acls:
    - acl: IN-MFG
      vectors: *id001
    - acl: IN-SALES
      vectors: *id002
    - acl: IN-GA
      vectors: *id003
    - acl: IN-IT
      vectors: *id004
    - acl: IN-GUEST
      vectors: *id005
    - acl: IN-PRINT
      vectors: *id006
    - acl: IN-SERVER
      vectors: *id007
    - acl: IN-MGMT
      vectors: *id008
