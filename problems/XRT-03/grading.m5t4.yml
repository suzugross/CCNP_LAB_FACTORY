# M5-4: 顧客の経路の受け入れ(割当の内側・顧客起点)、ISP への広告(合図の community に従う・65000:* は消す・65201:* は残す)、顧客への広告(タグつき)。
problem: XRT-03
total_points: 100
checks:
  - name: "M5-4 XR01: from the customer only 198.51.100.0/24 and 198.51.101.0/24"
    node: XR01
    command: "show bgp ipv4 unicast neighbors 10.0.13.2 routes"
    raw:
      - { regex: "198\\.51\\.100\\.0/24" }
      - { regex: "198\\.51\\.101\\.0/24" }
      - { not_regex: "198\\.51\\.100\\.128/25|13\\.1\\.1\\.0/24" }
    points: 25
  - name: "M5-4 RT01 (ISP-A): 198.51.101.0/24 without 65000 communities, and not 198.51.100.0/24"
    node: RT01
    command: "show ip bgp neighbors 10.0.11.1 routes | include 198|203"
    raw:
      - { regex: "198\\.51\\.101\\.0" }
      - { regex: "203\\.0\\.113\\.0" }
      - { not_regex: "198\\.51\\.100\\.0" }
    points: 15
  - name: "M5-4 RT02 (ISP-B): 198.51.100.0/24 with 65201:500 only, and not 198.51.101.0/24"
    node: RT02
    command: "show ip bgp 198.51.100.0/24"
    raw:
      - { regex: "65000 65201 65201 65201" }
      - { regex: "Community: 65201:500\\s*\\n" }
    points: 15
  - name: "M5-4 RT02 (ISP-B): does not receive 198.51.101.0/24"
    node: RT02
    command: "show ip bgp neighbors 10.0.12.1 routes | include 198|203"
    raw:
      - { regex: "198\\.51\\.100\\.0" }
      - { regex: "203\\.0\\.113\\.0" }
      - { not_regex: "198\\.51\\.101\\.0" }
    points: 10
  - name: "M5-4 RT01 (ISP-A): 198.51.101.0/24 arrives with no 65000 community"
    node: RT01
    command: "show ip bgp 198.51.101.0/24"
    raw:
      - { regex: "65000 65201" }
      - { not_regex: "65000:" }
    points: 10
  - name: "M5-4 RT03 (customer): receives the ISP routes with XR01's tags, and 203.0.113.0/24"
    node: RT03
    command: "show ip bgp 11.0.0.0/8"
    raw:
      - { regex: "65000 65101" }
      - { regex: "Community: [^\\n]*65000:101" }
    points: 15
  - name: "M5-4 RT03 (customer): receives 203.0.113.0/24 and 14.2.0.0/16"
    node: RT03
    command: "show ip bgp neighbors 10.0.13.1 routes | include 203|14\\.2"
    raw:
      - { regex: "203\\.0\\.113\\.0" }
      - { regex: "14\\.2\\.0\\.0" }
    points: 10
