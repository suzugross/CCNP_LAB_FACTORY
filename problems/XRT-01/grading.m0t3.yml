problem: XRT-01
total_points: 100
checks:
  - name: "XR01: Gi0/0/0/1 is up in VRF CUST-A with its address"
    node: XR01
    command: "show ipv4 vrf CUST-A interface brief"
    raw: [ { regex: "GigabitEthernet0/0/0/1\\s+10\\.0\\.13\\.1\\s+Up\\s+Up" } ]
    points: 35
  - name: "XR01: the customer link is no longer in the global table"
    node: XR01
    command: "show route 10.0.13.0/24"
    raw: [ { regex: "Network not in table" } ]
    points: 25
  - name: "XR01: customer LAN reachable inside the VRF"
    node: XR01
    command: "ping vrf CUST-A 172.16.2.1 count 3"
    raw: [ { regex: "Success rate is 100 percent" } ]
    points: 40
