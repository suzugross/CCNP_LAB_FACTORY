# 自動生成 (gen_dhcp_ts.py) seed=48769 faults=wall_missing tgt=A
# ★renew のみ発火(release は DORA リセット競合で偽 FAIL)・CL1 判定は最後尾。
#   負の要件は deny カウンタ。
problem: GEN-DHCPTS-48769
total_points: 100
defaults:
  genie_os: iosxe
checks:
- name: '(発火) CL1: renew dhcp'
  node: CL1
  command: renew dhcp Ethernet0/0
  raw:
  - regex: .*
  points: 0
- name: 'RT01: 3プールの network/GW/DNS が配布標準どおり'
  node: RT01
  command: show running-config | section ip dhcp pool
  raw:
  - regex: network 10\.223\.171\.0 255\.255\.255\.0
  - regex: network 10\.223\.172\.0 255\.255\.255\.0
  - regex: network 10\.223\.173\.0 255\.255\.255\.0
  - regex: default-router 10\.223\.171\.1
  - regex: default-router 10\.223\.172\.1
  - regex: default-router 10\.223\.173\.1
  - regex: dns-server 198\.51\.100\.220
  points: 10
- name: 'RT01: excluded-address (.1-.9) が3セグメントとも標準どおり'
  node: RT01
  command: show running-config | include ip dhcp excluded-address
  raw:
  - regex: excluded-address 10\.223\.171\.1 10\.223\.171\.9
  - regex: excluded-address 10\.223\.172\.1 10\.223\.172\.9
  - regex: excluded-address 10\.223\.173\.1 10\.223\.173\.9
  - not_regex: excluded-address \S+ \S+\.25[0-4]
  points: 10
- name: 'RT01: アドレス配布サービス基盤が有効'
  node: RT01
  command: show running-config | include service dhcp
  raw:
  - not_regex: no service dhcp
  points: 5
- name: 'RT02: Ethernet0/1 (segment A) のリレー設定が標準どおり'
  node: RT02
  command: show running-config interface Ethernet0/1
  raw:
  - regex: ip helper-address 10\.223\.174\.1
  - not_regex: helper-address (?:\d{1,3}\.){3}9\b
  points: 5
- name: 'RT02: Ethernet0/2 (segment B) のリレー設定が標準どおり'
  node: RT02
  command: show running-config interface Ethernet0/2
  raw:
  - regex: ip helper-address 10\.223\.174\.1
  - not_regex: helper-address (?:\d{1,3}\.){3}9\b
  points: 5
- name: 'RT02: リレー転送基盤(DHCPリレーエージェント)が有効'
  node: RT02
  command: show running-config | include service dhcp
  raw:
  - not_regex: no service dhcp
  points: 5
- name: 'RT02: ACL OPS-DHCP-ONLY が Ethernet0/1 の in に適用'
  node: RT02
  command: show ip interface Ethernet0/1
  raw:
  - regex: Inbound\s+access list is OPS-DHCP-ONLY
  points: 5
- name: 'RT02: ACL OPS-DHCP-ONLY が Ethernet0/2 の in に適用'
  node: RT02
  command: show ip interface Ethernet0/2
  raw:
  - regex: Inbound\s+access list is OPS-DHCP-ONLY
  points: 5
- name: 'RT02: ACL OPS-DHCP-ONLY が保全され(削除・置換なし)、DHCP/ICMP だけが追加で許可されている'
  node: RT02
  command: show ip access-lists OPS-DHCP-ONLY
  acl_vectors:
    acl: OPS-DHCP-ONLY
    vectors:
    - id: need_discover
      proto: udp
      src: 0.0.0.0
      sport: 68
      dst: 255.255.255.255
      dport: 67
      expect: permit
    - id: need_renew
      proto: udp
      src: 10.223.172.77
      sport: 68
      dst: 10.223.174.1
      dport: 67
      expect: permit
    - id: icmp
      proto: icmp
      src: 10.223.172.77
      dst: 10.223.174.1
      icmp_type: 8
      expect: permit
    - id: dns_ok
      proto: udp
      src: 10.223.172.77
      sport: 40001
      dst: 198.51.100.220
      dport: 53
      expect: permit
    - id: spoof
      proto: udp
      src: 0.0.0.1
      sport: 40002
      dst: 10.223.174.1
      dport: 53
      expect: deny
    - id: telnet
      proto: tcp
      src: 10.223.172.77
      sport: 40003
      dst: 10.223.174.1
      dport: 23
      expect: deny
    - id: dns_srv
      proto: udp
      src: 10.223.172.77
      sport: 40004
      dst: 10.223.174.1
      dport: 53
      expect: deny
    - id: smtp
      proto: tcp
      src: 10.223.172.77
      sport: 40005
      dst: 8.8.4.4
      dport: 25
      expect: deny
    - id: need_renew1
      proto: udp
      src: 10.223.173.77
      sport: 68
      dst: 10.223.174.1
      dport: 67
      expect: permit
    - id: blocklist
      proto: tcp
      src: 10.223.172.77
      sport: 40006
      dst: 213.54.226.141
      dport: 443
      expect: deny
    must_have:
    - deny ip 0.0.0.0 0.255.255.255 any
    - deny ip 127.0.0.0 0.255.255.255 any
    - deny ip any host 213.54.226.141
    - deny ip any host 185.32.88.241
    - deny tcp any any eq 23
    - deny tcp any any eq 25
    - permit udp 10.223.173.0 0.0.0.255 host 198.51.100.220 eq domain
    - deny ip any any log
    min_entries: 46
    max_entries: 48
  points: 10
- name: '効果: CL3 が LOCAL プールから取得 (excluded 回避)'
  node: CL3
  command: show ip interface Ethernet0/0 | include Internet
  raw:
  - regex: Internet address is 10\.223\.171\.\d+/24
  - not_regex: Internet address is 10\.223\.171\.[1-9]/
  points: 5
- name: '効果: CL2 が segment B から取得 (excluded 回避)'
  node: CL2
  command: show ip interface Ethernet0/0 | include Internet
  raw:
  - regex: Internet address is 10\.223\.173\.\d+/24
  - not_regex: Internet address is 10\.223\.173\.[1-9]/
  points: 10
- name: '効果: ACL 越し ICMP + 配布 GW でセグメント間疎通 (CL2→10.223.171.1)'
  node: CL2
  command: ping 10.223.171.1 repeat 5
  raw:
  - regex: Success rate is [1-9]
  points: 5
- name: (発火) CL2→サーバへの非許可通信の試行 (telnet)
  node: CL2
  command: telnet 10.223.174.1
  raw:
  - regex: .*
  points: 0
- name: '効果: 非許可通信は遮断 (OPS-DHCP-ONLY の明示 deny がヒット)'
  node: RT02
  command: show access-lists OPS-DHCP-ONLY
  raw:
  - regex: deny (?:tcp any any eq telnet|ip any any log) \([1-9][0-9]* match
  points: 5
- name: '★効果: CL1 が renew 後に segment A から(再)取得'
  node: CL1
  command: show ip interface Ethernet0/0 | include Internet
  raw:
  - regex: Internet address is 10\.223\.172\.\d+/24
  - not_regex: Internet address is 10\.223\.172\.[1-9]/
  points: 15
