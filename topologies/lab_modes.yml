# ラボ単元ローテーションのモード定義(BL-223・設計= problems/_drafts/LAB-ROTATION.design.md)
#
# gen_pack.py は `--lab-genres` も `--profile` も無いとき、`--lab-mode`(既定 default)をここから引く。
#   units.<名前>.genres   = gen_pack.LAB_GENRES のキー(単元の中で TS/構築・変種を回す)
#   units.<名前>.per_week = 目標の週あたり回数(遅れ度 = 経過日数 ÷ (7 / per_week))
#   units.<名前>.also     = genres の接頭辞以外に「この単元をやった」と数える問題 ID の正規表現
#   week                  = 曜日(mon〜sun)ごとの単元。無いモードは遅れ度順だけで埋める
#   catchup_ratio / max_catchup = 遅れ度がこれ以上の単元を、曜日表の外から最大この枠数まで差し込む
#   discovery             = 発掘枠(BL-233・2026-10-06)。slots のうち discovery.slots 本を、上の units が
#                           引けない資産(LAB_GENRES に無い生成器・静的問題)から「最後に出した日が古い順」で選ぶ。
#     kinds    = 種別の並び。日替わりで交互(生成器= 新 seed で何度でも / 静的= 1 問 1 回なので分けて回す)
#     min_diff = これ未満の難易度は出さない
#     hold     = まだ出さないもの(ID または生成器の接頭辞: 理由)。手当てが済んだら行を消す
#     args     = 生成器に足す引数(接頭辞: [引数…])。[[…], […]] と組を並べると 1 組を抽選する
#   ★PVT 系の ID に触れる設定は private/lab_modes.yml に書く(同じ構造・後勝ちで合流)
#   現況の確認= `python3 topologies/lab_rotation.py [--all]`(単元の遅れ度と発掘枠の待ち行列)
modes:
  default:
    label: デフォルト(全単元・曜日ローテーション＋発掘枠)
    slots: 3                 # 1 日のラボ本数(単元 2 ＋ 発掘 1)
    catchup_ratio: 2.0
    max_catchup: 1           # 単元 2 枠のうち曜日表から最低 1 枠は必ず出す
    discovery:
      slots: 1
      kinds: [generator, static]
      min_diff: 3
      hold:
        GEN-ENT: 20 ノード。夜間バッチでの構築・採点前フックを 1 回通してから
        GEN-S2SVPN: 専用 CLI 運用(パックの構築・採点が lab.sh 前提)
      args:                  # 過去の出題で使ってきた多重故障の指定(単発だと数分で終わる)
        GEN-FNFTS: ["--faults", "2"]
        GEN-EGVRF: ["--faults", "2"]
        GEN-OSPFX: ["--faults", "3", "--decoys", "1"]
        # 実機で通した故障だけに絞る(残り= wrong_tag_filter は症状文が実態と合わない・half_fix/missing_seed_metric/missing_r2o は未確認)
        GEN-REDISTRO: [["--fault", "seed_loop"], ["--fault", "stale_filter"], ["--fault", "fb_suboptimal"]]
        GEN-DOJO-PREFIX: ["--dojo", "prefix"]
        GEN-DOJO-ASPATH: ["--dojo", "aspath"]
        GEN-DOJO-ACL: ["--dojo", "acl"]
    units:
      bgp:
        label: BGP
        per_week: 1
        genres: [bgp]
        also: ['^GEN-BGP', '^ENARSI-BGP-']
      stp:
        label: STP/L2
        per_week: 2
        genres: [stpts, stpmst, stp3ts, stpbuild, stpmstbuild, stp3build, l2]
        also: ['^GEN-STP', '^GEN-L2TS', '^ENCOR-LAG', '^ENCOR-STP']
      security:
        label: Security
        per_week: 2
        genres: [urpf, aaa]
        also: ['^GEN-URPF', '^GEN-AAA', '^ENARSI-AAA', '^ENARSI-URPF']
      redist:
        label: 再配送
        per_week: 1
        genres: [redist, redistmp]
        also: ['^GEN-(RDFIELD|RDARENA|REDIST)', '^ENARSI-REDIST']
      rtvrf:
        label: 経路制御/VRF
        per_week: 2
        genres: [rtctl, hvrf]
        also: ['^GEN-(RTCTL|EGVRF|DOJO-DLIST)', '^ENARSI-(EIGRP-VRF|VRFLITE)', '^ENCOR-PBR']
      vpn:
        label: VPN
        per_week: 1
        genres: [dmvpn, vpnbuild]
        also: ['^GEN-DMVPN', '^DMVPN-', '^ENARSI-(DMVPN|IPSEC|GREIPSEC)']
      mpls:
        label: MPLS
        per_week: 2
        genres: [mpls, mplsbuild]
        also: ['^GEN-MPLS', '^ENARSI-MPLS']
      ipv6:
        label: IPv6
        per_week: 2
        genres: [v6addr, v6build]
        also: ['^GEN-V6', '^ENARSI-DHCPV6']
      services:
        label: Services
        per_week: 1
        genres: [dhcp, ipsla]
        also: ['^GEN-(DHCPTS|IPSLATS)', '^ENCOR-(DHCP|IPSLA)']
    # 紙面(BL-224・paper_rotation.py): units: all = units.yml で紙面 kind を持つ全単元(資格で絞らない)。
    #   思考・瞬発・穴埋めの 3 枠とも、最終実施日(採点記録)が古い単元から 1 問ずつ割り当てる。
    #   将来のモードは units: [U-…] で範囲を絞る / exclude: [U-…] で外す。
    paper:
      units: all
      exclude: []
    # 単元は 1 日 2 枠 × 7 日 = 14 枠 = per_week の合計(2026-10-06 に 3 枠 21 から縮小。3 枠目は発掘枠)。
    # 削った 7 枠= 所要 3〜5 分で飽和した Services・VPN(DMVPN TS)を各 -1、発掘枠が同じ題材を週 1〜2 本
    # 供給する BGP を -2、再配送(同 週 0.6 本)・STP・Security を各 -1。
    # 週 2 回の単元は間隔 3〜4 日、週 1 回の単元は 7 日。同じ単元が 2 日続かない(日→月も含む)。
    week:
      mon: [stp, security]
      tue: [ipv6, mpls]
      wed: [rtvrf, bgp]
      thu: [stp, services]
      fri: [security, mpls]
      sat: [ipv6, redist]
      sun: [rtvrf, vpn]
