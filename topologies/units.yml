# ============================================================
# 単元タグ表(BL-213・2026-09-21)。CURRICULUM.md の単元(U-番号)と、
# 紙面 shape/kind・ラボ生成器/固定問題の対応。gen_pack --profile が読む。
#
#   paper.kinds : gen_paper_mcq の `shape/kind` グロブ(`*` 可)。`shape/*` で shape 全体。
#   lab.genres  : gen_pack.LAB_GENRES のキー(固定ジャンル枠)。
#   lab.ids     : TS プール(--lab-extra)に許す 静的ID または GEN 接頭辞(前方一致)。
#   blueprint   : 該当する資格(ccna/encor/enarsi/ccie)。profile ccna 等はここから導く。
#
# ★新しい shape / cloze topic / 生成器を作ったら、該当単元の行に足す(CATALOG 追記と同時)。
# ★グロブは生成器の kind 名で書く(サブケース名は不可)。svc/light は 1 kind に IP SLA 予約・NetFlow 適用・DHCP relay の
#   3 サブケースを持つので、U-I3/U-I7/U-I8 は svc/light を共有する(BL-224 で発見・サブケース名だと --only-kinds が空振り)。
# ★PVT 系の接頭辞は private/units.yml に書く(後勝ちで合流)。
# ============================================================

profiles:
  # 資格プロファイル= blueprint に当該キーを持つ単元の和。
  ccna:   {blueprint: ccna}
  encor:  {blueprint: encor}
  enarsi: {blueprint: enarsi}
  ccie:   {blueprint: ccie}
  # 別ベンダ= 非 Cisco ラボ(Junos/FortiGate/Linux)を許可し、紙面は出さない。
  vendor: {units: [U-X1], lab_flags: [allow_non_cisco, any_lab, allow_special]}

