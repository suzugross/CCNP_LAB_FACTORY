- note: M5' spt-threshold infinity をやり直し(受信者が参加し直してから送信)
- node: RT04
  conf:
  - ip pim spt-threshold infinity
- node: RT08
  conf:
  - ip pim spt-threshold infinity
- node: RT06
  conf:
  - interface Ethernet0/0
  - ip igmp join-group 239.5.5.5
  wait: 8
- node: RT01
  show:
  - ping 239.5.5.5 repeat 5 source Ethernet0/0
- node: RT08
  show:
  - show ip mroute 239.5.5.5 | include \(|flags|Incoming|Ethernet|Null
- node: RT04
  show:
  - show ip mroute 239.5.5.5 | include \(|flags|Incoming|Ethernet|Null
- node: RT03
  show:
