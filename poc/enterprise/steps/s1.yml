# 段2 s1(P5 基本): ioll2 の ip routing・SVI・HSRPv2・DHCP リレー・OSPF・STP root／RT01 の DHCP プール(リース 2 分= T5 用)
- note: 'S1a L3SW'
- node: SW01
  show: ['show version | include IOS|Software']
  conf:
    - ip routing
    - spanning-tree vlan 10,100,900 priority 24576
    - spanning-tree vlan 20 priority 28672
    - interface Vlan10
    - ip address 10.20.10.2 255.255.255.0
    - standby version 2
    - standby 10 ip 10.20.10.1
    - standby 10 priority 110
    - standby 10 preempt
    - ip helper-address 10.20.100.30
    - no shutdown
    - interface Vlan20
    - ip address 10.20.20.2 255.255.255.0
    - standby version 2
    - standby 20 ip 10.20.20.1
    - standby 20 preempt
    - ip helper-address 10.20.100.30
    - no shutdown
    - interface Vlan100
    - ip address 10.20.100.2 255.255.255.0
    - standby version 2
    - standby 100 ip 10.20.100.1
    - standby 100 priority 110
    - standby 100 preempt
    - no shutdown
    - interface Vlan900
    - ip address 10.20.255.3 255.255.255.248
    - no shutdown
    - router ospf 1
    - router-id 10.20.255.3
    - passive-interface default
    - no passive-interface Vlan900
    - network 10.20.0.0 0.0.255.255 area 0
- node: SW02
  conf:
    - ip routing
    - spanning-tree vlan 10,100,900 priority 28672
    - spanning-tree vlan 20 priority 24576
    - interface Vlan10
    - ip address 10.20.10.3 255.255.255.0
    - standby version 2
    - standby 10 ip 10.20.10.1
    - standby 10 preempt
    - ip helper-address 10.20.100.30
    - no shutdown
    - interface Vlan20
    - ip address 10.20.20.3 255.255.255.0
    - standby version 2
    - standby 20 ip 10.20.20.1
    - standby 20 priority 110
    - standby 20 preempt
    - ip helper-address 10.20.100.30
    - no shutdown
    - interface Vlan100
    - ip address 10.20.100.3 255.255.255.0
    - standby version 2
    - standby 100 ip 10.20.100.1
    - standby 100 preempt
    - no shutdown
    - interface Vlan900
    - ip address 10.20.255.4 255.255.255.248
    - no shutdown
    - router ospf 1
    - router-id 10.20.255.4
    - passive-interface default
    - no passive-interface Vlan900
    - network 10.20.0.0 0.0.255.255 area 0
- node: RT01
  conf:
    - ip dhcp excluded-address 10.20.10.1 10.20.10.3
    - ip dhcp excluded-address 10.20.20.1 10.20.20.3
    - ip dhcp pool SALES
    - network 10.20.10.0 255.255.255.0
    - default-router 10.20.10.1
    - dns-server 192.0.2.10
    - lease 0 0 2
    - ip dhcp pool DEV
    - network 10.20.20.0 255.255.255.0
    - default-router 10.20.20.1
    - dns-server 192.0.2.10
    - lease 0 0 2
- sleep: 45
- node: SW01
  show: ['show standby brief', 'show ip ospf neighbor', 'show ip route | begin Gateway', 'show spanning-tree vlan 10 | include Root ID|This bridge|^Et', 'show spanning-tree vlan 20 | include Root ID|This bridge|^Et']
- node: SW02
  show: ['show standby brief']
- node: SW03
  show: ['show spanning-tree summary | include Root bridge|mode', 'show spanning-tree vlan 10 | include ^Et', 'show spanning-tree vlan 20 | include ^Et']
- node: PC01
  sh: ['networkctl renew ens3; sleep 8; ip -4 -br addr show ens3; networkctl status ens3 --no-pager 2>/dev/null | grep -E "DHCP4|Address|Gateway|DNS|Client ID" | head -8']
- node: PC02
  sh: ['networkctl renew ens3; sleep 8; ip -4 -br addr show ens3; networkctl status ens3 --no-pager 2>/dev/null | grep -E "DHCP4|Address|Gateway|DNS|Client ID" | head -8']
- node: RT01
  show: ['show ip dhcp binding', 'show ip dhcp server statistics | include DISCOVER|OFFER|REQUEST|ACK|NAK']
- node: PC01
  sh: ['ping -c2 -W2 10.20.20.1 | tail -1; ping -c2 -W2 192.0.2.10 | tail -1; curl -s -m5 http://192.0.2.10/ip; dig +short +time=2 +tries=1 @192.0.2.10 www.inet.example']
