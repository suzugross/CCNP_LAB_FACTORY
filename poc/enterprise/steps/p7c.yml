- node: PC02
  sh: ['networkctl down ens3; ip -4 -br addr show ens3']
- node: RT01
  show: ['clear ip dhcp binding 10.20.20.5']
- node: RT01
  conf:
    - ip dhcp pool PRN01
    - client-identifier 0152.5400.aa00.02
- node: PC02
  sh: ['networkctl up ens3; sleep 15; ip -4 -br addr show ens3; grep -E "ADDRESS|ROUTER" /run/systemd/netif/leases/*']
- node: RT01
  show: ['show ip dhcp binding', 'show running-config | section pool PRN01']
