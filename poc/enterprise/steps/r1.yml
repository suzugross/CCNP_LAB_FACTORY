# ioll2 の no ip routing（day0）: 管理の生存・default-gateway・L3SW の ip routing の要否
- note: 'R1a day0 直後: 管理 telnet で入れること自体が「VLAN 999 の管理が生きている」確認'
- node: SW01
  show: ['show running-config | include ip routing', 'show ip route | include Gateway|Default|routing|999', 'show ip interface brief | include Vlan']
- node: SW02
  show: ['show running-config | include ip routing|default-gateway', 'show ip route', 'show ip interface brief | include Vlan']
- note: 'R1b SW01 はルーティング無効のまま → SW02 から VLAN 110 の端末へ'
- node: SW02
  show: ['ping 10.9.40.1', 'ping 10.9.110.1', 'ping 10.9.110.10']
- note: 'R1c SW01 で ip routing を有効化 → 同じ ping'
- node: SW01
  conf: ['ip routing']
  wait: 5
  show: ['show ip route | begin Gateway']
- node: SW02
  show: ['ping 10.9.110.10', 'ping 10.1.10.6']
- node: RT01
  show: ['ping 10.9.40.11']
