# 段2 s4(P6・ハード H4): RT02 の外側(Et0/1)で戻り通信のステートフル化。reflexive ACL と ZBF(self zone 有無)
- note: 'S4a 基準(フィルタなし): 外部 SRV01 から RT02 へ 22/80・ping、社内 VIP へ ping'
- node: SRV01
  sh: ['for p in 22 80; do nc -z -w3 192.0.2.1 $p && echo "RT02 $p OPEN" || echo "RT02 $p closed"; done; ping -c2 -W2 192.0.2.1 | tail -1; ping -c2 -W2 10.20.10.1 | tail -1']
- note: 'S4b reflexive ACL'
- node: RT02
  conf:
    - ip access-list extended R-OUT
    - permit tcp any any reflect MIRROR
    - permit udp any any reflect MIRROR
    - permit icmp any any reflect MIRROR
    - ip access-list extended R-IN
    - evaluate MIRROR
    - deny ip any any log
    - interface Ethernet0/1
    - ip access-group R-OUT out
    - ip access-group R-IN in
- node: PC01
  sh: ['curl -s -m5 http://192.0.2.10/ip; dig +short +time=2 +tries=1 @192.0.2.10 www.inet.example || echo DIG_FAIL; ping -c2 -W2 192.0.2.10 | tail -1']
- node: SRV01
  sh: ['for p in 22 80; do nc -z -w3 192.0.2.1 $p && echo "RT02 $p OPEN" || echo "RT02 $p closed"; done; ping -c2 -W2 192.0.2.1 | tail -1; ping -c2 -W2 10.20.10.1 | tail -1']
- node: RT02
  show: ['show access-lists']
  conf: ['interface Ethernet0/1', 'no ip access-group R-OUT out', 'no ip access-group R-IN in']
- note: 'S4c ZBF(INSIDE=Et0/0・OUTSIDE=Et0/1・self のポリシーなし)'
- node: RT02
  conf:
    - zone security INSIDE
    - zone security OUTSIDE
    - class-map type inspect match-any C-ALL
    - match protocol tcp
    - match protocol udp
    - match protocol icmp
    - policy-map type inspect P-IN2OUT
    - class type inspect C-ALL
    - inspect
    - zone-pair security ZP-IN2OUT source INSIDE destination OUTSIDE
    - service-policy type inspect P-IN2OUT
    - interface Ethernet0/0
    - zone-member security INSIDE
    - interface Ethernet0/1
    - zone-member security OUTSIDE
- sleep: 10
- node: PC01
  sh: ['curl -s -m5 http://192.0.2.10/ip; dig +short +time=2 +tries=1 @192.0.2.10 www.inet.example || echo DIG_FAIL; ping -c2 -W2 192.0.2.10 | tail -1']
- node: SRV01
  sh: ['for p in 22 80; do nc -z -w3 192.0.2.1 $p && echo "RT02 $p OPEN" || echo "RT02 $p closed"; done; ping -c2 -W2 192.0.2.1 | tail -1; ping -c2 -W2 10.20.10.1 | tail -1']
- node: RT02
  show: ['show ip ospf neighbor', 'show policy-map type inspect zone-pair ZP-IN2OUT sessions | include Session|Established|Class-map']
- note: 'S4d self zone(OUTSIDE→self は全 drop)'
- node: RT02
  conf:
    - policy-map type inspect P-OUT2SELF
    - class class-default
    - drop log
    - zone-pair security ZP-OUT2SELF source OUTSIDE destination self
    - service-policy type inspect P-OUT2SELF
- sleep: 5
- node: SRV01
  sh: ['for p in 22 80; do nc -z -w3 192.0.2.1 $p && echo "RT02 $p OPEN" || echo "RT02 $p closed"; done; ping -c2 -W2 192.0.2.1 | tail -1; ping -c2 -W2 10.20.10.1 | tail -1']
- node: PC01
  sh: ['curl -s -m5 http://192.0.2.10/ip; dig +short +time=2 +tries=1 @192.0.2.10 www.inet.example || echo DIG_FAIL; ping -c2 -W2 192.0.2.10 | tail -1']
- node: RT02
  show: ['show ip ospf neighbor', 'show ntp associations']
