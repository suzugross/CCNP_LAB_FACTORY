lab:
  title: POC-RTCTL
  description: 'PoC BL-141 (console-only / MGMT lease not used)'
  notes: |
    PoC lab (Claude 2026-08-23): BL-141 純粋経路制御ラボ問(RTCTL-DOJO.design.md §9)
    - EIGRP AS100: RT04(経路源) -- RT02/RT03(並列フィード) -- RT01(主戦場)
      RT04-RT02: 10.0.24.0/24 / RT04-RT03: 10.0.34.0/24
      RT02-RT01: 10.0.12.0/24 / RT03-RT01: 10.0.13.0/24
    - OSPF 1 Area0: RT01 -- RT05 (10.0.15.0/24)
    - battery(RT04 Lo): 172.16.0-3.0/24(連続4) / 10.10.1|5|9.0/24(飛び地3) /
      192.168.20|40.0/24(除外題材2)
    - battery(RT05 Lo): 10.50.1-3.0/24 / 172.31.100.0/24 (全て ospf network p2p で /24 広告)
    - 再配送・各種リストは未投入(基線=解答者開始状態)。PoC はここへ手動投入して検証
    - コンソール収集のみ (MGMT VRF/リース不使用)
  version: 0.3.0
nodes:
- id: RT01
  label: RT01
  node_definition: iol-xe
  image_definition: iol-xe-17-15-01
  configuration: |
    hostname RT01
    !
    ip domain name ccnp.local
    no ip domain lookup
    ip cef
    no ip http server
    no ip http secure-server
    !
    enable secret CCNP
    username SUZUKI privilege 15 secret CCNP
    !
    interface Ethernet0/0
     description === to RT02 (EIGRP) ===
     ip address 10.0.12.1 255.255.255.0
     no shutdown
    !
    interface Ethernet0/1
     description === to RT03 (EIGRP) ===
     ip address 10.0.13.1 255.255.255.0
     no shutdown
    !
    interface Ethernet0/2
     description === to RT05 (OSPF) ===
     ip address 10.0.15.1 255.255.255.0
     no shutdown
    !
    router eigrp 100
     network 10.0.12.0 0.0.0.255
     network 10.0.13.0 0.0.0.255
     no auto-summary
    !
    router ospf 1
     router-id 1.1.1.1
     network 10.0.15.0 0.0.0.255 area 0
    !
    line con 0
     exec-timeout 0 0
     logging synchronous
  x: 0
  y: 100
  tags: [routers]
  interfaces:
  - id: RT01-i0
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: RT01-i1
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: RT01-i2
    label: Ethernet0/2
    type: physical
    slot: 2
- id: RT02
  label: RT02
