- note: M0 起動直後(全台 rapid 白紙)
- node: SW01
  show: ["show version | include uptime", "show spanning-tree summary | include mode"]
- note: M1 稼働中に SW01〜03 を MST 化(SW04 は rapid-pvst のまま= 境界)・全台 long
- node: SW04
