- node: SW01
  conf: ["spanning-tree mst configuration", "name CAMPUS", "revision 3", "instance 1 vlan 174,233", "instance 2 vlan 218", "exit", "spanning-tree mst 0-1 priority 24576", "spanning-tree mst 2 priority 28672", "spanning-tree mode mst"]
