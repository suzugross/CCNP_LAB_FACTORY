# 制御ホストの Ansible コレクション(BL-265)。pip の ansible パッケージに入っていない 3 つだけを書く。
# 旧制御ホストでは ~/.ansible/collections に入っていた版。開発コンテナでは /usr/share/ansible/collections に入れる
# (既定の検索先で、pip の ansible に同梱の版より先に見つかる。今の ~/.ansible と同じ優先順になる)。
collections:
  - name: cisco.cml
    version: "1.2.0"
  - name: juniper.device
    version: "2.0.2"
  - name: junipernetworks.junos
    version: "11.1.1"
