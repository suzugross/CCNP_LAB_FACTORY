<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Route Path Builder</title>
<!--
  ルーティング経路づくり(BL-271)の画面。配信は pack_server.py の /_route_path/、データは /_api/route_path/*(topologies/route_path.py)。
  設定を変えるたびに eval を呼び、経路の計算はサーバ(route_model)だけで行う。進み具合はクリアだけをサーバへ記録する。
  試験用の URL 引数: ?autotest=N(各 level を N 通りの seed で解き、配置も検査)・?uitest=1(タップの流れ)・
  ?demo=1|solved|sent|form|formerr|formrng|exsend|router|ifd|rules(記録しない・鍵を無視。#p<ステージ>-<レベル> と組み合わせる。&card=N でチュートリアルの N 枚目)・?lang=ja
  設計= problems/_drafts/ROUTE-PATH.design.md(盤面の描き方は §3)。
-->
<style>
:root{
  --paper:#eceef1; --card:#fff; --ink:#15171a; --sub:#5f6670; --line:#d6d9de; --link:#0645ad;
  --pri:#1f63c6; --ok:#2a7d3a; --ng:#c62828; --star:#e0a400; --ov:#a15c00; --hit:#fff7e0; --win:#ffe3a8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
body{font-family:"Segoe UI","Yu Gothic UI",Meiryo,"Hiragino Kaku Gothic ProN","Noto Sans CJK JP",system-ui,sans-serif;
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace}
code{font-size:.88em;background:#f1f3f5;border-radius:3px;padding:0 .25em}
header.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;padding:.55rem 16px;
  background:var(--card);border-bottom:1px solid var(--line)}
header.bar .ttl{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.bar button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:.2rem .6rem;font-size:.85rem}
header.bar button[hidden]{display:none}
main{max-width:560px;margin:0 auto;padding:12px 16px 120px}
body.formopen .actbar{background:#fff;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.view[hidden]{display:none}

/* ホーム */
.intro{color:var(--sub);font-size:.9rem;margin:.2rem 0 1rem}
.edh{margin:1.1rem 0 .4rem}
.edh b{font-size:1rem}
.edh div{color:var(--sub);font-size:.82rem}
.stage{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:.75rem .9rem;margin:0 0 .6rem}
.stage .top{display:flex;align-items:baseline;gap:.5rem}
.stage .no{font-weight:700;color:var(--sub);min-width:1.4em}
.stage .nm{font-weight:600;flex:1}
.stage .st{color:var(--star);font-size:.85rem;white-space:nowrap}
.stage .sb{color:var(--sub);font-size:.85rem;margin:.15rem 0 .35rem 1.9em}
.stage .lv{margin-left:1.9em;display:flex;gap:.3rem;align-items:center}
.stage .lv i{width:.7rem;height:.7rem;border-radius:50%;border:1.5px solid #b9bec5;display:inline-block}
.stage .lv i.c{background:var(--ok);border-color:var(--ok)}
.stage .lv i.r{background:#b9bec5;border-color:#b9bec5}
.stage .lv .rs{margin-left:auto;font-size:.78rem;color:var(--sub);border:0;background:none;padding:0;text-decoration:underline}
.stage.locked{opacity:.55}
.stage.locked .nm::after{content:" \1F512";font-size:.8em}
.resetall{margin-top:1.4rem;font-size:.85rem;color:var(--sub)}
.resetall button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:.25rem .7rem;font-size:.85rem}

/* チュートリアル */
.tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1rem .6rem}
.tcard .kick{font-size:.8rem;color:var(--sub)}
.tcard h2{font-size:1.15rem;margin:.15rem 0 .6rem}
.tcard p{margin:.5rem 0}
.tcard ul{margin:.4rem 0;padding-left:1.25rem}
.tcard li{margin:.15rem 0}
.tcard .ex{margin:.6rem -.4rem 0;border-top:1px dashed var(--line);padding-top:.4rem}
.tcard .exb{position:relative}
.tcard .exsend{display:block;margin:.35rem auto .2rem;border-color:var(--pri);color:var(--pri);font-size:.9rem;padding:.35rem 1rem}
.tcard .exsend:disabled{opacity:.5}
.tcard .nhint{font-size:.78rem;color:var(--sub);margin:.1rem .5rem .1rem}
.tcard ol.notes{list-style:none;margin:.2rem .3rem .3rem;padding:0}
.tcard ol.notes li{display:flex;gap:.5rem;align-items:flex-start;margin:.2rem 0;padding:.25rem .35rem;border-radius:6px;font-size:.9rem;line-height:1.45;cursor:pointer}
.tcard ol.notes li.on{background:#fff1c9}
.tcard ol.notes .nb{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.3rem;height:1.3rem;border-radius:50%;background:#37474f;color:#fff;font-size:.74rem;font-weight:700;margin-top:.05rem}
.tcard ol.notes li.on .nb{background:#d84315}
svg .note{cursor:pointer}
svg .note .nb{fill:#37474f;stroke:#fff;stroke-width:1.5}
svg .note .nt{fill:#fff;font-size:10.5px;font-weight:700;pointer-events:none}
svg .note .nhl{fill:none;stroke:#d84315;stroke-width:2.6;opacity:0;pointer-events:none}
svg .note.on .nhl{opacity:1}
svg .note.on .nb{fill:#d84315}
.tnav{display:flex;align-items:center;gap:.5rem;margin-top:.8rem}
.tnav .dots{flex:1;text-align:center;letter-spacing:.25rem;color:#b9bec5}
.tnav .dots b{color:var(--ink)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.5rem 1rem;font-weight:600}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn:disabled{opacity:.45;cursor:default}

/* 盤面 */
.lvbar{display:flex;gap:.4rem;align-items:center;margin:.1rem 0 .5rem;flex-wrap:wrap}
.lvbar button{min-width:2.4rem;border:1px solid var(--line);background:#fff;border-radius:8px;padding:.2rem .4rem;font-size:.85rem;line-height:1.2}
.lvbar button.on{border-color:var(--ink);font-weight:700}
.lvbar button small{display:block;color:var(--star);font-size:.65rem;min-height:.8rem}
.lvbar button:disabled{opacity:.4}
.mission{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;margin:0 0 .5rem;font-size:.9rem}
.mission .mh{font-size:.78rem;color:var(--sub);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.mission .hint{font-size:.78rem;color:var(--sub);margin:.05rem 0 .15rem}
.mission .req{display:flex;align-items:flex-start;gap:.5rem;margin:.25rem 0}
.mission .req i{flex:none;width:.85rem;height:.85rem;border-radius:3px;margin-top:.3rem}
.mission .req span{flex:1}
.mission .req small{display:block;color:var(--sub);font-size:.78rem}
.mission .req small.now{color:#b35500}
.mission .req b{flex:none;font-size:.95rem;min-width:1.1em;text-align:center;color:#b9bec5}
.mission .req.ok b{color:var(--ok)}
.mission .req.ng b{color:var(--ng)}
.mission .mv{display:flex;flex-wrap:wrap;gap:.2rem .8rem;color:var(--sub);font-size:.8rem;margin-top:.3rem;border-top:1px dashed var(--line);padding-top:.3rem}
.mission .mv .st{color:var(--star)}
.board{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;touch-action:manipulation}
/* 「送ってみる」で、ルータに着くたびに経路表を引いて見せる小窓 */
.lk{position:absolute;z-index:5;background:#fff;border:1.5px solid #37474f;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.2);
  padding:.35rem .55rem .4rem;font-size:12px;line-height:1.35;pointer-events:none;opacity:0;transition:opacity .15s}
.lk.on{opacity:1}
.lk .h{font-weight:700;font-size:12.5px;white-space:nowrap}
.lk .d{color:var(--sub);font-size:11px;margin:.05rem 0 .25rem;white-space:nowrap}
.lk .d b{color:var(--ink);font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-weight:700}
.lk table{border-collapse:collapse;width:100%}
.lk td{padding:1px 4px;white-space:nowrap;font-size:11px;transition:background .12s,opacity .12s}
.lk td.p{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace}
.lk td.c{color:var(--sub);font-weight:700}
.lk td.n{color:var(--sub)}
.lk tr.scan td{background:#e3ecfa}
.lk tr.hit td{background:#fff3c4}
.lk tr.win td{background:#ffd98a;color:var(--ink);text-shadow:.35px 0 0 currentColor}      /* 太字にすると字の幅が変わって窓がずれる */
.lk tr.no td{opacity:.35}
.lk td.t{color:#a05a00;font-weight:700;font-size:10.5px;min-width:1.2em;position:relative}
.lk td.t .sz{visibility:hidden}                                       /* 列の幅だけ取る(札が変わっても窓の大きさが変わらない) */
.lk td.t .v{position:absolute;left:4px;top:1px}
.lk .r.wait{visibility:hidden}                                        /* 結果の行も最初から場所を取り、最後に見せる */
.lk tr.no td.t{color:#9aa0a6;opacity:1}
.lk tr.scan td.t{color:#1f63c6}
.lk .r{margin-top:.3rem;font-weight:700;font-size:11.5px}
.lk .ln{white-space:nowrap}
.lk .r.ok{color:#2a7d3a} .lk .r.ng{color:#c62828}
.board svg,.tcard svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.stepopt{display:inline-flex;align-items:center;gap:.35rem;margin:.45rem .2rem 0;font-size:.85rem;color:var(--ink);cursor:pointer}
.stepopt input{width:1rem;height:1rem}
.tcard .exctl{display:flex;justify-content:center;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.35rem 0 .2rem}
.tcard .exctl .exsend{margin:0}
.tcard .exctl .stepopt{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.78rem;color:var(--sub);margin:.45rem .2rem 0}
.facts{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.55rem .8rem;margin-top:.6rem;font-size:.88rem}
.facts h4{margin:.1rem 0 .2rem;font-size:.82rem;color:var(--sub)}
.facts p{margin:.2rem 0}
pre.cli{margin:.3rem 0;font-size:.8rem;background:#f6f7f9;border-radius:6px;padding:.4rem .6rem;overflow-x:auto;
  font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;line-height:1.45;white-space:pre-wrap}
.result{margin-top:.7rem;border-radius:10px;padding:.7rem .9rem;font-size:.92rem}
.result[hidden]{display:none}
.result.ok{background:#e9f5ec;border:1px solid #b6dcbf}
.result.ng{background:#fdecea;border:1px solid #f3c0bc}
.result .big{font-size:1.1rem;font-weight:700}
.result .stars{color:var(--star);font-size:1.3rem;letter-spacing:.1rem}
.result .acts{display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap}
.explain{margin-top:.7rem;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.5rem .9rem}
.explain summary{cursor:pointer;font-weight:600;color:var(--link);font-size:.92rem}
.explain[hidden]{display:none}
.explain h4{font-size:.85rem;margin:.6rem 0 .2rem;color:var(--sub)}
.explain p{margin:.15rem 0;font-size:.88rem}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.96);border-top:1px solid var(--line);
  padding:.55rem 16px calc(.55rem + env(safe-area-inset-bottom))}
.actbar[hidden]{display:none}
.actbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:.5rem}
.actbar .cnt{flex:1;color:var(--sub);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actbar .btn{padding:.5rem .8rem;font-size:.9rem}
.actbar .btn[hidden]{display:none}
.actbar .in[hidden]{display:none}
.actbar .pk{flex-direction:column;align-items:stretch;gap:.3rem}
.pk .st{font-size:.92rem;line-height:1.4}
.pk .st b{color:#d84315}
.pk .st small{display:block;color:var(--sub);font-size:.78rem}
.pk .row{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.pk .row .sp{flex:1}
.pk .chip2{border:1.5px solid #d84315;color:#d84315;background:#fff;border-radius:999px;padding:.25rem .7rem;font-size:.84rem;font-weight:700}
.pk .chip2.on{background:#d84315;color:#fff}
.pk .btn{padding:.4rem .8rem;font-size:.88rem}
.pk .ftop{display:flex;align-items:center;gap:.4rem}
.pk .ftop .fcmd{flex:1;min-width:0}
.pk .ftop .btn{padding:.32rem .75rem}
.pk .fcmd{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:.86rem;color:var(--sub)}
.pk .fcmd b{color:var(--ink)}
.pk .fcmd small{font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans CJK JP",system-ui,sans-serif;margin-left:.4rem;color:#bf360c}
.pk .fgrid{display:grid;grid-template-columns:1fr 1fr 1fr 4.4em;gap:.25rem .35rem}
.pk .fgrid label{display:flex;flex-direction:column;gap:0;min-width:0}
.pk .fgrid label span{font-size:.68rem;color:var(--sub);font-weight:700;line-height:1.3}
.pk .fgrid input{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:.88rem;padding:.3rem .45rem;border:1.5px solid var(--line);
  border-radius:7px;min-width:0;width:100%;box-sizing:border-box;background:#fff;color:var(--ink)}
.pk .fgrid input:focus{outline:none;border-color:var(--pri)}
.pk .fgrid input.bad{border-color:var(--ng);background:#fff5f5}
.pk .ferr{font-size:.82rem;line-height:1.45}
.pk .ferr[hidden]{display:none}
.pk .ferr .echo{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;white-space:pre-wrap;word-break:break-all;color:var(--ink);font-size:.78rem}
.pk .ferr .echo.cr{white-space:pre;word-break:normal;overflow-x:auto}
.pk .ferr .ios{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;color:var(--ng);font-weight:700;white-space:pre-wrap}
@media (max-width:460px){ .pk .fgrid{grid-template-columns:1fr 1fr} }
.pk .fgrid input.at{border-color:#d84315;box-shadow:0 0 0 2px #d8431522}
.pk .fgrid input[readonly]{cursor:pointer}
.pk .fcand{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center}
.pk .fcand .h{width:100%;font-size:.68rem;color:var(--sub);font-weight:700;line-height:1.2}
.pk .fcand button{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:.76rem;border:1.5px solid var(--line);background:#fff;color:var(--ink);
  border-radius:999px;padding:.14rem .5rem;line-height:1.3}
.pk .fcand button.on{background:var(--ink);border-color:var(--ink);color:#fff}
body.formopen main{padding-bottom:420px}
.addroute{display:block;width:100%;margin:.2rem 0 .1rem;border:1.5px solid var(--pri);background:#fff;color:var(--pri);border-radius:10px;padding:.55rem;font-weight:700;font-size:.95rem}
svg .pickhl{fill:none;stroke:#d84315;stroke-width:3;stroke-dasharray:7 4}
/* 宛先の範囲の光り(ステージ 5 から): 欄の宛先とマスク、または経路表で押した宛先が覆う拠点・LAN・端末 */
svg .rng{fill:#ffca28;fill-opacity:.2;stroke:#f9a825;stroke-width:2.4;pointer-events:none}
svg .rngh{fill:none;stroke:#f9a825;stroke-width:3.2;pointer-events:none}
svg .rngl{stroke:#ffca28;stroke-opacity:.55;stroke-width:9;stroke-linecap:round;pointer-events:none}
.rt td.hlp .chip{cursor:pointer}
.rt td.hlp .chip.on{outline:2.5px solid #f9a825;outline-offset:1px}
svg .picksrc{fill:none;stroke:#d84315;stroke-width:3.5}
.toast{position:fixed;left:50%;top:3.4rem;transform:translateX(-50%);z-index:40;background:#2b2f35;color:#fff;border-radius:8px;
  padding:.45rem .8rem;font-size:.85rem;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast[hidden]{display:none}

/* 下から出る枠 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  box-shadow:0 -6px 20px rgba(0,0,0,.12);border-radius:14px 14px 0 0;max-height:74vh;overflow-y:auto;
  padding:.6rem 16px calc(.7rem + env(safe-area-inset-bottom))}
.sheet[hidden]{display:none}
.sheet .in{max-width:560px;margin:0 auto}
.sheet .hd{display:flex;align-items:baseline;gap:.5rem}
.sheet .hd b{font-size:1.05rem;flex:1}
.sheet .hd button{border:0;background:none;font-size:1.4rem;line-height:1;padding:0 .2rem;color:var(--sub)}
.sheet .sb{color:var(--sub);font-size:.82rem;margin:.1rem 0 .3rem}
.sheet .sec{border-top:1px solid var(--line);margin-top:.5rem;padding-top:.45rem}
.sheet .sec h4{margin:0 0 .3rem;font-size:.88rem}
.sheet .note{color:var(--sub);font-size:.82rem;margin:.3rem 0}
.sheet .chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.3rem 0 .2rem}
.sheet .chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:.25rem .65rem;font-size:.84rem;font-weight:600}
.sheet .chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sheet .chips button:disabled{opacity:.4}
.sheet .chips button small{font-weight:400;opacity:.8;margin-left:.25rem}
.sheet .lbl{font-size:.78rem;color:var(--sub);margin:.4rem 0 0}
.rt{width:100%;border-collapse:collapse;font-size:.84rem}
.rt td{padding:.25rem .3rem;border-top:1px solid #eef0f2;vertical-align:middle}
.rt td.c{width:1.9rem;color:var(--sub);font-weight:700;white-space:nowrap}
.rt td.nh{color:var(--sub);font-size:.8rem}
.rt td.nh b{color:var(--ink)}
.rt td.x{text-align:right;white-space:nowrap}
.rt td.x button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:.05rem .45rem;font-size:.78rem;color:var(--ng)}
.rt tr.hit td{background:var(--hit)}
.rt tr.win td{background:var(--win)}
.rt td .tag{display:inline-block;font-size:.7rem;font-weight:700;color:#a05a00;margin-left:.2rem;white-space:nowrap}
.rt tr.skip td{color:#9aa0a6}
.rt tr.skip td .why{display:block;font-size:.72rem}
.chip{display:inline-block;border-radius:5px;padding:0 .35rem;font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:.8rem;border:1px solid;white-space:nowrap}
.ifrow{padding:.1rem 0}
.ifrow .t{font-size:.9rem}
.ifli{display:flex;align-items:baseline;gap:.5rem;width:100%;text-align:left;border:0;border-top:1px solid #eef0f2;background:none;padding:.45rem .1rem;flex-wrap:wrap}
.ifli b{font-size:.9rem}
.ifli .ip{font-size:.82rem}
.ifli .st{font-size:.78rem}
.ifli .st.up{color:var(--ok)} .ifli .st.down{color:var(--ng)}
.ifli small{color:var(--sub);font-size:.76rem}
.ifli .go{margin-left:auto;color:var(--sub);font-size:1.1rem}
.backlink{border:0;background:none;color:var(--link);padding:.5rem 0 .1rem;font-size:.85rem}
.ifrow .t{font-weight:700;font-size:.88rem}
.ifrow .t small{font-weight:400;color:var(--sub);margin-left:.3rem}
.ifrow .st{font-size:.8rem;margin-left:.3rem}
.ifrow .st.up{color:var(--ok)} .ifrow .st.down{color:var(--ng)}
.prev{font-size:.8rem;margin:.35rem 0;background:#f6f7f9;border-radius:6px;padding:.3rem .5rem;font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;word-break:break-all}
.addbtn{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:8px;padding:.35rem .9rem;font-weight:700}
.addbtn:disabled{opacity:.4}
.rules ul{margin:.2rem 0 .4rem;padding-left:1.15rem}
.rules li{margin:.25rem 0;font-size:.86rem}
.rules li.off{color:var(--sub)}
.rules p{font-size:.84rem;margin:.3rem 0}
.new{display:inline-block;font-size:.62rem;font-weight:700;color:#fff;background:var(--ng);border-radius:3px;padding:0 .25rem;margin-left:.3rem;vertical-align:1px;line-height:1.35}
.here{display:inline-block;font-size:.7rem;font-weight:700;color:#fff;background:var(--pri);border-radius:4px;padding:0 .35rem;margin-left:.3rem}

/* SVG の中 */
svg text{font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans CJK JP",system-ui,sans-serif}
svg .mono{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace}
svg .clk{cursor:pointer}
svg .band{fill:none;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;opacity:.2;pointer-events:none}
svg .band.ok{opacity:.32}
svg .trail{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:0.1 9;opacity:.85;pointer-events:none}
svg .pkt{pointer-events:none}
</style>
</head>
<body>
<header class="bar">
  <button id="b-home">‹</button>
  <div class="ttl" id="ttl">Route Path Builder</div>
  <button id="b-help" hidden>Rules</button>
  <button id="b-lang">日本語</button>
</header>
<main>
  <section class="view" id="v-home"></section>

function explainFlow(pz, ev, q, path){
  var X = IX(pz), E = (T[LANG] || T.en).ex, out = [];
  function f(s, o){ for (var k in o) s = s.split('{' + k + '}').join(o[k]); return s; }
  var src = X.H[q.src], dst = X.H[q.dst], d = dst.h.ip;
  if (path.end === 'nogw'){ out.push(f(E.nogw, {h:q.src, g:path.gw})); return out; }
  if (!path.hops.length){ out.push(f(E.sameNet, {h:q.src})); return out; }
  out.push(f(E.hand, {h:q.src, g:src.h.gw, r:path.hops[0]}));
  var seen = {};
  path.hops.forEach(function(r, k){
    if (seen[r]){ out.push(f(E.loopr, {r:r})); return; }
    seen[r] = 1;
    var tb = ev.tables[r], win = null, best = -1;
    tb.rows.forEach(function(x){ var len = +x.p.split('/')[1]; if (inPfx(d, x.p) && len > best){ best = len; win = x; } });
    var last = k === path.hops.length - 1;
    if (!win){ out.push(f(E.none, {r:r})); return; }
    if (win.code === 'C'){
      if (last && path.end === 'deliver') out.push(f(E.deliver, {r:r, p:win.p, i:win.out, h:path.host || q.dst}));
      else if (last) out.push(f(E.nohost, {r:r, d:d}));
      return;
    }
    if (win.res.some(function(z){ return z.out === 'Null0'; })){ out.push(f(E.nullr, {r:r, p:win.p})); return; }
    var nx = win.res.map(function(z){ return z.peer; }).join(', ');
    out.push(has(pz, 'linkip') ? f(E.rowIp, {r:r, p:win.p, ip:win.res.map(function(z){ return z.nh; }).join(', '), n:nx, o:win.res.map(function(z){ return z.out; }).join(', ')}) : f(E.row, {r:r, p:win.p, n:nx}));
  });
  return out;
}

// ------------------------------------------------------------------ 試験(?autotest=N): 各 level を解き、配置を検査する
function boxesOf(svg){
  var out = [];
  [].forEach.call(svg.querySelectorAll('.lbl'), function(e){ var b = e.getBBox(); out.push({x0:b.x, y0:b.y, x1:b.x + b.width, y1:b.y + b.height, e:e}); });
  return out;
}
function geomCheck(pz, svg, bad, tag){
  var H = pz.height, bx = boxesOf(svg);
  bx.forEach(function(b){
    if (b.x0 < -1 || b.y0 < -1 || b.x1 > W + 1 || b.y1 > H + 1) bad(tag + ' はみ出し ' + (b.e.textContent || b.e.tagName) + ' ' + [b.x0, b.y0, b.x1, b.y1].map(Math.round));
  });
  for (var i = 0; i < bx.length; i++) for (var j = i + 1; j < bx.length; j++){
    var a = bx[i], b = bx[j];
    if (a.e.tagName === 'rect' && b.e.tagName === 'rect' && a.e.getAttribute('rx') === '8' && b.e.getAttribute('rx') === '8') continue;
    if (a.x0 < b.x1 - 1 && b.x0 < a.x1 - 1 && a.y0 < b.y1 - 1 && b.y0 < a.y1 - 1){
      // LAN の札の中の端末名は重なってよい(札の中にある)
      var lanA = a.e.getAttribute('rx') === '8', lanB = b.e.getAttribute('rx') === '8';
      var ipcA = a.e.classList.contains('ipc'), ipcB = b.e.classList.contains('ipc');
      if (lanA !== lanB && !ipcA && !ipcB) continue;
      bad(tag + ' 重なり ' + (a.e.textContent || a.e.tagName + (a.e.getAttribute('class') || '')) + [a.x0, a.y0, a.x1, a.y1].map(Math.round) + ' × ' + (b.e.textContent || b.e.tagName + (b.e.getAttribute('class') || '')) + [b.x0, b.y0, b.x1, b.y1].map(Math.round));
    }
  }
}
function autotest(){
  var out = [], ng = 0, pre = $('autotest');
  function log(s){ out.push(s); }
  function bad(s){ ng++; log('NG ' + s); }
  var jobs = [];
  S.ov.stages.forEach(function(st){ if (!st.ready) return; for (var lv = 1; lv <= st.levels; lv++) for (var k = 0; k < AUTOTEST; k++) jobs.push([st.id, lv, k]); });
  var n = 0;
  function one(i){
    if (i >= jobs.length){
      pre.hidden = false; pre.textContent = 'autotest: ' + n + ' 盤面・NG ' + ng + '\n' + out.join('\n');
      return;
    }
    var j = jobs[i], sd = j[2] ? '&seed=' + (1000 + j[2]) : '', tag = j[0] + '-' + j[1] + '#' + j[2];
    apiGet('puzzle?stage=' + j[0] + '&level=' + j[1] + sd).then(function(pz){
      n++;
      S.pz = pz; S.stage = j[0]; S.level = j[1];
      if (pz.eval.ok) bad(tag + ' 初期で ok');
      var s = $('svg');
      drawBoard(s, pz, pz.init, pz.eval, {flows:'result'});
      geomCheck(pz, s, bad, tag);
      if (pz.knobs.indexOf('add') >= 0) pz.routers.forEach(function(r){
        if (r.fixed) return;
        S.form = {r:r.name, chips:true, dst:'', mask:'', gw:'', ad:''};
        drawBoard(s, pz, pz.init, pz.eval, {flows:'none'});
        geomCheck(pz, s, bad, tag + ' ②' + r.name);
        S.form = null;
      });
      return apiPost('eval', {stage:j[0], level:j[1], seed:pz.seed, reveal:true}).then(function(ev){
        if (!ev.ok || ev.stars !== 3) bad(tag + ' 答えで ok にならない');
        if (movesOf(pz, ev.cfg) !== ev.moves) bad(tag + ' 手数の数え方が違う ' + movesOf(pz, ev.cfg) + ' ≠ ' + ev.moves);
        drawBoard(s, pz, ev.cfg, ev, {flows:'result'});
        geomCheck(pz, s, bad, tag + '(解)');
        return apiPost('eval', {stage:j[0], level:j[1], seed:pz.seed, cfg:ev.cfg}).then(function(e2){
          if (!e2.ok) bad(tag + ' 答えを送り直して ok にならない');
        });
      });
    }).catch(function(e){ bad(tag + ' ' + e); }).then(function(){ one(i + 1); });
  }
  show('play');
  noteCheck(bad);
  one(0);
}
function noteCheck(bad){
  S.ov.stages.forEach(function(st){
    (st.cards || []).forEach(function(c, ci){
      if (!c.example || !c.notes) return;

    var nr16 = document.querySelectorAll('#svg .rngh').length;
    setF('dst', srv5); setF('mask', '255.255.255.255'); await wait(30);
    var nr32 = document.querySelectorAll('#svg .rngh').length;
    ok(nr16 === 3 && nr32 === 1, '光りは /16 で 3 台・/32 で 1 台(' + nr16 + '/' + nr32 + ')');
    setF('dst', lan5); setF('mask', '255.255.255.128'); setF('gw', gw5); click('#f-ok');
    ok(!!S.form && $('f-err').textContent.indexOf(tt('fe', 'lenRule')) >= 0, '/25 はこのステージでは書けない');
    setF('dst', S.pz.links[0].prefix.split('/')[0]); setF('mask', '255.255.255.252'); click('#f-ok');
    ok(!!S.form && $('f-err').textContent.indexOf(tt('fe', 'lenRule')) >= 0, '/30 も書けない');
    setF('dst', '10.2.0.0'); setF('mask', '255.255.0.0'); click('#f-ok');
    ok(!!S.form && $('f-err').textContent.indexOf(tt('fe', 'noHostIn', {p:'10.2.0.0/16'})) >= 0, '端末のいない範囲は書けない');
    setF('dst', lan5); setF('mask', '255.255.255.0'); click('#f-ok'); await wait(300);
    ok(!S.form, '🔒 と同じ /24 は書ける');
    click('#b-send');
    ok(await until(function(){ var c = document.querySelector('.lk.on table'); return c && c.closest('.lk').textContent.indexOf('🔒') >= 0; }, 6000), '経路表の小窓で 🔒 の行に印');
    ok(await until(function(){ return !S.busy && !!testedEv(); }, 20000) && $('mission').textContent.indexOf(t('split', {n:2})) >= 0, '🔒 と同じ /24 では道が 2 つに分かれる');
    startOver(true);
    openSheet({kind:'router', r:'R1'}); await wait(50); click('#sh-b .addroute');
    setF('dst', srv5); setF('mask', '255.255.255.255'); setF('gw', gw5); click('#f-ok'); await wait(300);
    click('#b-send');
    ok(await until(function(){ return S.done; }, 20000), '/32 を足して開通');
    // ステージ 5 Lv 3: 残っていた /32 が connected の /24 に勝って戻りがループ → 消すと戻りが届く
    location.hash = '#p5-3'; await until(function(){ return S.pz && S.pz.stage === 5 && S.level === 3 && !S.done; });
    var pc5 = IX(S.pz).H.PC1.h.ip + '/32';
    ok(S.ev.reqs[1].now[0].end === 'loop', 'Lv 3 は初めは戻りがループ');
    openSheet({kind:'router', r:'R1'}); await wait(50);
    var row32 = [].filter.call(document.querySelectorAll('#sh-b table.rt tr'), function(tr){ return tr.textContent.indexOf(pc5) >= 0; })[0];
    ok(!!row32 && !!row32.querySelector('td.x button'), '/32 の行は消せる');
    click(row32.querySelector('td.x button')); await wait(300);
    ok(S.ev.reqs[1].now[0].end !== 'loop', '/32 を消すとループしない');
  }catch(e){ ng++; out.push('NG 例外 ' + e); }
  var pre = $('autotest'); pre.hidden = false; pre.textContent = 'uitest: NG ' + ng + '\n' + out.join('\n');
}

// ------------------------------------------------------------------ 起動
$('b-home').addEventListener('click', function(){
  if (this.dataset.to === 'portal'){ location.href = '/'; return; }
  location.hash = '';
});
$('b-lang').addEventListener('click', function(){
  LANG = LANG === 'ja' ? 'en' : 'ja'; store('rtp.lang', LANG);
  route();
});
$('b-help').addEventListener('click', function(){ openSheet({kind:'rules'}); });
$('sh-x').addEventListener('click', closeSheet);
$('b-over').addEventListener('click', function(){ startOver(false); });
$('b-show').addEventListener('click', function(){ reveal(false); });
$('b-send').addEventListener('click', function(){
  if (S.busy){
    if (GATE) return stepNext();
    S.ff = true; this.disabled = true; [].forEach.call(document.querySelectorAll('.lk'), function(c){ c.remove(); }); return;
  }
  sendTest();
});
$('b-rest').addEventListener('click', stepRest);
$('stepchk').addEventListener('change', function(){ STEP = this.checked; store('rtp.step', STEP ? '1' : '0'); [].forEach.call(document.querySelectorAll('.tcard .exstep input'), function(x){ x.checked = STEP; }); stepUi(); });
$('b-next').addEventListener('click', function(){
  var st = stageOf(S.stage);
  location.hash = S.level < st.levels ? '#p' + S.stage + '-' + (S.level + 1) : '';
});
window.addEventListener('hashchange', route);
apiGet('state').then(function(ov){
  S.ov = ov;
  if (AUTOTEST) return autotest();
  if (UITEST) return uitest();
  route();
});
})();
</script>
</body>
</html>
